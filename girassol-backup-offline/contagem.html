<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contagem de Estoque · Magazine Girassol</title>
<!--
  ─────────────────────────────────────────────────────────────────────────────
  CONTAGEM DE ESTOQUE — registro interno (22/09/2026)  ·  build c1

  Pedido do dono: o funcionário acha o produto por SKU, EAN ou PARTE DO NOME, vê
  o nome completo e a foto, e lança a quantidade que contou.

  Três coisas que ele decidiu e que estão por trás de cada escolha aqui:
   · NÃO grava no Bling. É registro interno; ele revisa e decide o que enviar.
     A tela diz isso em letra grande, pra ninguém achar que ajustou o saldo.
   · É CONTAGEM (o saldo que a pessoa contou), não entrada/saída.
   · Girassol primeiro; a lib já nasce com a empresa como parâmetro.

  Feita pra galpão: campo grande, foco automático, leitor de código de barras
  funciona sozinho (ele digita e dá Enter), e o teclado numérico abre no celular.
  ────────────────────────────────────────────────────────────────────────────
-->
<style>
/* ═══ CONTAGEM DE ESTOQUE · decisões de design ═══════════════════════════════
   Quem usa: o pessoal do galpão, de pé, num monitor compartilhado ou no celular,
   bipando código o turno inteiro. O trabalho da tela é um só: achar o produto
   rápido e registrar quanto tem. Tudo que não serve a isso sai.

   COR — âmbar de girassol (#F2B33D) sobre azul-noite. O âmbar não é enfeite:
   é a cor da empresa e a única cor forte da página, então ela marca exatamente
   onde a pessoa deve agir (a busca em foco, o botão de salvar). Verde e vermelho
   ficam reservados pro que é leitura de dado — confere / não confere.

   TIPO — família do sistema, de propósito: fonte web num celular de galpão com
   wifi ruim atrasa a primeira tela, e aqui velocidade é a função. A hierarquia
   vem de tamanho e peso, não de mais uma família.

   O QUE NÃO TEM, e é escolha: nada em CAIXA ALTA (rótulo gritado cansa e não
   informa), nenhum rótulo flutuando acima de campo que já se explica, e a
   quantidade grande é o número em si — não um card com borda e sombra em volta.
   ──────────────────────────────────────────────────────────────────────────── */
  :root{
    --noite:#0b1020;      /* fundo */
    --carta:#141b2e;      /* superfície */
    --carta2:#1b2439;     /* superfície sobre superfície */
    --linha:#273149;
    --texto:#e8ecf5;
    --calmo:#8d9ab8;      /* texto secundário */
    --girassol:#f2b33d;   /* a cor da empresa — e a única cor de ação */
    --girassol-fraco:#3a2e12;
    --confere:#3ddc84;
    --difere:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--noite);color:var(--texto);
       font:16px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,sans-serif;
       padding:0 16px 72px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto}   /* linha curta: nome de produto se lê melhor */

  /* cabeçalho discreto — ele não é o assunto */
  .top{padding:20px 0 4px}
  .marca{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .marca h1{font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em}
  .marca .empresa{font-size:14px;color:var(--calmo)}
  .build{font-size:11px;color:var(--calmo);opacity:.6;margin-left:auto}

  /* ── a busca, que é o herói ── */
  .busca-hero{display:flex;align-items:center;gap:10px;margin:18px 0 8px;
              background:var(--carta);border:1.5px solid var(--linha);
              border-radius:14px;padding:0 14px;transition:border-color .12s}
  .busca-hero:focus-within{border-color:var(--girassol);
                           box-shadow:0 0 0 4px var(--girassol-fraco)}
  .busca-icone{font-size:20px;opacity:.75;flex:none}
  .busca-campo{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--texto);
               font:500 19px/1.2 inherit;padding:18px 0}
  .busca-campo::placeholder{color:var(--calmo);font-weight:400}
  .busca-limpar{border:0;background:none;color:var(--calmo);font-size:26px;line-height:1;
                cursor:pointer;padding:6px 4px;display:none}
  .busca-limpar:hover{color:var(--texto)}
  .busca-hero.tem-texto .busca-limpar{display:block}
  .busca-ajuda{color:var(--calmo);font-size:13px;margin:0 0 18px;padding:0 2px}
  .nota-interna{color:var(--calmo);font-size:13px;margin:26px 0 8px;padding-left:12px;
                border-left:2px solid var(--linha)}

  /* ── resultados da busca: alvo grande, um por linha ── */
  .lista-nome{display:flex;gap:12px;align-items:center;width:100%;text-align:left;
              padding:13px 14px;margin:8px 0;background:var(--carta);
              border:1px solid var(--linha);border-radius:12px;color:inherit;
              cursor:pointer;font:inherit}
  .lista-nome:hover,.lista-nome:focus-visible{border-color:var(--girassol);outline:0}
  .lista-nome b{display:block;font-size:15px;font-weight:600;line-height:1.35}
  .lista-nome span{font-size:12.5px;color:var(--calmo)}

  .aviso{background:var(--carta);border:1px solid var(--linha);border-left:3px solid var(--girassol);
         border-radius:0 10px 10px 0;padding:12px 14px;margin:10px 0;font-size:14px}

  /* ── lançar ── */
  .bloco{background:var(--carta);border:1px solid var(--linha);border-radius:14px;
         padding:16px;margin:16px 0}
  .bloco h2{font-size:15px;font-weight:600;margin:0 0 10px}
  .dim{color:var(--calmo);font-size:13px}
  .prod{display:flex;gap:14px;align-items:flex-start;margin:4px 0 16px}
  .prod img,.prod .semfoto{width:104px;height:104px;border-radius:10px;background:var(--carta2);flex:none}
  .prod img{object-fit:contain}
  .prod .semfoto{display:flex;align-items:center;justify-content:center;color:var(--calmo);
                 font-size:11px;text-align:center}
  .prod h3{margin:0 0 6px;font-size:16px;font-weight:600;line-height:1.35}

  .campo{width:100%;padding:12px 14px;font-size:16px;background:var(--noite);color:var(--texto);
         border:1px solid var(--linha);border-radius:10px;outline:none}
  .campo:focus{border-color:var(--girassol)}
  .campo.qtd{width:150px;font-size:30px;font-weight:700;text-align:center;padding:10px}

  .btn{padding:13px 20px;font-size:15px;font-weight:600;border-radius:11px;cursor:pointer;
       background:var(--girassol);color:#231a05;border:0}
  .btn:hover{filter:brightness(1.07)}
  .btn:disabled{opacity:.45;cursor:default;filter:none}
  #btCancelar{background:var(--carta2);color:var(--texto);border:1px solid var(--linha)}

  /* ── contagens do dia ── */
  .item{display:flex;align-items:center;gap:13px;background:var(--carta);
        border:1px solid var(--linha);border-radius:12px;padding:11px 13px;margin:9px 0}
  .item .thumb{width:48px;height:48px;border-radius:9px;background:var(--carta2);
               flex:none;object-fit:contain}
  .item .semfoto-mini{display:flex;align-items:center;justify-content:center;color:var(--calmo);
                      font-size:9px;line-height:1.1;text-align:center}
  .item .info{flex:1;min-width:0}
  /* nome sem corte: com prefixo longo igual ("Lixa 4 Pol. 100mm Diamantada… GRÃO:50" e
     "…GRÃO:3000"), truncar esconde justamente o que diferencia. O cartão cresce. */
  .item .nome{font-size:14.5px;font-weight:600;line-height:1.35}
  .item .meta{font-size:12.5px;color:var(--calmo);margin-top:3px}
  .item .sku{font-weight:600;color:var(--texto);opacity:.85}
  .item .qtd-box{text-align:center;flex:none;min-width:56px}
  .item .qtd-num{font-size:26px;font-weight:700;line-height:1.05}
  .item .qtd-lbl{font-size:11px;color:var(--calmo)}
  .qtd-num.edit{background:none;border:0;color:inherit;font:inherit;font-size:26px;
                font-weight:700;cursor:pointer;padding:2px 7px;border-radius:8px}
  .qtd-num.edit:hover{background:var(--carta2)}
  .qtd-edit{width:82px;font-size:24px;font-weight:700;text-align:center;padding:6px;
            background:var(--noite);color:var(--texto);border:1.5px solid var(--girassol);
            border-radius:9px}
  .mais-menos{display:flex;gap:7px;flex:none}
  .mais-menos button{width:44px;height:44px;font-size:21px;font-weight:600;border-radius:11px;
                     border:1px solid var(--linha);background:var(--carta2);color:var(--texto);
                     cursor:pointer}
  .mais-menos button:hover{border-color:var(--girassol)}
  .mais-menos button:disabled{opacity:.4;cursor:default}
  .mais-menos .excluir{font-size:16px}
  .mais-menos .excluir:hover{border-color:var(--difere)}
  .dif{font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;flex:none;white-space:nowrap}
  .dif.zero{background:rgba(61,220,132,.13);color:var(--confere)}
  .dif.nao{background:rgba(255,107,107,.13);color:var(--difere)}
  .dif.sem{background:var(--carta2);color:var(--calmo)}

  :focus-visible{outline:2px solid var(--girassol);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:560px){
    .busca-campo{font-size:17px;padding:16px 0}
    .item{flex-wrap:wrap}
    .item .info{flex-basis:calc(100% - 61px)}
    .campo.qtd{width:100%}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="marca">
      <h1>Contagem de estoque</h1>
      <span class="empresa">Magazine Girassol</span>
      <span class="build">c12</span>
    </div>
  </header>

  <!-- A BUSCA É O HERÓI DESTA TELA. O funcionário passa o turno nela: bipa, procura, lança,
       repete. Antes era um campo pequeno espremido embaixo de um rótulo — o dono disse que
       estava "muito ruim, layout bem pobre", e estava: o elemento mais usado era o menor da
       página. Agora ela ocupa a largura toda, tem altura de alvo de dedo e o texto grande o
       bastante pra ser lido de pé, a um braço de distância do monitor do galpão. -->
  <div class="busca-hero">
    <span class="busca-icone" aria-hidden="true">🔍</span>
    <input id="busca" class="busca-campo" autofocus autocomplete="off"
           placeholder="Bipe o código ou digite o produto"
           aria-label="Procurar produto por SKU, código de barras ou nome"
           oninput="aoDigitar(this.value)"
           onkeydown="if(event.key==='Enter'){event.preventDefault();procurar();}">
    <button type="button" id="btLimparBusca" class="busca-limpar" title="limpar" aria-label="Limpar busca">×</button>
  </div>
  <p class="busca-ajuda">Procura por SKU, código de barras ou parte do nome. Kits não aparecem —
    conte os produtos que compõem o kit.</p>

  <div id="resultado"></div>

  <p class="nota-interna">O saldo do Bling não muda por aqui. As contagens ficam guardadas pra você conferir.</p>

  <section class="bloco" id="painelLanc" style="display:none">
    <h2>✍️ Lançar contagem</h2>
    <div id="prodEscolhido"></div>
    <label class="dim" for="qtd">Quantidade contada</label><br>
    <input id="qtd" class="campo qtd" type="number" inputmode="numeric" min="0" step="1"
           onkeydown="if(event.key==='Enter'){event.preventDefault();lancar();}">
    <div style="margin-top:12px">
      <button class="btn" onclick="lancar()">Salvar contagem</button>
      <button id="btCancelar" class="btn" onclick="limpar()">Cancelar</button>
    </div>
    <div id="msgLanc" class="dim" style="margin-top:8px"></div>
  </section>

  <section class="bloco">
    <h2>📋 Contagens de hoje</h2>
    <div id="hoje"><span class="dim">carregando…</span></div>
  </section>
</div>

<script>
const MOD = '/girassol-backup-offline';
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ESCOLHIDO = null;
let LIMPAR_TIMER = null;

/* Codex (P2): toISOString() é UTC. Entre 21h e meia-noite em São Paulo já é dia seguinte em
   UTC — "Contagens de hoje" pedia a data de amanhã 3h mais cedo e a lista ficava vazia bem no
   fim do turno. Mesmo padrão do resto da casa (painel.html, dashboard.html): sv-SE com
   timeZone força o fuso certo sem depender do TZ do servidor. */
function hojeISO(){ return new Date().toLocaleString('sv-SE',{timeZone:'America/Sao_Paulo'}).slice(0,10); }
function horaSP(iso){ try { return new Date(iso).toLocaleString('sv-SE',{timeZone:'America/Sao_Paulo'}).slice(11,16); } catch(e){ return String(iso||'').slice(11,16); } }

/* 22/09 — MOSTRA ENQUANTO DIGITA, pedido do dono: "ele digitar lixa e já ir mostrando todos os
   produtos com esse nome". É o padrão da consulta do checkout offline (oninput).

   Duas travas que o pedido não menciona mas o galpão exige:
   · espera 300 ms parado antes de procurar — sem isso "lixa" dispara 4 buscas, e quem digita
     rápido gera respostas que chegam fora de ordem;
   · enquanto digita, só o ÍNDICE LOCAL. O Bling fica reservado pro Enter e pro clique no item,
     que é quando precisamos do saldo real. Buscar lá por tecla seria a cota da conta indo
     embora — e a operação perde primeiro. */
let _tDigita = null, _seqBusca = 0;

function aoDigitar(v){
  /* o × só aparece quando há o que limpar: botão permanente que não faz nada vira ruído */
  const hero = document.querySelector('.busca-hero');
  if(hero) hero.classList.toggle('tem-texto', String(v || '').length > 0);
  clearTimeout(_tDigita);
  const q = String(v || '').trim();
  if(q.length < 3){
    /* Codex #509 (P2, r3): apagar de volta pra menos de 3 letras limpava a TELA, mas não
       invalidava a busca ainda em voo — ela passava direto pela checagem de _seqBusca lá
       embaixo (nada tinha incrementado o contador) e repopulava a lista pra um texto que já
       não está mais no campo, deixando o funcionário escolher pelo texto errado. */
    _seqBusca++;
    if(!ESCOLHIDO) document.getElementById('resultado').innerHTML = '';
    return;
  }
  _tDigita = setTimeout(() => buscarPorNome(q, false), 300);
}

async function procurar(){
  const q = document.getElementById('busca').value.trim();
  if(!q) return;
  /* Codex #509 (P1, r3): o Enter do leitor de código de barras cai bem dentro da janela dos
     300ms do debounce — aoDigitar já tinha agendado um buscarPorNome pro texto anterior, e
     ele dispara sozinho DEPOIS, incrementando _seqBusca e fazendo a resposta certa (a deste
     código) ser descartada como se fosse velha. Cancela o debounce antes de tudo, igual
     mostrarProduto já fazia pro caminho do clique. */
  clearTimeout(_tDigita);
  const alvo = document.getElementById('resultado');
  alvo.innerHTML = '<span class="dim">procurando…</span>';

  /* SKU e EAN vão ao Bling (precisam do saldo e da foto do momento); nome vai no
     índice local — o Bling é cota da conta, e busca por nome dispararia uma
     consulta por tecla. */
  const meuPed = ++_seqBusca;   // mesma trava: o último bipe é o que vale
  const soDigitos = q.replace(/\D/g, '');
  /* Codex (P2): qualquer palavra única (sem espaço) batia aqui — "luminaria", "martelo" — e
     ISSO ia pro /buscar-produto primeiro, que tenta o Bling em 3 caixas antes de desistir.
     A busca por nome comum (o caso mais frequente) gastava 2-3 chamadas da cota por tecla,
     exatamente o que a busca local existe pra evitar. SKU de verdade tem dígito; nome não
     precisa. Se um dia existir SKU 100% alfabético, o fallback pro nome (linha abaixo)
     ainda encontra pelo índice — essa tela nunca fica cega, só evita o desperdício comum. */
  const pareceCodigo = (/^[A-Za-z0-9._-]+$/.test(q) && /\d/.test(q)) || (soDigitos.length >= 8 && soDigitos.length <= 14);

  if(pareceCodigo){
    let d = null;
    try {
      const r = await fetch(MOD+'/buscar-produto?q='+encodeURIComponent(q), {credentials:'same-origin'});
      d = await r.json().catch(()=>null);
    } catch(e){ d = null; }
    if(meuPed !== _seqBusca) return;   // outro código foi bipado enquanto este vinha
    if(d && d.ok && d.produto){ mostrarProduto(d.produto); return; }
    /* não achou como código: tenta pelo nome antes de desistir — SKU com letras
       também casa com a busca de nome, e o funcionário não tem que saber disso */
  }
  await buscarPorNome(q, pareceCodigo);
}

async function buscarPorNome(q, veioDeCodigo){
  /* com a busca saindo a cada pausa, duas respostas podem chegar fora de ordem e a lista de
     "lix" sobrescrever a de "lixa". O contador diz qual é a mais recente; as atrasadas somem
     em silêncio. */
  const meu = ++_seqBusca;
  const alvo = document.getElementById('resultado');
  let d = null;
  try {
    const r = await fetch(MOD+'/buscar-produto-nome?q='+encodeURIComponent(q), {credentials:'same-origin'});
    d = await r.json().catch(()=>null);
  } catch(e){ d = null; }
  if(meu !== _seqBusca) return;
  if(!d || !d.ok){
    alvo.innerHTML = '<div class="aviso">Não consegui procurar agora — isto <b>não</b> quer dizer que o produto não existe. Tente de novo.</div>';
    return;
  }
  if(d.erro && !d.itens.length){ alvo.innerHTML = '<span class="dim">'+esc(d.erro)+'</span>'; return; }
  if(!d.itens.length){
    /* separar "o índice está vazio" de "não achei" de "não achei, mas o catálogo ainda não foi
       indexado por INTEIRO": as três mandam fazer coisas diferentes. Codex #509 (P2, r3): o
       servidor já manda indice_completo (basta UM produto resolvido antes pro índice deixar
       de estar vazio, sem que isso signifique cobertura completa), mas esta tela ainda só
       olhava indice_vazio — "nada encontrado" parecia definitivo quando podia só ser produto
       ainda não indexado. */
    alvo.innerHTML = d.indice_vazio
      ? '<div class="aviso">A busca por nome ainda não está disponível — o catálogo precisa ser indexado uma vez. Avise o responsável.</div>'
      : (!d.indice_completo
        ? '<div class="aviso">Não encontrei <b>'+esc(q)+'</b>'+(veioDeCodigo?' (nem como código, nem no nome)':'')+', mas o catálogo ainda não foi indexado por inteiro — pode ser que o produto exista e ainda não apareça aqui. Tente o SKU ou o código de barras, ou avise o responsável pra indexar o catálogo.</div>'
        : '<div class="aviso">Nada encontrado para <b>'+esc(q)+'</b>'+(veioDeCodigo?' (nem como código, nem no nome)':'')+'.</div>');
    return;
  }
  alvo.innerHTML = '<div class="dim">'+d.itens.length+' resultado(s) — toque no produto:</div>' +
    d.itens.map(it => '<button class="lista-nome" onclick="abrirPorSku('+JSON.stringify(it.sku).replace(/"/g,'&quot;')+')">' +
      '<b>'+esc(it.nome || '(sem nome)')+'</b><span>'+esc(it.sku)+(it.ean?' · '+esc(it.ean):'')+'</span></button>').join('');
}

async function abrirPorSku(sku){
  /* Codex #509 (P2): bipar um segundo código com o primeiro ainda em voo fazia as DUAS
     respostas chamarem mostrarProduto — e valia a que chegasse por último, mesmo sendo a mais
     antiga. A contagem então ia pro produto errado. Mesma trava da busca por nome. */
  const meu = ++_seqBusca;
  const alvo = document.getElementById('resultado');
  alvo.innerHTML = '<span class="dim">abrindo '+esc(sku)+'…</span>';
  let d = null;
  try {
    const r = await fetch(MOD+'/buscar-produto?q='+encodeURIComponent(sku), {credentials:'same-origin'});
    d = await r.json().catch(()=>null);
  } catch(e){ d = null; }
  if(meu !== _seqBusca) return;   // outro código foi bipado enquanto este vinha
  if(d && d.ok && d.produto) mostrarProduto(d.produto);
  else alvo.innerHTML = '<div class="aviso">Não consegui abrir <b>'+esc(sku)+'</b> agora.</div>';
}

function mostrarProduto(p){
  clearTimeout(_tDigita);   // escolheu: para de procurar enquanto ele digita a quantidade
  _seqBusca++;              // e descarta qualquer resposta que ainda esteja a caminho
  if(LIMPAR_TIMER){ clearTimeout(LIMPAR_TIMER); LIMPAR_TIMER = null; }   // veio um produto novo: o reset pendente do lançamento anterior não pode apagar ESTE
  ESCOLHIDO = p;
  document.getElementById('resultado').innerHTML = '';
  document.getElementById('prodEscolhido').innerHTML =
    '<div class="prod">' +
    (p.img ? '<img src="'+esc(p.img)+'" alt="">' : '<div class="semfoto">sem foto<br>no Bling</div>') +
    '<div><h3>'+esc(p.nome || '(sem nome)')+'</h3>' +
    '<div class="dim">SKU <b>'+esc(p.sku)+'</b>'+(p.ean?' · EAN '+esc(p.ean):'')+'</div>' +
    (p.localizacao ? '<div class="dim">📍 '+esc(p.localizacao)+'</div>' : '') +
    '<div style="margin-top:6px">Saldo no Bling agora: <b id="saldoAgora">'+(p.estoque!=null?esc(p.estoque):'—')+' <span class="dim" style="font-size:10px">(conferindo…)</span></b></div>' +
    '</div></div>';
  document.getElementById('painelLanc').style.display = '';
  const q = document.getElementById('qtd');
  q.disabled = false;
  q.value = '';            // nunca pré-preencher com o saldo do Bling: a pessoa
  q.focus();               // confirmaria o número da tela em vez de contar
  atualizarSaldoAoVivo(p);
}

/* Codex (P1): /buscar-produto usa um cache sem TTL (limpo só quando o ciclo do checkout
   roda) — pra quem já foi resolvido no ciclo atual, o saldo mostrado pode ser velho de
   horas. Aqui o saldo É o dado guardado como "agora"; uma venda no meio do caminho vira
   uma divergência gravada errada e permanente. Busca de novo, sem cache, direto no Bling,
   e só então libera pra digitar — se essa segunda chamada falhar, fica o saldo que veio
   do /buscar-produto (com o aviso já sumindo), melhor que travar quem está contando. */
async function atualizarSaldoAoVivo(p){
  let d = null;
  try {
    const r = await fetch(MOD+'/contagem-saldo?sku='+encodeURIComponent(p.sku), {credentials:'same-origin'});
    d = await r.json().catch(()=>null);
  } catch(e){ d = null; }
  if(ESCOLHIDO !== p) return;   // trocou de produto enquanto a chamada estava no ar
  const el = document.getElementById('saldoAgora');
  if(d && d.ok && d.saldo != null){
    ESCOLHIDO.estoque = d.saldo;
    if(el) el.innerHTML = esc(d.saldo);
  } else if(el){
    el.innerHTML = (p.estoque!=null?esc(p.estoque):'—') + ' <span class="dim" style="font-size:10px">(pode estar desatualizado)</span>';
  }
}

function limpar(){
  /* "Cancelar" pode ser clicado DENTRO da janela de 1.2s do reset automático pós-salvar
     (o painel continua visível até o timer rodar). Sem cancelar o setTimeout de verdade
     — só zerar a variável não basta —, ele dispara depois sozinho e apaga o PRÓXIMO
     produto que o funcionário já tinha aberto: o mesmo bug da corrida do scanner (Codex
     P2), só que pelo caminho do botão em vez do bipe. */
  if(LIMPAR_TIMER){ clearTimeout(LIMPAR_TIMER); }
  LIMPAR_TIMER = null;
  ESCOLHIDO = null;
  document.getElementById('painelLanc').style.display = 'none';
  document.getElementById('msgLanc').textContent = '';
  document.getElementById('busca').value = '';
  document.getElementById('busca').focus();
}

let _salvando = false;

async function lancar(){
  if(!ESCOLHIDO) return;
  /* Codex #509 (P2): em conexão lenta o botão e o Enter continuavam ativos até a resposta
     chegar — dois cliques (ou Enter repetido, que é o reflexo de quem bipa o dia todo) mandavam
     dois POST iguais, e o servidor gravava os dois: a mesma contagem aparecia em dobro e a
     revisão não teria como saber qual era real. */
  if(_salvando) return;
  _salvando = true;
  const btnSalvar = document.querySelector('#painelLanc .btn');
  const btnCancelar = document.getElementById('btCancelar');
  const campoBusca = document.getElementById('busca');
  /* Codex #509 (P2, r3): só o botão Salvar era travado. Cancelar e a busca continuavam livres
     durante o POST — cancelar no meio do caminho zera ESCOLHIDO, e um salvamento que terminasse
     bem-sucedido DEPOIS disso quebraria tentando ler campos de um produto que já não existe
     mais; abrir OUTRO produto no meio do caminho fazia a resposta do lançamento anterior
     aparecer (e travar/destravar campos) em cima do produto novo, errado. */
  if(btnSalvar) btnSalvar.disabled = true;
  if(btnCancelar) btnCancelar.disabled = true;
  if(campoBusca) campoBusca.disabled = true;
  try {
    await lancarDeVerdade();
  } finally {
    _salvando = false;
    if(btnSalvar) btnSalvar.disabled = false;
    if(btnCancelar) btnCancelar.disabled = false;
    if(campoBusca) campoBusca.disabled = false;
  }
}

async function lancarDeVerdade(){
  const msg = document.getElementById('msgLanc');
  const bruto = (document.getElementById('qtd').value || '').trim();
  if(bruto === ''){ msg.innerHTML = '<b>Digite a quantidade contada.</b>'; return; }
  const n = Number(bruto);
  if(!isFinite(n) || n < 0 || Math.floor(n) !== n){
    msg.innerHTML = '<b>Quantidade inválida</b> — use um número inteiro a partir de 0.'; return;
  }
  /* Codex #509 (P2, r3): captura o produto ENVIADO agora — com busca e Cancelar travados ele
     não pode mais mudar até a resposta voltar, mas ler direto de ESCOLHIDO mais abaixo seria
     confiar nisso por acidente. Usar a cópia local deixa a garantia explícita mesmo se o
     travamento de UI acima um dia for removido ou contornado. */
  const produto = ESCOLHIDO;
  msg.textContent = 'salvando…';
  let d = null;
  try {
    const r = await fetch(MOD+'/contagem-lancar', {
      method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ sku: produto.sku, nome: produto.nome, ean: produto.ean,
                             img: produto.img,   // 22/09: a foto viaja junto pra aparecer na lista
                             contado: n, saldo_bling: produto.estoque })
    });
    d = await r.json().catch(()=>null);
  } catch(e){ d = null; }
  if(!(d && d.ok)){
    /* não dizer "salvo" sem ter salvo: a pessoa segue pro próximo item e a
       contagem se perde sem ninguém notar */
    msg.innerHTML = '<b>Não salvou.</b> ' + esc((d && d.erro) || 'tente de novo') + '';
    return;
  }
  const dif = (produto.estoque != null) ? (n - Number(produto.estoque)) : null;
  msg.innerHTML = '✅ Contagem salva' + (dif != null && dif !== 0
    ? ' — <b>diferença de '+(dif>0?'+':'')+dif+'</b> em relação ao Bling.' : '.');
  /* Codex (P2): o produto e o campo de quantidade ficavam ativos por 1.2s depois do "salvo".
     Nesse intervalo, o leitor de código de barras — o jeito normal de usar esta tela — manda
     as teclas do PRÓXIMO item pro campo de quantidade do item ANTERIOR, e o Enter dele
     lançava uma contagem errada. Trava o campo e já devolve o foco pra busca na hora: o
     próximo bipe cai no lugar certo mesmo antes do reset visual terminar. */
  document.getElementById('qtd').disabled = true;
  const campoBusca = document.getElementById('busca');
  campoBusca.value = '';
  campoBusca.disabled = false;   // destrava ANTES do focus: campo desabilitado não recebe foco
  campoBusca.focus();
  LIMPAR_TIMER = setTimeout(limpar, 1200);
  carregarHoje();
}

let OFFSET_LISTA = 0, ACUMULADO = [];

/* 22/09 — + e − na lista do dia, pedido do dono. O ajuste NÃO apaga o valor anterior: o
   servidor empilha em `ajustes` quem mexeu e quando, porque esta tela existe pra conferir
   depois — sobrescrever calado viraria caixa preta. */
async function ajustar(id, delta, botao){
  if(!id) return;
  /* trava os dois botões da linha: clique repetido mandaria vários ajustes e o número da tela
     ficaria diferente do que foi gravado */
  const par = botao.parentElement.querySelectorAll('button');
  par.forEach(b => b.disabled = true);
  let d = null;
  try {
    const r = await fetch(MOD+'/contagem-ajustar', {
      method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ id, delta })
    });
    d = await r.json().catch(()=>null);
  } catch(e){ d = null; }
  if(!(d && d.ok)){
    /* não mexe no número da tela se o servidor não confirmou: número que não foi gravado é
       pior que número que não mudou */
    alert((d && d.erro) || 'não consegui ajustar agora — o número não foi alterado');
    par.forEach(b => b.disabled = false);
    return;
  }
  carregarHoje();
}

let _seqLista = 0;

/* 22/09 — digitar a quantidade na própria linha. O número vira um campo, salva no Enter ou ao
   sair, e o Esc desiste. Não usa prompt(): no celular ele abre uma caixa do sistema que tapa a
   tela e não mostra qual produto está sendo editado. */
function editarQtd(botao){
  const item = botao.closest('.item');
  const atual = botao.textContent.trim();
  /* Codex #511 (P2, r2): o toque no + ou − logo depois de editar disparava o `blur` (que salva o
     valor digitado via /contagem-definir) e o `click` do botão (que manda /contagem-ajustar) sem
     ordem garantida entre os dois — o ajuste podia terminar primeiro e ser sobrescrito pelo
     valor absoluto do blur, perdendo o toque em silêncio. Trava os botões da linha enquanto a
     edição está aberta; toda saída (salvar, desistir, erro) já termina em carregarHoje(), que
     redesenha a linha inteira com os botões de volta. */
  const irmaos = item.querySelectorAll('.mais-menos button');
  irmaos.forEach(b => b.disabled = true);
  const campo = document.createElement('input');
  campo.type = 'number'; campo.inputMode = 'numeric'; campo.min = '0'; campo.step = '1';
  campo.value = atual; campo.className = 'qtd-edit';
  botao.replaceWith(campo);
  campo.focus(); campo.select();

  let encerrado = false;
  const desistir = () => { if(encerrado) return; encerrado = true; carregarHoje(); };
  const salvar = async () => {
    if(encerrado) return; encerrado = true;
    const v = (campo.value || '').trim();
    if(v === '' || v === atual) return carregarHoje();
    campo.disabled = true;
    let d = null;
    try {
      const r = await fetch(MOD+'/contagem-definir', {
        method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ id: item.dataset.id, contado: v })
      });
      d = await r.json().catch(()=>null);
    } catch(e){ d = null; }
    /* não deixa o número editado na tela se o servidor não confirmou: número que não foi
       gravado é pior que número que não mudou */
    if(!(d && d.ok)) alert((d && d.erro) || 'não consegui salvar — a quantidade não foi alterada');
    carregarHoje();
  };
  campo.addEventListener('keydown', ev => {
    if(ev.key === 'Enter'){ ev.preventDefault(); salvar(); }
    if(ev.key === 'Escape'){ ev.preventDefault(); desistir(); }
  });
  campo.addEventListener('blur', salvar);
}

/* excluir, com confirmação — pedido do dono. No servidor a linha não some do arquivo: fica
   marcada com quem tirou e quando, e some só da lista. */
async function excluir(item, botao){
  const nome = (item.querySelector('.nome') || {}).textContent || 'este lançamento';
  if(!confirm('Excluir a contagem de "' + nome.trim() + '"?\n\nIsso tira a linha da lista do dia.')) return;
  item.querySelectorAll('button').forEach(b => b.disabled = true);
  let d = null;
  try {
    const r = await fetch(MOD+'/contagem-excluir', {
      method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ id: item.dataset.id })
    });
    d = await r.json().catch(()=>null);
  } catch(e){ d = null; }
  if(!(d && d.ok)){
    alert((d && d.erro) || 'não consegui excluir — a linha continua valendo');
    item.querySelectorAll('button').forEach(b => b.disabled = false);
    return;
  }
  carregarHoje();
}

async function carregarHoje(recomecar){
  /* Codex #511 (P2): ajustar dois cartões quase ao mesmo tempo disparava DOIS carregarHoje().
     Cada um zera o ACUMULADO compartilhado e depois espera a rede — as duas respostas se
     misturavam no mesmo array e a lista saía com itens repetidos ou faltando. O contador diz
     qual recarga é a atual; as antigas desistem antes de mexer no acumulado. */
  /* só uma RECARGA NOVA pega token novo; a continuação da paginação mantém o dela, senão ela
     invalidaria a si mesma a cada página. */
  if(recomecar !== false){ _seqLista++; OFFSET_LISTA = 0; ACUMULADO = []; }
  const minhaLista = _seqLista;
  const alvo = document.getElementById('hoje');
  let d = null;
  try {
    /* Codex #509 (P2): o servidor devolve no máximo 500 por vez e informa `tem_mais` /
       `proximo_offset`, mas a tela pedia sempre o offset zero e ignorava o resto — num dia de
       inventário com mais de 500 itens, os primeiros lançamentos sumiam da lista em silêncio,
       e quem contou não teria como conferir o que já fez. Agora busca as páginas seguintes. */
    const r = await fetch(MOD+'/contagem-lista?de='+hojeISO()+'&offset='+(OFFSET_LISTA||0), {credentials:'same-origin'});
    d = await r.json().catch(()=>null);
  } catch(e){ d = null; }
  if(minhaLista !== _seqLista) return;   // outra recarga começou; esta já não vale
  if(!(d && d.ok)){ alvo.innerHTML = '<span class="dim">não consegui carregar a lista agora.</span>'; return; }
  ACUMULADO = ACUMULADO.concat(d.lancamentos || []);
  /* enquanto houver mais, continua puxando — a lista do dia tem que estar inteira, senão quem
     contou não consegue conferir o próprio trabalho. O teto de 5000 é só trava de segurança
     contra um dia anormal (ou um bug no servidor que nunca zere tem_mais) prender a tela num
     laço de fetch sem fim — não é um limite que se espera bater na operação normal. */
  if(d.tem_mais && d.proximo_offset != null && ACUMULADO.length < 5000){
    OFFSET_LISTA = d.proximo_offset;
    return carregarHoje(false);
  }
  /* Codex #509 (P2, r3): quando o teto acima interrompe e AINDA sobra mais (`d.tem_mais`
     continua true), a lista antes era desenhada como se estivesse completa — quem revisa não
     tinha como saber que faltavam lançamentos mais antigos do dia. Agora avisa. */
  const truncado = !!(d.tem_mais && ACUMULADO.length >= 5000);
  if(!ACUMULADO.length){ alvo.innerHTML = '<span class="dim">nenhuma contagem hoje ainda.</span>'; return; }
  /* 22/09 — CARTÃO por item, em vez de tabela. Pedido do dono: ver nome, SKU e quantidade, com
     + e − do lado pra acrescentar ou tirar sem refazer a contagem (o funcionário acha mais uma
     caixa no canto e soma). Tabela de 7 colunas num celular de galpão não se lê nem se toca. */
  alvo.innerHTML =
    (truncado ? '<div class="aviso">Mostrando os '+ACUMULADO.length+' lançamentos mais recentes de hoje — há mais no arquivo que esta tela não carrega de uma vez.</div>' : '') +
    ACUMULADO.map(l => {
      const dif = l.divergencia;
      /* saldo não conferido no instante do lançamento: a divergência pode estar velha, e isso
         muda a decisão de quem revisa (ajustar o Bling × recontar antes) */
      const naoConferido = l.saldo_conferido_na_hora === false && l.saldo_bling_na_hora != null;
      const classeDif = dif == null ? 'sem' : (dif === 0 ? 'zero' : 'nao');
      const textoDif = dif == null ? 'sem saldo' : (dif === 0 ? 'confere' : (dif > 0 ? '+'+dif : String(dif)));
      return '<div class="item" data-id="'+esc(l.id||'')+'">' +
        /* 22/09 — a FOTO na linha, pedido do dono: num inventário de lixas com nomes quase
           iguais, a imagem distingue mais rápido que ler o nome inteiro. Vem guardada do
           lançamento — buscá-la aqui custaria uma chamada ao Bling POR LINHA da lista. */
        (l.img ? '<img class="thumb" src="'+esc(l.img)+'" alt="" loading="lazy">'
               : '<div class="thumb semfoto-mini">sem<br>foto</div>') +
        '<div class="info">' +
          '<div class="nome" title="'+esc(l.nome)+'">'+esc(l.nome || '(sem nome)')+'</div>' +
          /* a linha de baixo vira FRASE em vez de campos colados com pontinhos. Os pontos
             obrigam a pessoa a decifrar qual pedaço é o quê; "às 20:00 por Diego" ela lê
             direto. O SKU fica destacado porque é o que ela confere contra a etiqueta. */
          '<div class="meta"><span class="sku">'+esc(l.sku)+'</span>' +
          ' · às '+esc(horaSP(l.quando))+(l.quem ? ' por '+esc(l.quem) : '') +
          (l.saldo_bling_na_hora != null ? ' · Bling tinha '+l.saldo_bling_na_hora : '') +
          (naoConferido ? ' <span title="o saldo não foi conferido no Bling na hora — pode estar desatualizado">⚠</span>' : '') +
          ((l.ajustes && l.ajustes.length) ? ' · ajustado '+l.ajustes.length+'×' : '') +
          '</div>' +
        '</div>' +
        '<span class="dif '+classeDif+'">'+esc(textoDif)+'</span>' +
        /* 22/09 — o número é CLICÁVEL: o dono pediu poder digitar a quantidade na linha em vez
           de refazer a busca ("pra eu não ter que digitar de novo o 404"). Os botões resolvem
           de 1 em 1; quando a diferença é grande, digitar erra menos que clicar dez vezes. */
        '<div class="qtd-box">' +
          (l.id ? '<button class="qtd-num edit" data-editar="1" title="clique pra digitar a quantidade">'+l.contado+'</button>'
                : '<div class="qtd-num">'+l.contado+'</div>') +
          '<div class="qtd-lbl">contado</div>' +
        '</div>' +
        (l.id ? '<div class="mais-menos">' +
          '<button data-ajuste="-1" title="tirar 1">−</button>' +
          '<button data-ajuste="1" title="acrescentar 1">+</button>' +
          '<button class="excluir" data-excluir="1" title="excluir este lançamento">🗑</button>' +
        '</div>' : '') +
      '</div>';
    }).join('');

  /* os botões entram por addEventListener, não por onclick com o id concatenado: o SKU e o id
     vêm de dado gravado, e montar código a partir deles foi exatamente o XSS que o Codex achou
     no painel (#510). */
  alvo.querySelectorAll('.item .mais-menos button[data-ajuste]').forEach(b => {
    b.addEventListener('click', () => ajustar(b.closest('.item').dataset.id, Number(b.dataset.ajuste), b));
  });
  alvo.querySelectorAll('.item [data-editar]').forEach(b => {
    b.addEventListener('click', () => editarQtd(b));
  });
  alvo.querySelectorAll('.item [data-excluir]').forEach(b => {
    b.addEventListener('click', () => excluir(b.closest('.item'), b));
  });
}

carregarHoje();

/* limpar a busca devolve o foco ao campo: quem bipa o próximo código não deve precisar
   clicar de novo */
(function(){
  const bt = document.getElementById('btLimparBusca');
  const campo = document.getElementById('busca');
  if(!bt || !campo) return;
  bt.addEventListener('click', () => {
    campo.value = '';
    aoDigitar('');
    document.getElementById('resultado').innerHTML = '';
    campo.focus();
  });
})();
</script>
