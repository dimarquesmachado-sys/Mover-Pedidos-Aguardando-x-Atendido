<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0a0e1a; --bg2:#0d1326; --card:#131a30; --card2:#182138;
    --line:#232d4a; --line2:#2d3a5e;
    --tx:#e7ecf6; --mut:#8b96b3; --dim:#5a6485;
    --ac:#6366f1; --ac2:#818cf8; --ok:#22c55e; --ok2:#4ade80;
    --warn:#f59e0b; --bad:#ef4444; --cy:#22d3ee;
    --r:14px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:radial-gradient(1200px 500px at 70% -100px,#151d3a 0%,var(--bg) 55%);color:var(--tx);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,sans-serif;padding:0 16px 40px}
  a{color:var(--ac2);text-decoration:none}
  .wrap{max-width:min(1720px,96vw);margin:0 auto}
  .hdr{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,rgba(10,14,26,.97) 70%,rgba(10,14,26,0));
       padding:14px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px}
  .hrow{max-width:min(1720px,96vw);margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  /* cabeçalho: filtros à esquerda · atalhos à direita, tudo dentro da faixa fixa */
  .hbot{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding-bottom:8px}
  .hleft{flex:1 1 auto;min-width:0}
  .atalhos{flex:0 0 auto;display:flex;gap:8px;align-items:flex-start;max-width:66%}
  /* d197 (pedido do Diego): eram 11 atalhos em grade de 5 = TRÊS linhas (5+5+1), e a
     última sozinha ficava feia. Com 6 colunas dá 6+5 = DUAS linhas cheias.
     Pra caber em 6, os botões ficaram um pouco menores e os rótulos mais longos
     foram encurtados — o nome inteiro continua no title, ao passar o mouse. */
  .atGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;flex:1 1 auto}
  .atGrid .chip{width:100%;justify-content:center;text-align:center}
  .atalhos .chip{white-space:nowrap;padding:5px 7px;font-size:11px;letter-spacing:-.01em}
  h1{font-size:17px;font-weight:800;margin:0;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
  h1 .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#fbbf24,#f59e0b);
           display:inline-flex;align-items:center;justify-content:center;font-size:16px}
  .badge{font-size:10px;font-weight:700;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:1px 6px;letter-spacing:.05em}
  .hlinks{margin-left:auto;font-size:12px;color:var(--mut)}
  /* d200 (pedido do Diego): MESMA paleta do checkout, pra nao ter dois padroes.
     Bling roxo · NF verde · marketplace azul — em todos os lugares onde o link
     aparece (Buscar Pedido, Analise de Vendas, detalhe do pedido). */
  .lkB{color:#a78bfa;text-decoration:none;font-weight:700}   /* Bling    */
  .lkN{color:#4ade80;text-decoration:none;font-weight:700}   /* NF       */
  .lkM{color:#38bdf8;text-decoration:none;font-weight:700}   /* mercado  */
  .lkB:hover,.lkN:hover,.lkM:hover{text-decoration:underline}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .chip{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:999px;
        padding:7px 15px;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .15s}
  .chip:hover{border-color:var(--line2);color:var(--tx)}
  .chip.on{border-color:var(--ac);color:#fff;background:linear-gradient(135deg,#1e2650,#232d5e);box-shadow:0 0 0 1px var(--ac) inset}
  .custom{display:none;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
  input[type=date],input[type=number]{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:7px 10px;font-size:12.5px}
  .cover{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:11.5px;color:var(--mut)}
  .pill{border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--card)}
  .pill b{font-weight:800}
  .pill.g b{color:var(--ok)} .pill.w{border-color:#f59e0b44} .pill.w b{color:var(--warn)}
  .kpis{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:12px;margin:18px 0;padding-bottom:6px}
  .kpis::-webkit-scrollbar{height:6px}
  .kpis::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
  .kpi{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);
       flex:1 1 150px;min-width:146px;
       padding:14px 16px;position:relative;overflow:hidden;transition:transform .15s,border-color .15s}
  .kpi:hover{transform:translateY(-2px);border-color:var(--line2)}
  .kpi::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:var(--kc,var(--ac));opacity:.9}
  /* 28/07: o ícone ficava sozinho numa linha acima do título. Agora ele e o título
     ficam LADO A LADO — "💰 Faturamento Total" — e sobra altura no card. */
  .kpi .ic{font-size:15px;opacity:.9;float:left;margin:0 6px 0 0;line-height:1.25}
  .kpi .l{font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.02em;margin-top:1px;
          display:block;overflow:hidden}
  .kpi .v,.kpi .s{clear:both}
  .kpi .v{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
  .kpi .s{font-size:10.5px;color:var(--dim);margin-top:2px}
  /* o cabeçalho é fixo: reserva a altura dele pra o atalho parar no INÍCIO da seção, não em cima dela */
  .sec{scroll-margin-top:calc(var(--hdrH,104px) + 14px);background:linear-gradient(170deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);
       padding:18px;margin:14px 0}
  .sec h2{font-size:14px;font-weight:800;margin:0 0 14px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sec h2 .hint{font-size:10.5px;font-weight:600;color:var(--dim);margin-left:auto}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:860px){ .grid2{grid-template-columns:1fr} }
  .chartbox{position:relative;height:230px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{color:var(--mut);text-align:left;font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;
     padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;user-select:none}
  th.sort{cursor:pointer} th.sort:hover{color:var(--tx)}
  /* cabecalho congelado: o wrapper .tw rola por dentro e o <th> gruda no topo dele */
  /* 29/07 — TRAVA: a página não pode ficar mais larga que a tela. Sem isso, uma tabela larga
     empurra o documento pro lado, dá pra arrastar a tela e o cabeçalho fixo e os botões
     flutuantes "somem" (ficam presos na tela enquanto a página desliza por baixo).
     Uso 'clip' e não 'hidden' de propósito: 'hidden' criaria uma área de rolagem e quebraria
     tudo que é grudado; 'clip' só corta, sem virar rolagem. */
  html{overflow-x:clip}
  body{overflow-x:clip;max-width:100vw}
  .tw{border-radius:10px}
  .tw th{position:sticky;top:var(--hdrH,104px);z-index:3;background:#141b33;box-shadow:0 2px 6px rgba(0,0,0,.45)}
  .tw thead th{top:0}

  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr{transition:background .12s}
  tbody tr:hover{background:#ffffff08}
  tr:last-child td{border-bottom:none}
  .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .bar{background:#ffffff10;border-radius:99px;height:7px;overflow:hidden;min-width:60px}
  .bar>i{display:block;height:7px;border-radius:99px;background:linear-gradient(90deg,var(--ac),var(--ac2))}
  .bar>i.g{background:linear-gradient(90deg,#16a34a,var(--ok2))}
  .rank{display:inline-flex;width:24px;height:24px;border-radius:8px;align-items:center;justify-content:center;
        font-size:11px;font-weight:800;background:#ffffff0d;color:var(--mut)}
  .rank.r1{background:linear-gradient(135deg,#fbbf24,#d97706);color:#1a1204}
  .rank.r2{background:linear-gradient(135deg,#e2e8f0,#94a3b8);color:#1e293b}
  .rank.r3{background:linear-gradient(135deg,#f6ad7b,#c2703d);color:#2d1505}
  .sku{font-weight:700} .desc{font-size:11px;color:var(--mut);line-height:1.3;
        display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;
        white-space:normal;word-break:break-word}
  .cvS{opacity:.65;font-size:11px;display:inline-block;width:9px}
  /* 19/08 (Diego printou a tela a meio carregar e leu metade do faturamento como se fosse
     o total): no período longo os cards ficavam mostrando o CACHE enquanto o histórico não
     chegava, sem dizer nada. Agora eles ficam esmaecidos e uma faixa avisa. */
  .kpis.carregando{opacity:.45;filter:saturate(.5)}
  .avisoCarr{display:flex;align-items:center;gap:8px;margin:14px 0 -6px;padding:9px 14px;border-radius:10px;
        background:#78350f22;border:1px solid #f59e0b55;color:#fbbf24;font-size:12.5px;font-weight:600}
    .mut{color:var(--mut)} .dim{color:var(--dim)} .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
  .cvg{font-size:10px;color:var(--warn);background:#f59e0b14;border:1px solid #f59e0b33;border-radius:5px;padding:1px 5px;margin-left:6px;white-space:nowrap}
  .st{display:inline-block;font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 8px}
  .st.ok{background:#22c55e1a;color:var(--ok2);border:1px solid #22c55e33}
  .st.w{background:#f59e0b1a;color:var(--warn);border:1px solid #f59e0b33}
  .st.b{background:#ef44441a;color:#f87171;border:1px solid #ef444433}
  .aviso{font-size:12px;color:var(--warn);margin-top:10px;background:#f59e0b0d;border:1px solid #f59e0b26;border-radius:9px;padding:8px 12px}
  .nota{font-size:11px;color:var(--dim);margin-top:14px;line-height:1.6}
  .btn{background:linear-gradient(135deg,var(--ac),#4f46e5);border:none;color:#fff;border-radius:10px;padding:9px 16px;
       font-size:12.5px;font-weight:700;cursor:pointer;transition:filter .15s}
  .btn:hover{filter:brightness(1.15)} .btn[disabled]{opacity:.5;cursor:default}
  .loginbox{max-width:440px;margin:80px auto;text-align:center;background:var(--card);border:1px solid var(--line);
            border-radius:16px;padding:40px 30px}
  .skel{color:var(--dim);text-align:center;padding:30px}
  ::-webkit-scrollbar{height:8px;width:8px} ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px}
  /* tabela de estados: colunas juntinhas, sem espaço à toa */
  #tUF td,#tUF th{padding:5px 6px;font-size:12px}
  #tUF td.num,#tUF th.num{padding-left:4px;padding-right:6px}
  #twUF table{min-width:0}
  /* coluna com explicação: sublinhado pontilhado discreto avisa que dá pra passar o mouse */
  th[title]{cursor:help;text-decoration:underline dotted rgba(255,255,255,.28);text-underline-offset:3px}
  th[title]:hover{color:#cfe0ff}
  /* legenda do rodapé da Análise */
  .lg{display:inline-flex;align-items:center;gap:5px}
  .lg i{width:11px;height:11px;border-radius:2px;display:inline-block}
  /* barra da Análise */
  .anPerLinha{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .anPerLinha:empty,.anPerLinha:has(#anPerChips:empty){margin-bottom:0}
  .anBarra{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .anSel{flex:0 0 auto;max-width:220px}
  .anBusca{flex:1 1 240px;min-width:160px}
  /* campo com rótulo em cima (Plano de Compra) */
  /* totais da Análise: 3 por linha; a última linha estica pra preencher */
  .miniTot{flex:1 1 calc(33.33% - 6px);min-width:96px}
  /* 02/08: na seção de despesas do ML são 5 caixas — com 33% cada, as duas últimas esticavam
     pra meia tela num monitor largo. Aqui elas ganham um teto e ficam do mesmo tamanho. */
  #mlbCards .miniTot{flex:0 1 210px;min-width:170px}
  #mlbCards>div{gap:8px}
  /* 29/07: busca + Excel + ↻ num grupo indivisivel - antes o Excel caia sozinho numa linha
     quando os botoes de periodo ocupavam muito espaco. Agora eles andam sempre juntos. */
  .grpBusca{display:flex;gap:6px;align-items:center;flex:1 1 320px;min-width:260px}

   Agosto fica pré-definido em 15% até a apuração sair, a pedido do Diego. São PADRÕES: o que ele
   salvar no ⚙️ continua mandando. */
const DEFAULT_ALIQ = { '2026-01':11.409280, '2026-02':11.3254, '2026-03':12.3402, '2026-04':13.6001, '2026-05':13.9149, '2026-06':14.056, '2026-07':14.4007, '2026-08':15, '2026-09':15, '2026-10':15, '2026-11':15, '2026-12':15 };

  const v = _aliqBruta(mes);
  if (v != null && Number(v) > 0) return Number(v);

let _nomesBuscando = false, _nomesErro = null;
async function garantirNomes(lista){
  if(_nomesBuscando || !lista || !lista.length) return;
  const falta = [];
  for(const x of lista){
    // aceita tanto {h:{itens}} (lista do dia) quanto {itens} (lista do histórico)
    for(const i of ((x.h && x.h.itens) || x.itens || [])){
      if(!i.sku) continue;
      if(i.descricao) continue;
      if(SKUINFO[i.sku] && SKUINFO[i.sku].nome) continue;
      if(falta.indexOf(i.sku) < 0) falta.push(i.sku);
    }
  }
  if(!falta.length) return;
  _nomesBuscando = true;
  try{
    const r = await fetch(MOD+'/sku-info', {method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({skus: falta.slice(0,60)})});
    const d = await r.json().catch(()=>null);
    if(d && d.skus && Object.keys(d.skus).length){ Object.assign(SKUINFO, d.skus); _nomesErro=null; renderAnalise(); }
    else {
      // 29/07: essa busca falhava EM SILÊNCIO — o título simplesmente não vinha e não havia
      // como saber por quê. Agora o motivo aparece embaixo da lista.
      _nomesErro = (r.status===403) ? 'a busca de nomes exige sessão de ADMIN — entre como admin no checkout e recarregue'
                 : (!r.ok ? ('não consegui buscar os nomes (HTTP '+r.status+')') : null);
      if(_nomesErro) renderAnalise();
    }
  }catch(e){ _nomesErro = 'não consegui buscar os nomes: '+(e.message||e); renderAnalise(); }
  _nomesBuscando = false;
}

// 📚 LISTA do histórico, paginada por pedido (100 por página) — vem do banco, não do cache local
let HLIN = null;            // {pedidos, pagina, total_paginas, total_pedidos}
let _hlCarregando = false;
let _hlUltima = null;   // última consulta TENTADA (não a última que deu certo) — é o que o ↻ repete
let _hlErro = null;     // Codex (P2, PR#132 r4): a falha era só pintura; qualquer render seguinte
                        // (o garantirNomes que ainda estava em voo, por exemplo) repintava com o
                        // HLIN antigo e a queda parecia ter se resolvido sozinha. Agora é ESTADO.
/* termo em uso na lista do histórico (só conta com 2+ caracteres, igual ao servidor) */
/* 18/08 (Diego): o link "Bling↗" abria .../vendas.php#edit/s26638909833 — com um "s" na frente
   que o Bling não entende, e a página não abria. O "s" vem do id da linha SINTÉTICA (as vendas
   que o checkout ainda não bipou nascem com id 's'+id pra não colidir com as bipadas). O link
   precisa do id CRU. E venda que só existe no marketplace (id 'ml:123' / 'sml:123') não tem
   pedido no Bling nenhum — nesses casos o link não deve aparecer. */
function blingId(h){
  if(!h || h.id==null) return null;
  let v = String(h.id);
  if(h.sintetico && v.charAt(0)==='s') v = v.slice(1);
  return /^\d+$/.test(v) ? v : null;   // 'ml:123', 'sml:123' e afins não existem no Bling
}
function _qAn(){ const t=String(anSku||'').trim(); return t.length>=2 ? t : ''; }
/* digitar dispara uma consulta por tecla — 400ms de espera resolve */
let _hlTimer=null;
function pedirLinhasHist(de, ate, pagina){
  if(_hlTimer) clearTimeout(_hlTimer);
  _hlTimer = setTimeout(()=>{ carregarLinhasHist(de, ate, pagina); }, 400);
}
async function carregarLinhasHist(de, ate, pagina){
  /* 18/08: com a busca no servidor, digitar dispara vários pedidos e este guard DESCARTAVA os
     que chegassem durante um carregamento — a consulta do termo era engolida e a tela ficava
     mostrando o estado anterior pra sempre. Agora reagenda em vez de descartar. */
  if(_hlCarregando){ pedirLinhasHist(de, ate, pagina); return; }
  _hlCarregando = true;
  try{
    // 29/07: 200 por página, igual ao filtro do dia — antes o histórico vinha de 100 em 100
    // 01/08: leva o CANAL escolhido — antes a lista do Mês/Ano ignorava o filtro
    /* 18/08: o termo do campo 🔎 vai pro SERVIDOR — antes ele só filtrava a memória do
       navegador e, no período longo (Mês/Ano), a lista vinha paginada do banco: digitar o
       número de um pedido antigo não filtrava nada. Agora vale pro período inteiro. */
    const _q = String(anSku||'').trim();
  /* Codex (P2, PR#132 r2): o botão "tentar de novo" lia HLIN, que só é atualizado quando dá
     CERTO — falhar a página 2 fazia o botão repetir a página 1. Guardo o que foi TENTADO. */
  _hlUltima = { de, ate, pagina: (pagina||1), canal: (anCanal||''), q: (_q.length>=2?_q:'') };
    const r = await fetch(MOD+'/historico-linhas?de='+de+'&ate='+ate+'&pagina='+(pagina||1)+'&lim=200'+(anCanal?('&canal='+encodeURIComponent(anCanal)):'')+(_q.length>=2?('&q='+encodeURIComponent(_q)):''), {credentials:'same-origin'});
    const d = await r.json().catch(()=>null);
    if(!(d && d.ok)) avisoHistFalhou((d&&d.erro)?String(d.erro):'');
    if(d && d.ok){ _hlErro = null; HLIN = d; HLIN._de=de; HLIN._ate=ate; HLIN._canal=anCanal||''; HLIN._q=(_q.length>=2?_q:''); renderAnalise(); restaurarAncora();
      garantirNomes((d.pedidos||[]).map(function(o){ return {h:{itens:(o.itens||[])}}; }));   // títulos também no Mês/Ano
    }
  }catch(e){
    /* Codex (P2, PR#131): o catch estava VAZIO — servidor fora do ar ou conexão cortada deixava a
       tela travada no "⏳ carregando" pra sempre, já que o render local não repinta mais. */
    avisoHistFalhou(String((e&&e.message)||e));
  }
  _hlCarregando = false;
}
/* Codex (P2, PR#131): o aviso só ia pra tabela — no celular a tabela está escondida e quem
   aparece são os cartões, que ficavam com o resultado ANTIGO e nenhum sinal de falha. */
function avisoHistFalhou(msg){
  /* Codex (P2, PR#132 r6): o erro era GLOBAL — falhar no canal X e voltar pro filtro anterior
     (que já estava carregado) mantinha o aviso por cima de resultados válidos. O estado agora
     guarda A QUAL consulta a falha pertence, e só bloqueia essa. */
  if(typeof msg === 'object' && msg) _hlErro = msg;
  else _hlErro = Object.assign({ msg: msg || '' }, _hlUltima || {});
  const _m = (_hlErro && _hlErro.msg) || '';
  const txt = '⚠ não consegui carregar a lista do histórico agora'+(_m?(' ('+esc(_m)+')'):'')+' — tente de novo';
  const bt = '<button class="chip" style="margin-left:8px" onclick="repetirHist()">↻ tentar de novo</button>';
  const tb=$('tAnalise'); if(tb) tb.innerHTML='<tr><td class="dim" style="padding:14px">'+txt+bt+'</td></tr>';
  const cd=document.getElementById('anCards'); if(cd) cd.innerHTML='<div class="dim" style="padding:14px">'+txt+bt+'</div>';
  /* Codex (P2, PR#132): eu APAGAVA o paginador aqui — falhar a página 2 tirava justamente os
     botões necessários pra tentar de novo, e só um F5 resolvia. O rodapé fica como está. */
}
/* refaz a última consulta de lista do histórico (a que falhou) */
function repetirHist(){
  const iv = anIntervalo();
  /* Codex (P2, PR#132 r5): NÃO limpar o erro aqui — entre o clique e a resposta, qualquer
     render (o garantirNomes que voltou, por exemplo) passaria pelo guard e repintaria a
     página velha como se tivesse voltado. O estado só cai no SUCESSO da nova consulta. */
  const u = _hlErro || _hlUltima || { de: iv.de, ate: iv.ate, pagina: 1 };
  carregarLinhasHist(u.de, u.ate, u.pagina||1);
}
function histIrPagina(n){
  if(!HLIN) return;
  const p = Math.min(Math.max(1, Number(n)||1), HLIN.total_paginas||1);
  carregarLinhasHist(HLIN._de, HLIN._ate, p);
  const el=document.getElementById('secAnalise'); if(el) el.scrollIntoView({behavior:'smooth'});
}

// 📚 HISTÓRICO LONGO (Supabase): períodos que não cabem na janela local (Ano, 6 meses…)
// ── d196 (pedido do Diego): PREVISÃO DO MÊS ──────────────────────────────────
// Card fixo no topo, igual ao do Jodda: quanto o mês deve fechar no ritmo atual.
// Duas decisões que ele pediu:
//  • é SEMPRE o mês corrente, não o período selecionado. Olhando "Ano" ou "Mês
//    anterior" o card continua mostrando agosto — assim não fica buraco na grade
//    e o número não vira bobagem (prever um mês que já acabou não faz sentido).
//  • o nome do mês sai da data, então em 1º de setembro ele vira "Setembro" sozinho.
// Busca o mês corrente uma vez só, à parte do período em exibição.
let PREV_MES = null;
async function carregarPrevisaoMes(){
  try{
    const hj = new Date();
    const ini = hj.toISOString().slice(0,8) + '01';
    const hoje = hj.toISOString().slice(0,10);
    const r = await fetch(MOD+'/historico-longo?de='+ini+'&ate='+hoje, {credentials:'same-origin'});
    const d = await r.json().catch(()=>null);
    if(!(d && d.ok && d.totais)) return;
    const diasNoMes = new Date(hj.getFullYear(), hj.getMonth()+1, 0).getDate();
    const diaAtual  = hj.getDate();
    const fatMes    = Number(d.totais.faturamento||0)||0;
    const ritmo     = diaAtual>0 ? fatMes/diaAtual : 0;
    PREV_MES = { mes: hj.getMonth(), ano: hj.getFullYear(), fat: fatMes, ritmo,
                 diaAtual, diasNoMes, previsto: Math.round(ritmo*diasNoMes*100)/100 };
    try{ render(); }catch(e){}
  }catch(e){}
}

let HIST = null;          // agregado do período, vindo do servidor
let _histCarregando = false;
const HIST_JANELA_DIAS = 6;   // o cache local guarda ~6 dias; antes disso, o histórico manda
function precisaHistorico(de){
  const lim = new Date(Date.now() - HIST_JANELA_DIAS*86400000).toISOString().slice(0,10);
  return String(de) < lim;
}
let _histFalhou = null;   // {de, ate, msg} quando a última tentativa do período falhou
function tentarHistDeNovo(){ _histFalhou = null; try{ render(); }catch(e){} const iv = intervalo(); carregarHistorico(iv.de, iv.ate); }
async function carregarHistorico(de, ate){
  if(_histCarregando) return;

async function checarCancelados(silencioso){
  if(_stMkt) return; _stMkt = true;
  try{
    const { de, ate } = intervalo();
    const r = await fetch(MOD+'/status-mkt?de='+de+'&ate='+ate, {credentials:'same-origin'});
    const d = await r.json().catch(()=>null);
    if(d && d.ok){
      /* ═══ Codex + Claude (revisão do #172, item 4): O AVISO VEM ANTES DO HISTÓRICO ═══════
         A ordem anterior era: buscar /historico → render → pintar o aviso. Como o `rh.json()` do
         histórico não tem .catch(), se ele falhasse (ou o render lançasse) o fluxo pulava direto
         pro catch e o aviso — que JÁ tinha sido obtido com sucesso — nunca era pintado. Ou seja:
         justo quando algo dá errado, o operador perde o sinal de que algo não foi verificado.
         Agora pinto o aviso assim que tenho a resposta, e só depois vou buscar o histórico. */
      /* Codex (P2, r2): a resposta passou a admitir quando um canal NÃO foi verificado, mas o

         se a tela não conta? Agora o aviso aparece junto, e também quando nada foi cancelado
         (antes, sem cancelamento, o operador não via nada e supunha que estava tudo conferido). */
      /* Codex (P2, última rodada do #167): eu fiz o aviso EXISTIR, mas ele continuava atrás do
         `if(!silencioso)` — e TODAS as chamadas internas passam silencioso=true (a verificação

         ele clicasse no botão à mão, ou seja, quase nunca. Backend honesto que não chega na tela

         Agora: alerta só no clique manual (não interromper quem está trabalhando), mas o aviso de
         COBERTURA fica visível na tela sempre — inclusive nas verificações automáticas. */
      const avisos = [];
      if(d.aviso_tiktok) avisos.push(d.aviso_tiktok);
      if(Array.isArray(d.sem_cobertura) && d.sem_cobertura.length) avisos.push('sem verificação: '+d.sem_cobertura.join(', '));

        ? '<div class="aviso">⚠️ Cancelamentos — '+esc(avisos.join(' · '))+'</div>'

      const rh = await fetch(MOD+'/historico',{credentials:'same-origin'});

      if(dh && Array.isArray(dh.itens)){ DADOS=dh.itens; VENDAS=Array.isArray(dh.vendas_bling)?dh.vendas_bling:[]; prepararVendas(); render(); renderAnalise(); }
      if(!silencioso){

        if(avisos.length) partes.push('⚠️ '+avisos.join('\n⚠️ '));

        else alert('Nenhum cancelamento novo. Canais verificados: '+((d.canais_checados||[]).join(', ')||'—')+'.');
      }

}

function intervalo(){
  const hoje = hojeSP();
  let de, ate = hoje;
  if(periodo==='dia') de = hoje;
  else if(periodo==='ontem'){ const o = spDate(Date.now()-86400000); de=o; ate=o; }
  else if(periodo==='7') de = spDate(Date.now()-6*86400000);
  else if(periodo==='30') de = spDate(Date.now()-29*86400000);
  else if(periodo==='mes') de = hoje.slice(0,8)+'01';
  else if(periodo==='ano') de = hoje.slice(0,4)+'-01-01';   // ano corrente inteiro (01/jan até hoje)
  else if(periodo==='mesant'){ const [Y,M]=hoje.split('-').map(Number); const pm=new Date(Y,M-2,1);
    const y2=pm.getFullYear(), m2=String(pm.getMonth()+1).padStart(2,'0');
    de=y2+'-'+m2+'-01'; ate=y2+'-'+m2+'-'+String(new Date(Y,M-1,0).getDate()).padStart(2,'0'); }
  else { de = pDe || '2000-01-01'; ate = pAte || hoje; }
  return {de, ate};
}
// mantém o Diego na mesma seção quando o conteúdo re-renderiza (troca de período muda o tamanho da página)
// 28/07: a correção acontecia UMA vez, no quadro seguinte. Só que a tela ainda muda depois disso
// (o histórico chega da rede, os detalhes entram, as tabelas mudam de altura) — e aí você era jogado
// de volta pro topo. Agora a âncora fica guardada e é reaplicada algumas vezes, cobrindo o assíncrono.
let _ancEl=null, _ancTop=0;
function marcarAncora(){
  const secs = Array.prototype.slice.call(document.querySelectorAll('div.sec'));
  let alvo=null, melhor=Infinity;
  for(const el of secs){ const r=el.getBoundingClientRect(); if(r.bottom>40){ const d=Math.abs(r.top-70); if(d<melhor){ melhor=d; alvo=el; } } }
  _ancEl = alvo; _ancTop = alvo ? alvo.getBoundingClientRect().top : 0;
}
function restaurarAncora(){
  if(!_ancEl || !document.body.contains(_ancEl)) return;
  const dif = _ancEl.getBoundingClientRect().top - _ancTop;
  if(Math.abs(dif) > 2) window.scrollBy(0, dif);
}

function dBR(d){
  const t = String(d||'');
  const m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);

   "um card, no final, lá antes dos impostos, só pra consultar sku, pra ver o histórico dele de
   último preço configurado, a data até q ele tá valendo (…) e um campo pra cadastrar o novo
   valor. e q eu pudesse ver o valor antigo, a data q ele vigorou, e a data do novo custo e valor" */
async function verCustoHist(){
  const sku = String((document.getElementById('chSku')||{}).value||'').trim();
  const el = document.getElementById('chRes');
  if(!el) return;
  if(!sku){ el.innerHTML='<span class="mut">digite um SKU</span>'; return; }
  el.innerHTML='<span class="mut">consultando…</span>';
  try{
    const r = await fetch(BASE+'/custo-historico?sku='+encodeURIComponent(sku)+(ADMIN_K?('&k='+encodeURIComponent(ADMIN_K)):''));
    const j = await r.json();
    if(!j.ok) throw new Error(j.erro||'falhou');
    const f = j.faixas||[];
    const linhas = f.length ? f.map(function(x){
      const ate = x.ate ? x.ate.split('-').reverse().join('/') : '<b class="ok">hoje</b>';
      return '<tr><td><b>'+BRL(x.custo)+'</b></td><td>'+x.de.split('-').reverse().join('/')+'</td><td>'+ate+'</td>'+
             '<td class="mut">'+(x.origem==='manual'?'manual':'Bling')+'</td>'+
             '<td style="text-align:right"><button class="chip chDel" data-de="'+esc(x.de)+'" style="padding:3px 8px;font-size:11px">apagar</button></td></tr>';
    }).join('') : '<tr><td colspan="5" class="mut">sem histórico ainda</td></tr>';
    el.innerHTML =
      '<div class="mut" style="font-size:12px;margin-bottom:6px">'+
        'custo no Bling hoje: <b>'+(j.custo_atual_bling!=null?BRL(j.custo_atual_bling):'—')+'</b>'+
        (j.custo_manual!=null?(' · manual: <b>'+BRL(j.custo_manual)+'</b>'):'')+
        (j.vigente_hoje!=null?(' · vigente: <b class="ok">'+BRL(j.vigente_hoje)+'</b>'):'')+
      '</div>'+
      '<table style="width:100%;font-size:12px"><thead><tr><th style="text-align:left">custo</th><th style="text-align:left">de</th>'+
      '<th style="text-align:left">até</th><th style="text-align:left">origem</th><th></th></tr></thead><tbody>'+linhas+'</tbody></table>'+
      '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+
        '<input id="chNovo" placeholder="novo custo" inputmode="decimal" style="width:110px;background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 10px;font-size:12px">'+
        '<input id="chDe" type="date" style="background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px 10px;font-size:12px">'+
        '<button class="btn" onclick="lancarCustoHist()">\ud83d\udcbe lançar</button>'+
        '<span id="chMsg" class="mut" style="font-size:12px"></span>'+
      '</div>';
    el.querySelectorAll('button.chDel').forEach(function(b){ b.addEventListener('click', function(){ apagarFaixa(sku, b.getAttribute('data-de')); }); });
    const d=document.getElementById('chDe'); if(d && !d.value) d.value = new Date(Date.now()-3*3600000).toISOString().slice(0,10);
    verDeParaSku();
  }catch(e){ el.innerHTML='<span class="bad">erro: '+esc(e.message)+'</span>'; }
}

/* ═══ 21/08 — DE-PARA no card do histórico de custo ═══════════════════════════════════════
   Pro caso do "464"/"465": SKU antigo que o Bling não liga sozinho ao novo (sem produto_id).
   O Diego declara e o custo passa a ser herdado do destino — continua vindo do Bling. */
async function verDeParaSku(){
  const sku=String((document.getElementById('chSku')||{}).value||'').trim();
  const el=document.getElementById('chDP'); if(!el) return;
  if(!sku){ el.innerHTML=''; return; }
  try{
    const r=await fetch(BASE+'/sku-depara-manual?k='+encodeURIComponent(ADMIN_K||'')+'&sugerir='+encodeURIComponent(sku));
    const j=await r.json();
    const sug=(j.sugestoes||[]);
    /* Codex (revisão geral, 21/08): faltava mostrar que o SKU JÁ está ligado. O campo vinha
       preenchido com a sugestão e parecia ligado sem estar — e uma ligação errada não tinha
       como ser desfeita pela tela, só apagando o arquivo. */
    const vinc=j.vinculo||null;
    el.innerHTML='<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line)">'+
      '<div class="mut" style="font-size:12px;margin-bottom:6px">🔗 <b>Este SKU é o mesmo que outro?</b> — use quando o código antigo não existe mais e o Bling não liga sozinho. O custo passa a vir do destino.</div>'+
      (vinc?('<div style="font-size:12px;margin-bottom:8px">✅ Ligado a <b>'+esc(vinc.para)+'</b> · <button class="btn" onclick="apagarDeParaSku()" style="padding:3px 10px;font-size:11px">desfazer ligação</button></div>'):'')+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+
        '<input id="dpPara" placeholder="código de hoje" value="'+esc((vinc&&vinc.para)||sug[0]||'')+'" style="width:190px;background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 10px;font-size:12px">'+
        '<button class="btn" onclick="salvarDeParaSku()">🔗 ligar</button>'+
        '<span id="dpMsg" class="mut" style="font-size:12px">'+(sug.length?('sugestão: '+sug.map(esc).join(', ')):'')+'</span>'+
      '</div></div>';
  }catch(e){ el.innerHTML=''; }
}
async function salvarDeParaSku(){
  const de=String((document.getElementById('chSku')||{}).value||'').trim();
  const para=String((document.getElementById('dpPara')||{}).value||'').trim();
  const msg=document.getElementById('dpMsg');
  if(!para){ if(msg){msg.textContent='digite o código de destino'; msg.style.color='#fbbf24';} return; }
  try{
    const r=await fetch(BASE+'/sku-depara-manual'+(ADMIN_K?('?k='+encodeURIComponent(ADMIN_K)):''),
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({de,para})});
    const j=await r.json();
    if(!j.ok) throw new Error(j.erro||'falhou');
    if(msg){ msg.textContent='✓ ligado a '+j.para+' — o custo vem de lá agora'; msg.style.color='#34d399'; }
    verCustoHist();
  }catch(e){ if(msg){msg.textContent='✗ '+e.message; msg.style.color='#f87171';} }
}


async function apagarDeParaSku(){
  const de=String((document.getElementById('chSku')||{}).value||'').trim();
  if(!de || !confirm('Desfazer a ligação manual de '+de+'?')) return;
  try{
    const r=await fetch(BASE+'/sku-depara-manual'+(ADMIN_K?('?k='+encodeURIComponent(ADMIN_K)):''),
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({apagar:de})});
    const j=await r.json(); if(!j.ok) throw new Error(j.erro||'falhou');
    verCustoHist();
  }catch(e){ const msg=document.getElementById('dpMsg'); if(msg){msg.textContent='✗ '+e.message; msg.style.color='#f87171';} }
}

async function lancarCustoHist(){
  const sku = String((document.getElementById('chSku')||{}).value||'').trim();
  const custo = String((document.getElementById('chNovo')||{}).value||'').trim();
  const de = String((document.getElementById('chDe')||{}).value||'').trim();
  const msg = document.getElementById('chMsg');
  if(!custo){ if(msg){msg.textContent='digite o custo'; msg.style.color='#fbbf24';} return; }
  try{
    const r = await fetch(BASE+'/custo-historico'+(ADMIN_K?('?k='+encodeURIComponent(ADMIN_K)):''),
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sku,custo,de})});
    const j = await r.json();
    if(!j.ok) throw new Error(j.erro||'falhou');
    verCustoHist();
  }catch(e){ if(msg){msg.textContent='✗ '+e.message; msg.style.color='#f87171';} }
}
async function apagarFaixa(sku, de){
  if(!confirm('Apagar a faixa que começa em '+de.split('-').reverse().join('/')+'?')) return;
  await fetch(BASE+'/custo-historico'+(ADMIN_K?('?k='+encodeURIComponent(ADMIN_K)):''),
    {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sku,apagar:de})});
  verCustoHist();
}

async function salvarCustosSemCusto(btn){
  const ins = Array.prototype.slice.call(document.querySelectorAll('#scTab input.scIn'));
  const itens = [];
  for (const i of ins){
    const bruto = String(i.value||'').trim().replace(/[R$\s]/gi,'').replace(',', '.');
    const v = Number(bruto);
    if (bruto && isFinite(v) && v > 0) itens.push({ sku: i.getAttribute('data-sku'), custo: v });
  }
  const msg = document.getElementById('scMsg');
  if(!itens.length){ if(msg){ msg.textContent='digite o custo de pelo menos um SKU'; msg.style.color='#fbbf24'; } return; }
  if(btn){ btn.disabled=true; btn.textContent='salvando…'; }
  try{
    const r = await fetch(BASE+'/custos-manuais'+(ADMIN_K?('?k='+encodeURIComponent(ADMIN_K)):''),
      { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ itens }) });
    const j = await r.json();
    if(!j.ok) throw new Error(j.erro||'falhou');
    if(msg){ msg.textContent='\u2713 '+j.gravados+' custo(s) salvo(s) — atualizando…'; msg.style.color='#34d399'; }
    setTimeout(function(){ location.reload(); }, 900);
  }catch(e){ if(msg){ msg.textContent='\u2717 '+e.message; msg.style.color='#f87171'; } }
  finally{ if(btn){ btn.disabled=false; btn.textContent='\ud83d\udcbe salvar custos digitados'; } }
}
function copiarSemCusto(){
  const L = (window._MC_ULT && window._MC_ULT.semCustoDet) || [];
  const txt = L.map(function(x){ return x.sku; }).join('\n');
  try{ navigator.clipboard.writeText(txt); alert(L.length+' SKU(s) copiados — cole no Bling pra achar cada um.'); }
  catch(e){ prompt('copie os SKUs:', txt); }
}

function notaBateCard(mcPed, filtrado){
  const d = Math.round((despesasMLper() + despesasSHPper())*100)/100;
  // com filtro de canal ou busca por texto a conta N\u00c3O fecha (o card de cima \u00e9 sempre do per\u00edodo
  // inteiro), ent\u00e3o a nota some em vez de mostrar uma igualdade que n\u00e3o bate.
  if(!d || filtrado || mcPed == null) return '';
  return '<div class="nota" style="margin-bottom:10px">\ud83d\udc8e M.C. por pedido <b>'+BRL(mcPed)+'</b> \u2212 '+
         'despesas do ML no per\u00edodo <b>'+BRL(d)+'</b> = <b>'+BRL(mcPed-d)+'</b> \u2014 que \u00e9 o valor do card '+
         '\ud83d\udc8e Lucro Bruto l\u00e1 em cima. Ads, armazenagem Full e devolu\u00e7\u00f5es s\u00e3o cobran\u00e7as do '+
         'PER\u00cdODO, n\u00e3o de um pedido \u2014 por isso n\u00e3o entram na margem pedido a pedido.</div>';
}

function irPra(id){
  const el=document.getElementById(id); if(!el) return;
  const hd=document.querySelector('.hdr');
  const off=(hd?hd.offsetHeight:0)+12;   // desconta o cabeçalho fixo pra parar no início da seção
  const y=el.getBoundingClientRect().top + window.pageYOffset - off;
  window.scrollTo({top:Math.max(0,y), behavior:'smooth'});
}
/* Codex + Claude (revisão do #172, item 3): o aviso de cobertura vale pro período que foi
   verificado. Como o auto-check só roda em 'dia', ao trocar de HOJE pra ONTEM ou 7 dias o texto
   antigo continuava na tela como se fosse do novo intervalo — e sem botão manual não havia como
   reverificar. Trocar de período repinta a partir do que foi verificado PARA ESTE intervalo:
   some no que não foi verificado, volta ao voltar pro HOJE (ver `pintarAvisoMkt`). */
function setPeriodo(p){
  periodo=p;
  pintarAvisoMkt();
  espelharPeriodoNaAnalise(); window._anForce=true; comAncora(()=>{ render(); renderAnalise(); });
}
// d48: o seletor do TOPO é o botão MASTER — escolheu lá, a Análise de Vendas obedece junto.
// (os chips da própria Análise continuam funcionando pra quem quiser um recorte diferente só nela)
function espelharPeriodoNaAnalise(){
  if(periodo==='custom'){ anPer='custom'; anPDe=pDe; anPAte=pAte; }
  else if(periodo==='30'){ const iv=intervalo(); anPer='custom'; anPDe=iv.de; anPAte=iv.ate; }   // a Análise não tem chip "30 dias" — vira Período… com as datas
  else anPer=periodo;   // dia/ontem/7/mes/mesant existem nos dois
  anPage=0;
}

function render(){
  const defs = [['dia','Hoje'],['ontem','Ontem'],['7','7 dias'],['30','30 dias'],['mes','Mês'],['mesant','Mês anterior'],['ano','Ano'],['custom','Período…']];
  $('chips').innerHTML = defs.map(([k,l])=>'<button class="chip'+(periodo===k?' on':'')+'" onclick="setPeriodo(\''+k+'\')">'+l+'</button>').join('');
  // no celular os 8 botões viram um seletor (economiza 2 linhas de tela)
  const sp=$('selPeriodo'); if(sp) sp.innerHTML = defs.map(([k,l])=>'<option value="'+k+'"'+(periodo===k?' selected':'')+'>'+l+'</option>').join('');
  $('custom').style.display = periodo==='custom' ? 'flex' : 'none';

  const {de, ate} = intervalo();
  // 28/07: registro FANTASMA — casca no cache sem número de pedido, sem itens e sem valor.

function desenharCharts(labels, sPed, sFat){
  // ── 05/08 (d188): o Chart.js vem de CDN externo (cdnjs, no topo do arquivo). Se ele
  // NAO carregar — CDN fora do ar, rede do lugar bloqueando, bloqueador de anuncio — o
  // `new Chart` estourava AQUI e derrubava o resto do render(): Por Canal, Vendas por
  // Estado, Projecao, config, ANALISE DE VENDAS, Previsao e Plano de Compra ficavam em
  // branco, sem mensagem nenhuma. Parecia que os dados tinham sumido.
  // Agora o grafico falha sozinho, avisa, e o painel inteiro segue de pe.
  if (typeof Chart === 'undefined') {
    ['cPed','cFat'].forEach(id=>{
      const c = $(id);
      if (c && c.parentNode) c.parentNode.innerHTML =
        '<div class="nota">\ud83d\udcc9 nao consegui carregar a biblioteca de graficos (Chart.js, vem de CDN externo). '+
        'S\u00f3 os dois gr\u00e1ficos ficam de fora \u2014 todos os n\u00fameros do painel continuam normais.</div>';
    });
    return;
  }
  if(!window.Chart){
    const c1=$('cPed'); if(c1&&c1.parentElement) c1.parentElement.innerHTML='<div class="dim" style="padding:30px;text-align:center">gráfico indisponível (CDN bloqueado)</div>';
    return;
  }
  const gopts = (fmt) => ({
    responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{display:false},
      tooltip:{backgroundColor:'#0d1326',borderColor:'#2d3a5e',borderWidth:1,titleColor:'#e7ecf6',bodyColor:'#8b96b3',
               callbacks:{ label: ctx => fmt(ctx.parsed.y) } } },
    scales:{ x:{ grid:{color:'#ffffff08'}, ticks:{color:'#5a6485',font:{size:10},maxRotation:0,autoSkip:true} },
             y:{ grid:{color:'#ffffff0a'}, ticks:{color:'#5a6485',font:{size:10}, callback:v=>fmt(v)}, beginAtZero:true } }
  });
  if(chPed) chPed.destroy();
  chPed = new Chart($('cPed'), { type:'bar',
    data:{ labels, datasets:[{ data:sPed, backgroundColor:'#6366f1cc', hoverBackgroundColor:'#818cf8', borderRadius:5, maxBarThickness:26 }] },
    options: gopts(v=>N(v)+' ped.') });
  if(chFat) chFat.destroy();
  chFat = new Chart($('cFat'), { type:'line',
    data:{ labels, datasets:[{ data:sFat, borderColor:'#22c55e', backgroundColor:'#22c55e22', fill:true, tension:.35,
                               pointRadius:2.5, pointBackgroundColor:'#22c55e', borderWidth:2 }] },
    options: gopts(v=>BRLk(Number(v))) });
}

/* 19-20/08 — "TARIFA REAL (Bling)" ERA UMA PROMESSA FALSA NO TIKTOK
   O Diego viu o pedido 119933 (TikTok) com "Tarifa REAL (Bling) R$ 4,19" — 12% de 34,90. A tarifa
   real do TikTok, medida no extrato da própria plataforma, é bem maior. Não é erro de cálculo: o
   extrato sai por pagamento e demora dias, então venda recente entra com a taxa do Bling e se
   corrige depois. O erro estava no RÓTULO — chamar de REAL um número que sabemos subestimado.
   Escopo deste PR, de propósito: SÓ o rótulo, e só onde o dado vem do cache. Marcar o histórico,
   o card do topo e a planilha exige reconhecer a assinatura em pedido multi-item e na busca — vai
   numa frente própria, para não travar esta correção. */
const _BLING_SUBESTIMA = { tiktok: { real_pct: 'maior — quanto, depende do ticket e do afiliado (a taxa fixa por item pesa mais em pedido pequeno)', bling_pct: '~12%' } };
function _tarifaProvisoria(ck, feeReal, feeBling){
  return feeReal == null && feeBling != null && !!_BLING_SUBESTIMA[ck];
}
function _seloTarifa(ck, feeReal, feeBling, feeEst){
  if (feeReal != null) return ' <span class="st ok" style="font-size:9px">REAL</span>';
  if (feeEst != null) return ' <span class="st" style="font-size:9px;background:#78350f55;color:#fbbf24;border-color:#f59e0b55" title="calculada pela tabela do TikTok (comissão 10% abaixo de R$ 50 ou 6% acima + taxa fixa por item + 6% do Frete Grátis). NÃO inclui comissão de afiliado — se a venda veio de creator, a tarifa real virá um pouco maior. Quando o extrato chegar, vira REAL">ESTIMADA</span>';
  if (feeBling == null) return '';
  if (_tarifaProvisoria(ck, feeReal, feeBling)) {
    const m = _BLING_SUBESTIMA[ck];
    return ' <span class="st" style="font-size:9px;background:#78350f55;color:#fbbf24;border-color:#f59e0b55" title="taxa que o Bling importou (' + m.bling_pct + '). A tarifa REAL deste canal, que vem no extrato do marketplace, é ' + m.real_pct + ' — esta margem está OTIMISTA">PROVISÓRIA</span>';
  }
  return ' <span class="st ok" style="font-size:9px">BLING</span>';
}
/* ═══ 20/08 — TARIFA DO TIKTOK ESTIMADA PELA REGRA, NA HORA DA VENDA ═══════════════
   O Diego: "preciso sempre do mais próximo da realidade... realmente tem q trabalhar assim no
   tiktok? não tem mm como saber antes já certinho o lucro da venda de imediato?".
   Tem. A tabela do TikTok é determinística e está publicada (vigente desde 15/07/2026):
     · comissão      10% se o pedido for < R$ 50 · 6% de R$ 50 pra cima
     · taxa fixa     R$ 4,00 (< R$ 50) · R$ 6,00 (>= R$ 50) — POR ITEM, não por pedido
     · PTE           6% do produto (as duas lojas participam — confirmado pelo Diego em 19/08)
   Só o AFILIADO não dá pra prever: depende de a venda ter vindo de creator.
   Por que não usar a média do mês: a taxa fixa por item domina o pedido pequeno (R$ 4 num pedido
   de R$ 10 é 40%) e some no grande — média achata exatamente a diferença que decide preço. No
   pedido 3642 do print dele: produtos 10,90, Bling cobrou 1,23 (11%), a regra dá 5,74 (53%).
   A estimativa vale só enquanto o extrato não chega; quando chega, vira REAL e o selo troca. */
const TIKTOK_PTE = true;   // ambas as lojas no Programa de Frete Grátis
function tarifaEstimadaTikTok(valorProdutos, itens){
  const v = Number(valorProdutos) || 0;
  if (!(v > 0)) return null;
  const abaixo = v < 50;
  const nItens = Math.max(1, Number(itens) || 1);
  const comissao = v * (abaixo ? 0.10 : 0.06);
  const fixa = (abaixo ? 4 : 6) * nItens;
  const pte = TIKTOK_PTE ? v * 0.06 : 0;
  return Math.round((comissao + fixa + pte) * 100) / 100;
}
function calcPL(h){
  const mes = diaVenda(h).slice(0,7);

  const feeBling = (h.taxa_mkt!=null&&isFinite(Number(h.taxa_mkt))&&Number(h.taxa_mkt)>0)?Number(h.taxa_mkt):null;   // 💎 comissão importada pelo Bling (TikTok/Shopee/Magalu)

  /* No TikTok a taxa do Bling é ~12% cravados, sem a fixa por item — sempre otimista. A regra
     oficial é melhor que ela em todo pedido, então entra na frente. O extrato (feeReal) continua
     mandando quando existe. */
  /* Codex (P2): a tabela só passou a valer em 15/07/2026 — antes disso era outra (6% para todos,
     fixa de R$ 4). Pedido antigo aberto pela busca teria a tarifa da época trocada por uma que não
     existia, e a margem sairia errada. E a base é o valor EFETIVO da venda (com desconto), o mesmo
     que a margem reconhece: produtos de R$ 55 vendidos por R$ 45 pagam pela faixa de ABAIXO de 50. */

  // aqui ele ainda não foi declarado, e usá-lo antes daria erro de inicialização.

      : null;

  const custoOk = cusUn===unTot && unTot>0;

  if (h.frete_ml!=null && isFinite(Number(h.frete_ml)) && Number(h.frete_ml)>0) { frV = Number(h.frete_ml); frFonte = 'ml'; }   // 0 nao e frete real: deixa cair no Bling/FLEX (senao o custo do motoboy sumia)

  // d53: RENDA OFICIAL do canal (escrow da Shopee) — o depósito exato: já liquida taxas, moedas Shopee, cupons e frete do comprador.
  // Quando existe, a M.C. ancora nela (e NÃO soma tarifa/desconto/freteRec de novo — tudo já está dentro).
  const rendaCanal = (h.renda_canal!=null && isFinite(Number(h.renda_canal)) && Number(h.renda_canal)>0) ? Number(h.renda_canal) : null;
  // Magalu: fonte do frete de coparticipação embutido na tarifa — 'real' (liquidado, da API),
  // 'prov' (estimado pela tabela/histórico, ainda vai mudar) ou null. Governa a cor no painel.
  const magFreteFonte = (ck==='magalu' && h.mag_frete_fonte) ? h.mag_frete_fonte : null;
  const magFreteCopart = (ck==='magalu' && h.mag_frete_copart!=null && isFinite(Number(h.mag_frete_copart))) ? Number(h.mag_frete_copart) : null;
  // M.C.: quando o pedido Magalu LIQUIDOU, renda_canal (saldo líquido oficial) JÁ desconta o frete real —
  // então o frete Magalu que aparece em frV é só pra EXIBIÇÃO e não pode ser descontado de novo (senão conta 2x).
  // No provisório (renda_canal null), a tarifa é só comissão, então o frete de frV É descontado (correto).
  const frVparaMC = (ck==='magalu' && frFonte==='magalu' && rendaCanal!=null) ? 0 : (frV||0);
  const mc = completo? (rendaCanal!=null ? (rendaCanal-imposto-custo-frVparaMC+(credito||0)) : (rpEf-imposto-tarifa-custo-frVparaMC+(credito||0)+(freteRec||0))) : null;
  return {mes,ck,rp,feeEstTk,rpEf,desconto,freteRec,rendaCanal,tot,frete,aliq,imposto,feeReal,feeBling,tx,tarifa,custo,cusUn,unTot,custoOk,frV,frFonte,credito,completo,mc,magFreteFonte,magFreteCopart};
}

async function abrirPL(id){
  const h = (DADOS||[]).concat(SINT||[]).find(x=>String(x.id)===String(id)); if(!h) return;   // 28/07: antes só achava os bipados
  const skus=(h.itens||[]).map(i=>i.sku).filter(Boolean);
  const faltam=skus.filter(sk=>!SKUINFO[sk]);
  if(faltam.length){ try{ const r=await fetch(MOD+'/sku-info',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({skus:faltam})}); const d=await r.json(); if(d&&d.skus) Object.assign(SKUINFO,d.skus); }catch(e){} }
  renderPL(h);
}
/* 19/08: marca qual linha está expandida — a seta da linha aberta vira ▾ e as outras voltam a ▸.
   Sem isso a setinha diria "dá pra abrir" mas nunca "está aberto". */
function setaAberta(idDoLink){
  document.querySelectorAll('.cvS').forEach(e=>{ e.textContent='\u25b8'; });   // a classe só existe nesses links, não precisa de escopo por card
  const a = idDoLink ? document.getElementById(idDoLink) : null;
  const s = a ? a.querySelector('.cvS') : null;
  if(s) s.textContent='\u25be';
}
/* 19/08 (Diego): a conta aberta mostrava o mês como "2026-08" — formato de máquina.
   Vira "Agosto 2026". Aceita 'AAAA-MM' e devolve o próprio texto se vier em outro formato. */
function mesPorExtenso(m){
  const t = String(m||'').trim();
  const p = t.match(/^(\d{4})-(\d{2})$/);
  if(!p) return t;
  const N=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const i = Number(p[2]) - 1;
  return (i>=0 && i<12) ? (N[i]+' '+p[1]) : t;
}

async function pegarFeeML(id, numeroLoja){
  try{
    const r=await fetch(MOD+'/ml-fee',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({numeroLoja})});
    const d=await r.json();
    if(d&&d.ok&&d.fee!=null){ _plMLFee[id]=Number(d.fee); const h=DADOS.find(x=>String(x.id)===String(id)); if(h) renderPL(h); }
    else alert('Tarifa ML: '+((d&&d.erro)||'não disponível'));
  }catch(e){ alert('Tarifa ML: '+e.message); }
}

async function rodarPescaML(){
  const msg=$('manutMsg'); msg.textContent='🎣 iniciando pesca ML…';
  try{
    const r=await fetch(MOD+'/ml-sync-fees?dias=14',{method:'POST',credentials:'same-origin'});
    if(r.status===404){ msg.textContent='✗ atualize o index.js no GitHub (rota antiga)'; return; }
    const d=await r.json();
    if(d&&(d.iniciado||d.rodando)) pollPesca();
    else msg.textContent=(d&&d.mensagem)||'nada a pescar';
  }catch(e){ msg.textContent='✗ '+e.message; }
}
async function pollPesca(){
  const msg=$('manutMsg');
  try{
    const r=await fetch(MOD+'/ml-sync-fees?status=1',{credentials:'same-origin'});
    const d=await r.json();
    if(d&&d.rodando){ msg.textContent='🎣 pescando… '+d.progresso+' (✓'+d.ok_ate_agora+' ✗'+d.falhas+')'; setTimeout(pollPesca,4000); }
    else{ msg.textContent='✓ pesca concluída ('+(d&&d.progresso||'')+') — recarregue a página p/ ver as tarifas'; }
  }catch(e){ msg.textContent='✗ '+e.message; }
}
async function rodarBackfillNF(){

      }
      if(!d.tem_mais && pg>=(d.total_paginas||pg)) break;
      if(d.total_paginas && pg>=d.total_paginas) break;
    }

// 29/07 — CABEÇALHO GRUDADO NO CELULAR, feito por código.
// Dentro de uma área que rola de lado (que é o caso das tabelas no telefone), o "sticky" do
// navegador não funciona: ele gruda naquela área, não na tela. Então montamos uma barra
// flutuante que COPIA o cabeçalho da tabela que está sendo lida, e some quando ela sai de vista.
// A barra acompanha a rolagem lateral do card, pra as colunas ficarem alinhadas.
let _barraCab = null, _tabAtual = null;
function _hdrAltura(){ const hd=document.querySelector('.hdr'); return hd?hd.offsetHeight:0; }
function atualizarCabecalhoFlutuante(){
  if(window.innerWidth > 720){ if(_barraCab) _barraCab.style.display='none'; return; }
  if(!_barraCab){
    _barraCab = document.createElement('div');
    _barraCab.id = 'cabFlut';
    document.body.appendChild(_barraCab);
  }
  const topo = _hdrAltura();
  let alvo = null;
  for(const tw of document.querySelectorAll('.tw')){
    if(tw.offsetParent === null) continue;              // escondida nesta largura
    const tb = tw.querySelector('table'); if(!tb) continue;
    const tr = tb.querySelector('tr'); if(!tr) continue;
    const r = tw.getBoundingClientRect();
    // a tabela precisa estar em vista E já ter passado do topo
    if(r.top < topo + 4 && r.bottom > topo + 60){ alvo = {tw, tb, tr}; break; }
  }
  if(!alvo){ _barraCab.style.display='none'; _tabAtual=null; return; }
  if(_tabAtual !== alvo.tb){
    _tabAtual = alvo.tb;
    const larguras = Array.prototype.map.call(alvo.tr.children, c=>c.getBoundingClientRect().width);
    _barraCab.innerHTML = '<div class="cabInner"><table><tr>'+
      Array.prototype.map.call(alvo.tr.children, function(c,i){
        return '<th style="width:'+larguras[i]+'px;min-width:'+larguras[i]+'px">'+c.innerHTML+'</th>';
      }).join('')+'</tr></table></div>';
  }
  const r = alvo.tw.getBoundingClientRect();
  _barraCab.style.display = 'block';
  _barraCab.style.top = topo+'px';
  _barraCab.style.left = Math.max(0, r.left)+'px';
  _barraCab.style.width = Math.min(r.width, window.innerWidth)+'px';
  const inner = _barraCab.querySelector('.cabInner');
  if(inner) inner.scrollLeft = alvo.tw.scrollLeft;      // acompanha a rolagem lateral do card
}

function baixarPlanilha(nomeArq, cabecalho, linhas){
  if(!linhas || !linhas.length){ alert('não há linhas para baixar com o filtro atual'); return; }

  // dois cliques, sem tela de importação, independente do separador do Windows.
  const esc = t => String(t==null?'':t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
  const cel = v => (typeof v === 'number' && isFinite(v))
      ? '<Cell><Data ss:Type="Number">'+v+'</Data></Cell>'
      : '<Cell><Data ss:Type="String">'+esc(v)+'</Data></Cell>';

    for(const l of linhas){ const t=String(l[i]==null?'':l[i]); if(t.length>m) m=t.length; }
    return '<Column ss:AutoFitWidth="0" ss:Width="'+Math.min(320, Math.max(58, m*6.6))+'"/>';
  }).join('');
  const xml =
    '<?xml version="1.0" encoding="UTF-8"?>\n<?mso-application progid="Excel.Sheet"?>\n'+

    '</Styles>'+
    '<Worksheet ss:Name="Dados"><Table>'+ larguras +
      '<Row ss:StyleID="cab">'+ cabecalho.map(c=>'<Cell ss:StyleID="cab"><Data ss:Type="String">'+esc(c)+'</Data></Cell>').join('') +'</Row>'+
      linhas.map(l=>'<Row>'+l.map(cel).join('')+'</Row>').join('')+
    '</Table>'+
    '<WorksheetOptions xmlns="urn:schemas-microsoft-com:office:excel"><FreezePanes/><FrozenNoSplit/>'+
      '<SplitHorizontal>1</SplitHorizontal><TopRowBottomPane>1</TopRowBottomPane><ActivePane>2</ActivePane></WorksheetOptions>'+
    '</Worksheet></Workbook>';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\uFEFF'+xml], {type:'application/vnd.ms-excel;charset=utf-8'}));
  a.download = nomeArq + '-' + hojeSP() + '.xls';

// ── 📦 projeção ─────────────────────────────────────────────────────────────
function topSkus14(){
  const corte = spDate(Date.now()-(projDias-1)*86400000);
  const hoje = hojeSP();
  const agg = {};
  (DADOS||[]).concat(SINT||[]).forEach(h=>{   // 27/07: o ritmo de vendas ignorava as não bipadas
    if(!h.conferido_em && !h.sintetico) return;
    if(h._cancelado) return;   // cancelada não entra no ritmo
    const d = diaVenda(h); if(d<corte || d>hoje) return;
    (h.itens||[]).forEach(it=>{
      const sku=it.sku; if(!sku) return;
      if(!agg[sku]) agg[sku]={sku,desc:it.descricao||'',qtd:0,fat:0,qtdV:0};
      agg[sku].qtd+=Number(it.qtd||1);
      if(it.valor_total!=null){ agg[sku].fat+=Number(it.valor_total)||0; agg[sku].qtdV+=Number(it.qtd||1); }
    });
  });
  return Object.values(agg).sort((a,b)=>b.qtd-a.qtd).slice(0,40);
}
function sincCustos(){
  const st = $('projStatus');
  fetch(MOD+'/custo-sync',{credentials:'same-origin'}).then(r=>r.json()).then(d=>{
    if(st) st.textContent = d && d.ja_rodando ? ('🐢 já sincronizando… ('+d.progresso+')') : '🐢 sincronizando custos em background (~alguns minutos) — depois clica ↻';
  }).catch(()=>{ if(st) st.textContent='✗ não consegui iniciar o custo-sync'; });
}
async function carregarSkuInfo(fresh){
  if(_skuLoading) return; _skuLoading = true;
  if(fresh) _anTried = {};
  const st=$('projStatus'), btn=$('btnProj');
  if(st) st.textContent='⏳ consultando o Bling (saldo/preço/custo)… ~30-60s na 1ª vez';
  if(btn) btn.style.display='none';
  const skus = topSkus14().map(t=>t.sku).filter(Boolean);
  if(!skus.length){ _skuLoading=false; const st1=$('projStatus'); if(st1) st1.textContent='⏳ sem SKUs ainda — re-tento quando os pedidos chegarem…'; setTimeout(()=>{ if(!skuInfoCarregado) carregarSkuInfo(fresh); }, 1500); return; }
  let feitos = 0, falhas = 0, _ultResp = '—';
  for(let i=0;i<skus.length;i+=8){   // fatias de 8: cada chamada responde em ~20s (40 de uma vez estourava o timeout do servidor)
    try{
      const r = await fetch(MOD+'/sku-info',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({skus:skus.slice(i,i+8), fresh: !!fresh})});
      if(r.status===403){ if(st) st.innerHTML='🔒 sessão de admin expirou — <a href="'+MOD+'/painel">faça login</a> e recarregue'; _skuLoading=false; return; }
      const d = await r.json();
      let nResp = 0;
      if(d && d.skus){ Object.assign(SKUINFO, d.skus); nResp = Object.keys(d.skus).length; }
      _ultResp = nResp;
    }catch(e){ falhas++; _ultResp = 'erro'; }
    feitos = Math.min(skus.length, i+8);
    if(st) st.textContent='⏳ Bling… '+feitos+'/'+skus.length+' · última fatia devolveu '+_ultResp+' SKU(s)'+(falhas?' · '+falhas+' falha(s)':'');
    if(!selAtiva()) renderProjecao();   // mostra o que chegou — sem apagar seleção de texto
  }
  skuInfoCarregado = true;
  const _comCusto = Object.values(SKUINFO).filter(x=>x&&x.custo!=null).length;
  if(st) st.textContent = (falhas? ('✓ parcial — '+falhas+' falha(s) · '):'✓ ')+Object.keys(SKUINFO).length+' SKU(s) carregados · '+_comCusto+' com custo';
  if(btn){ btn.style.display=''; btn.disabled=false; btn.textContent='↻ recarregar do Bling (ignora cache)'; }
  _skuLoading = false;
  renderSafe();   // re-render completo — espera você terminar de copiar, se estiver selecionando
}

function corMapa(t){            // 0 = pouca venda (apagado) · 1 = muita (forte)
  if(!(t>0)) return '#1b2340';
  const a=[30,58,95], b=[56,189,248];
  const c=a.map((v,i)=>Math.round(v+(b[i]-v)*Math.pow(t,0.55)));
  return 'rgb('+c[0]+','+c[1]+','+c[2]+')';
}
function renderMapaUF(porUF){
  const el=$('ufMapa'); if(!el) return;
  const tot=Object.values(porUF).reduce((a,c)=>a+(c.ped||0),0)||1;
  const max=Math.max(1,...Object.values(porUF).map(c=>c.ped||0));
  const COL_X=228;              // coluna dos rótulos que não cabem dentro
  const comVenda=Object.keys(BR_UF).filter(uf=>(porUF[uf]&&porUF[uf].ped)>0)
                   .sort((a,b)=>porUF[b].ped-porUF[a].ped);   // quem vende mais escolhe lugar primeiro
  const postos=[], dentroList=[], foraList=[];
  for(const uf of comVenda){
    const [w,h]=BR_TAM[uf]||[0,0], [cx,cy]=BR_CEN[uf]||[0,0];
    const cabe = w>=17 && h>=17;                              // espaço pra sigla + número
    const livre = !postos.some(p=>Math.abs(p[0]-cx)<19 && Math.abs(p[1]-cy)<17);   // não encosta em outro
    if(cabe && livre){ postos.push([cx,cy]); dentroList.push(uf); }
    else foraList.push(uf);
  }
  // rótulos de fora: empilhados à direita, na altura do estado, sem se sobrepor
  foraList.sort((a,b)=>(BR_CEN[a][1])-(BR_CEN[b][1]));
  let ultimo=-99; const posFora={};
  for(const uf of foraList){ const y=Math.max(BR_CEN[uf][1], ultimo+10); posFora[uf]=Math.min(y,188); ultimo=posFora[uf]; }

  let formas='', linhas='', txtDentro='', txtFora='';
  for(const uf of Object.keys(BR_UF)){
    const c=porUF[uf], ped=c?c.ped:0, pctn=ped/tot*100;
    const pct=pctn>=1?Math.round(pctn)+'%':(pctn>0?pctn.toFixed(1).replace('.',',')+'%':'0%');
    formas+='<path d="'+BR_UF[uf]+'" fill="'+corMapa(ped/max)+'" stroke="#0b1020" stroke-width="0.5">'+
            '<title>'+esc(uf+(ped?(': '+N(ped)+' pedido(s) · '+pct+(c.fat?(' · '+BRL(c.fat)):'')):': sem vendas'))+'</title></path>';
  }
  for(const uf of dentroList){
    const [cx,cy]=BR_CEN[uf], ped=porUF[uf].ped;
    const cor = (ped/max)>0.45 ? '#ffffff' : '#dbeafe';
    txtDentro+='<text x="'+cx+'" y="'+(cy-1)+'" fill="'+cor+'" font-size="7.5" font-weight="800" text-anchor="middle">'+uf+'</text>'+
               '<text x="'+cx+'" y="'+(cy+6.5)+'" fill="'+cor+'" font-size="6.8" font-weight="700" text-anchor="middle">'+N(ped)+'</text>';
  }
  for(const uf of foraList){
    const [cx,cy]=BR_CEN[uf], y=posFora[uf], ped=porUF[uf].ped;
    linhas+='<path d="M'+cx+' '+cy+'L'+(COL_X-10)+' '+y+'L'+(COL_X-2.5)+' '+y+'" fill="none" stroke="#64748b" stroke-width="0.4"/>'+
            '<circle cx="'+cx+'" cy="'+cy+'" r="0.9" fill="#94a3b8"/>';
    txtFora+='<text x="'+COL_X+'" y="'+(y+2.2)+'" font-size="6.5" font-weight="800" fill="#dbeafe">'+uf+
             ' <tspan fill="#94a3b8" font-weight="600">'+N(ped)+'</tspan></text>';
  }
  el.innerHTML='<svg viewBox="0 0 262 194" style="width:100%;max-width:600px;height:auto;display:block;margin:0 auto">'+
      formas+linhas+txtDentro+txtFora+'</svg>'+
    '<div style="display:flex;align-items:center;gap:6px;margin-top:6px;font-size:10px;color:var(--mut)">'+
      '<span>menos</span><div style="width:100px;height:9px;border-radius:5px;background:linear-gradient(90deg,#1e3a5f,#2a6fa8,#38bdf8)"></div><span>mais vendas</span>'+
      '<span style="margin-left:auto">nº de pedidos \u00b7 passe o mouse p/ % e faturamento</span></div>';
}
function renderProjecao(){
  const _qP = document.getElementById('qProj');
  const base = topSkus14().filter(x=>casaBusca(_qP?_qP.value:'', x.sku, (SKUINFO[x.sku]&&SKUINFO[x.sku].nome)||x.desc||''));
  _projBase = base;   // guardado pro Excel
  if(!base.length){ $('tProj').innerHTML='<tr><td class="dim" style="padding:14px">'+((_qP&&_qP.value)?'nenhum SKU com esse filtro':('sem vendas nos últimos '+projDias+' dias'))+'</td></tr>'; return; }
  const linhas = base.map(t=>{
    const info = SKUINFO[t.sku]||{};
    const md = t.qtd/projDias;
    const saldo = (info.saldo!=null && isFinite(Number(info.saldo))) ? Number(info.saldo) : null;
    const diasR = (saldo!=null && md>0) ? saldo/md : null;
    const compra = (saldo!=null) ? Math.max(0, Math.ceil(md*30 - saldo)) : null;
    const precoMed = (t.qtdV>0) ? t.fat/t.qtdV : null;
    const custo = (info.custo!=null && isFinite(Number(info.custo))) ? Number(info.custo) : null;
    const mUn = (precoMed!=null && precoMed>0 && custo!=null) ? precoMed - custo : null;
    return { ...t, qtd14:t.qtd, md, saldo, diasR, compra, custo, mUn };
  });
  linhas.sort((a,b)=>cmpNull(a[sortProj.col], b[sortProj.col], sortProj.dir));
  let margemTot=0, margemCob=0;
  const AJUDA_PROJ = {
    qtd14:'quantas unidades sa\u00edram no per\u00edodo do ritmo escolhido a\u00ed em cima',
    md:'m\u00e9dia de unidades por dia no mesmo per\u00edodo \u2014 \u00e9 a base de tudo aqui',
    saldo:'saldo em estoque hoje, direto do Bling',
    diasR:'em quantos dias o estoque acaba se continuar vendendo nesse ritmo',
    comprar:'quanto comprar pra ter 30 dias de estoque \u2014 j\u00e1 descontando o que voc\u00ea tem',
    custo:'custo unit\u00e1rio cadastrado no Bling',
    mgUn:'quanto sobra por unidade vendida: pre\u00e7o \u2212 custo \u2212 imposto \u2212 comiss\u00e3o'
  };
  const th=(col,lbl)=>'<th class="num sort" title="'+esc(AJUDA_PROJ[col]||'')+'" onclick="setSortProj(\''+col+'\')">'+lbl+seta(sortProj,col)+'</th>';
  $('tProj').innerHTML = '<tr><th title="código do produto no Bling">SKU</th>'+th('qtd14','Vendas '+projDias+'d')+th('md','média/dia')+th('saldo','Saldo')+th('diasR','Acaba em')+th('compra','Comprar p/ 30d')+th('custo','Custo')+th('mUn','Margem un.')+'</tr>'+
    linhas.map(t=>{
      if(t.mUn!=null){ margemTot += t.mUn*t.qtdV; margemCob++; }
      const stt = t.diasR==null ? '<span class="dim">—</span>'
        : t.diasR<7 ? '<span class="st b">'+t.diasR.toFixed(0)+' dias</span>'
        : t.diasR<15 ? '<span class="st w">'+t.diasR.toFixed(0)+' dias</span>'
        : '<span class="st ok">'+(t.diasR>=99?'99+':t.diasR.toFixed(0))+' dias</span>';
      return '<tr><td><div class="sku">'+esc(t.sku)+'</div><div class="desc">'+esc(t.desc)+'</div></td>'+
      '<td class="num">'+N(t.qtd)+'</td><td class="num dim">'+t.md.toFixed(1)+'</td>'+
      '<td class="num">'+(t.saldo!=null?N(t.saldo):'<span class="dim">?</span>')+'</td>'+
      '<td class="num">'+stt+'</td>'+
      '<td class="num">'+(t.compra!=null?(t.compra?'<b>'+N(t.compra)+'</b>':'<span class="ok">ok</span>'):'<span class="dim">—</span>')+'</td>'+
      '<td class="num">'+(t.custo!=null?BRL(t.custo):'<span class="dim">—</span>')+'</td>'+
      '<td class="num '+(t.mUn!=null?(t.mUn>0?'ok':'bad'):'dim')+'">'+(t.mUn!=null?BRL(t.mUn):'—')+'</td></tr>';
    }).join('');
  if(skuInfoCarregado){
    const cob = Math.round(margemCob/linhas.length*100);
    const k = $('kMargem');
    if(k) k.innerHTML = '<span class="ic">📊</span><div class="l">Margem bruta 14d (top 40)</div>'+
      '<div class="v '+(margemTot>=0?'ok':'bad')+'">'+BRL(margemTot)+'</div>'+
      '<div class="s">'+cob+'% dos SKUs com custo no Bling</div>';
    $('projAviso').innerHTML = (cob<100)?'<div class="aviso">⚠️ '+(linhas.length-margemCob)+' SKU(s) sem custo cadastrado no Bling (campo fornecedor) — margem parcial. Cadastre lá, ou me peça a importação por planilha.</div>':'';
  }
}
