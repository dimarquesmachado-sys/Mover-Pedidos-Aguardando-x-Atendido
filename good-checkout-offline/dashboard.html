<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inteligência de Vendas · GOOD Import</title>
<!--
  ─────────────────────────────────────────────────────────────────────────────
  DASHBOARD DA GOOD IMPORT — núcleo (17/09/2026)

  Por que esta tela é MENOR que a da AMB e da Girassol, e isso é proposital:
  a GOOD responde 15 das 27 rotas que a tela delas consome. O que falta não é
  rota — é a CAMADA DE COLETA (ML billing, ML devoluções, Magalu, TikTok,
  vendas-sync: ~4.500 linhas) que nunca foi portada pra cá.

  Montar a tela cheia agora daria cards vazios ou quebrados, que é pior que card
  ausente: número que não aparece o dono procura, número errado ele acredita.
  Então aqui está só o que a GOOD RESPONDE HOJE — e é justamente o núcleo de
  margem, onde as alíquotas apuradas de 2026 (#499) aparecem.

  Cada coletor portado depois habilita o card dele, um a um.
  ────────────────────────────────────────────────────────────────────────────
-->
<style>
/* 18/09 — a linha do ⚙️ passou a ter três partes (mês · campo · o que vale hoje). Sem isto o
   texto de ajuda saía cortado no meio, como o dono viu: "vazio = usa a ta". */
.linhaCfg { display:flex; align-items:center; gap:10px; margin:6px 0 }
.linhaCfg > span:first-child { min-width:72px }
.linhaCfg .campo.mini { width:110px; margin:0 }
.linhaCfg .vale { flex:1; font-size:12px }


  :root{
    --bg:#0a0e1a; --bg2:#0d1326; --card:#131a30; --card2:#182138;
    --line:#232d4a; --line2:#2d3a5e;
    --tx:#e7ecf6; --mut:#8b96b3; --dim:#5a6485;
    --ac:#6366f1; --ac2:#818cf8; --ok:#22c55e; --ok2:#4ade80;
    --warn:#f59e0b; --bad:#ef4444; --cy:#22d3ee;
    --r:14px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:radial-gradient(1200px 500px at 70% -100px,#151d3a 0%,var(--bg) 55%);color:var(--tx);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,sans-serif;padding:0 16px 40px}
  a{color:var(--ac2);text-decoration:none}
  .wrap{max-width:min(1720px,96vw);margin:0 auto}
  .hdr{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,rgba(10,14,26,.97) 70%,rgba(10,14,26,0));
       padding:14px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px}
  .hrow{max-width:min(1720px,96vw);margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  /* cabeçalho: filtros à esquerda · atalhos à direita, tudo dentro da faixa fixa */
  .hbot{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding-bottom:8px}
  .hleft{flex:1 1 auto;min-width:0}
  .atalhos{flex:0 0 auto;display:flex;gap:8px;align-items:flex-start;max-width:66%}
  /* d197 (pedido do Diego): eram 11 atalhos em grade de 5 = TRÊS linhas (5+5+1), e a
     última sozinha ficava feia. Com 6 colunas dá 6+5 = DUAS linhas cheias.
     Pra caber em 6, os botões ficaram um pouco menores e os rótulos mais longos
     foram encurtados — o nome inteiro continua no title, ao passar o mouse. */
  .atGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;flex:1 1 auto}
  .atGrid .chip{width:100%;justify-content:center;text-align:center}
  .atalhos .chip{white-space:nowrap;padding:5px 7px;font-size:11px;letter-spacing:-.01em}
  h1{font-size:17px;font-weight:800;margin:0;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
  h1 .logo{width:30px;height:30px;border-radius:9px;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:19px;vertical-align:-7px;margin-right:2px}
  .badge{font-size:10px;font-weight:700;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:1px 6px;letter-spacing:.05em}
  .hlinks{margin-left:auto;font-size:12px;color:var(--mut)}
  /* d200 (pedido do Diego): MESMA paleta do checkout, pra nao ter dois padroes.
     Bling roxo · NF verde · marketplace azul — em todos os lugares onde o link
     aparece (Buscar Pedido, Analise de Vendas, detalhe do pedido). */
  .lkB{color:#a78bfa;text-decoration:none;font-weight:700}   /* Bling    */
  .lkN{color:#4ade80;text-decoration:none;font-weight:700}   /* NF       */
  .lkM{color:#38bdf8;text-decoration:none;font-weight:700}   /* mercado  */
  .lkB:hover,.lkN:hover,.lkM:hover{text-decoration:underline}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .chip{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:999px;
        padding:7px 15px;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .15s}
  .chip:hover{border-color:var(--line2);color:var(--tx)}
  .chip.on{border-color:var(--ac);color:#fff;background:linear-gradient(135deg,#1e2650,#232d5e);box-shadow:0 0 0 1px var(--ac) inset}
  .custom{display:none;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
  input[type=date],input[type=number]{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:7px 10px;font-size:12.5px}
  .cover{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:11.5px;color:var(--mut)}
  .pill{border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--card)}
  .pill b{font-weight:800}
  .pill.g b{color:var(--ok)} .pill.w{border-color:#f59e0b44} .pill.w b{color:var(--warn)}
  .kpis{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:12px;margin:18px 0;padding-bottom:6px}
  .kpis::-webkit-scrollbar{height:6px}
  .kpis::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
  .kpi{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);
       flex:1 1 150px;min-width:146px;
       padding:14px 16px;position:relative;overflow:hidden;transition:transform .15s,border-color .15s}
  .kpi:hover{transform:translateY(-2px);border-color:var(--line2)}
  .kpi::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:var(--kc,var(--ac));opacity:.9}
  /* 28/07: o ícone ficava sozinho numa linha acima do título. Agora ele e o título
     ficam LADO A LADO — "💰 Faturamento Total" — e sobra altura no card. */
  .kpi .ic{font-size:15px;opacity:.9;float:left;margin:0 6px 0 0;line-height:1.25}
  .kpi .l{font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.02em;margin-top:1px;
          display:block;overflow:hidden}
  .kpi .v,.kpi .s{clear:both}
  .kpi .v{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
  .kpi .s{font-size:10.5px;color:var(--dim);margin-top:2px}
  /* o cabeçalho é fixo: reserva a altura dele pra o atalho parar no INÍCIO da seção, não em cima dela */
  .sec{scroll-margin-top:calc(var(--hdrH,104px) + 14px);background:linear-gradient(170deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);
       padding:18px;margin:14px 0}
  .sec h2{font-size:14px;font-weight:800;margin:0 0 14px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sec h2 .hint{font-size:10.5px;font-weight:600;color:var(--dim);margin-left:auto}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:860px){ .grid2{grid-template-columns:1fr} }
  .chartbox{position:relative;height:230px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{color:var(--mut);text-align:left;font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;
     padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;user-select:none}
  th.sort{cursor:pointer} th.sort:hover{color:var(--tx)}
  /* cabecalho congelado: o wrapper .tw rola por dentro e o <th> gruda no topo dele */
  /* 29/07 — TRAVA: a página não pode ficar mais larga que a tela. Sem isso, uma tabela larga
     empurra o documento pro lado, dá pra arrastar a tela e o cabeçalho fixo e os botões
     flutuantes "somem" (ficam presos na tela enquanto a página desliza por baixo).
     Uso 'clip' e não 'hidden' de propósito: 'hidden' criaria uma área de rolagem e quebraria
     tudo que é grudado; 'clip' só corta, sem virar rolagem. */
  html{overflow-x:clip}
  body{overflow-x:clip;max-width:100vw}
  .tw{border-radius:10px}
  .tw th{position:sticky;top:var(--hdrH,104px);z-index:3;background:#141b33;box-shadow:0 2px 6px rgba(0,0,0,.45)}
  .tw thead th{top:0}

  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr{transition:background .12s}
  tbody tr:hover{background:#ffffff08}
  tr:last-child td{border-bottom:none}
  .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .bar{background:#ffffff10;border-radius:99px;height:7px;overflow:hidden;min-width:60px}
  .bar>i{display:block;height:7px;border-radius:99px;background:linear-gradient(90deg,var(--ac),var(--ac2))}
  .bar>i.g{background:linear-gradient(90deg,#16a34a,var(--ok2))}
  .rank{display:inline-flex;width:24px;height:24px;border-radius:8px;align-items:center;justify-content:center;
        font-size:11px;font-weight:800;background:#ffffff0d;color:var(--mut)}
  .rank.r1{background:linear-gradient(135deg,#fbbf24,#d97706);color:#1a1204}
  .rank.r2{background:linear-gradient(135deg,#e2e8f0,#94a3b8);color:#1e293b}
  .rank.r3{background:linear-gradient(135deg,#f6ad7b,#c2703d);color:#2d1505}
  .sku{font-weight:700} .desc{font-size:11px;color:var(--mut);line-height:1.3;
        display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;
        white-space:normal;word-break:break-word}
  .cvS{opacity:.65;font-size:11px;display:inline-block;width:9px}
  /* 19/08 (Diego printou a tela a meio carregar e leu metade do faturamento como se fosse
     o total): no período longo os cards ficavam mostrando o CACHE enquanto o histórico não
     chegava, sem dizer nada. Agora eles ficam esmaecidos e uma faixa avisa. */
  .kpis.carregando{opacity:.45;filter:saturate(.5)}
  .avisoCarr{display:flex;align-items:center;gap:8px;margin:14px 0 -6px;padding:9px 14px;border-radius:10px;
        background:#78350f22;border:1px solid #f59e0b55;color:#fbbf24;font-size:12.5px;font-weight:600}
    .mut{color:var(--mut)} .dim{color:var(--dim)} .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
  .cvg{font-size:10px;color:var(--warn);background:#f59e0b14;border:1px solid #f59e0b33;border-radius:5px;padding:1px 5px;margin-left:6px;white-space:nowrap}
  .st{display:inline-block;font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 8px}
  .st.ok{background:#22c55e1a;color:var(--ok2);border:1px solid #22c55e33}
  .st.w{background:#f59e0b1a;color:var(--warn);border:1px solid #f59e0b33}
  .st.b{background:#ef44441a;color:#f87171;border:1px solid #ef444433}
  .aviso{font-size:12px;color:var(--warn);margin-top:10px;background:#f59e0b0d;border:1px solid #f59e0b26;border-radius:9px;padding:8px 12px}
  .nota{font-size:11px;color:var(--dim);margin-top:14px;line-height:1.6}
  .btn{background:linear-gradient(135deg,var(--ac),#4f46e5);border:none;color:#fff;border-radius:10px;padding:9px 16px;
       font-size:12.5px;font-weight:700;cursor:pointer;transition:filter .15s}
  .btn:hover{filter:brightness(1.15)} .btn[disabled]{opacity:.5;cursor:default}
  .loginbox{max-width:440px;margin:80px auto;text-align:center;background:var(--card);border:1px solid var(--line);
            border-radius:16px;padding:40px 30px}
  .skel{color:var(--dim);text-align:center;padding:30px}
  ::-webkit-scrollbar{height:8px;width:8px} ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px}
  /* tabela de estados: colunas juntinhas, sem espaço à toa */
  #tUF td,#tUF th{padding:5px 6px;font-size:12px}
  #tUF td.num,#tUF th.num{padding-left:4px;padding-right:6px}
  #twUF table{min-width:0}
  /* coluna com explicação: sublinhado pontilhado discreto avisa que dá pra passar o mouse */
  th[title]{cursor:help;text-decoration:underline dotted rgba(255,255,255,.28);text-underline-offset:3px}
  th[title]:hover{color:#cfe0ff}
  /* legenda do rodapé da Análise */
  .lg{display:inline-flex;align-items:center;gap:5px}
  .lg i{width:11px;height:11px;border-radius:2px;display:inline-block}
  /* barra da Análise */
  .anPerLinha{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .anPerLinha:empty,.anPerLinha:has(#anPerChips:empty){margin-bottom:0}
  .anBarra{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .anSel{flex:0 0 auto;max-width:220px}
  .anBusca{flex:1 1 240px;min-width:160px}
  /* campo com rótulo em cima (Plano de Compra) */
  /* totais da Análise: 3 por linha; a última linha estica pra preencher */
  .miniTot{flex:1 1 calc(33.33% - 6px);min-width:96px}
  /* 02/08: na seção de despesas do ML são 5 caixas — com 33% cada, as duas últimas esticavam
     pra meia tela num monitor largo. Aqui elas ganham um teto e ficam do mesmo tamanho. */
  #mlbCards .miniTot{flex:0 1 210px;min-width:170px}
  #mlbCards>div{gap:8px}
  /* 29/07: busca + Excel + ↻ num grupo indivisivel - antes o Excel caia sozinho numa linha
     quando os botoes de periodo ocupavam muito espaco. Agora eles andam sempre juntos. */
  .grpBusca{display:flex;gap:6px;align-items:center;flex:1 1 320px;min-width:260px}
  .grpBusca .campoBusca{flex:1 1 auto;min-width:0;max-width:340px}
  .grpBusca .btFiltro{flex:0 0 auto}
  /* seletores do Plano de Compra - o rotulo vive DENTRO da opcao, entao sempre da pra ler */
  .cpSel{background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:9px;
         padding:8px 9px;font-size:12.5px;font-weight:600;cursor:pointer;max-width:210px}
  .cpSel:hover{border-color:var(--line2)}
  .selSempre{display:inline-block!important;background:var(--bg2);border:1px solid var(--line);color:var(--tx);
             border-radius:9px;padding:7px 9px;font-size:12.5px}
  /* botões auxiliares menores (recarregar do Bling / sincronizar custos) */
  .btMini{padding:6px 10px;font-size:12px}
  /* barra que repete o cabeçalho da tabela em leitura (só no celular) */
  #cabFlut{position:fixed;z-index:45;display:none;pointer-events:none;
           box-shadow:0 4px 12px rgba(0,0,0,.55);border-radius:0 0 8px 8px;overflow:hidden}
  #cabFlut .cabInner{overflow:hidden}
  #cabFlut table{border-collapse:collapse;background:#141b33}
  #cabFlut th{background:#141b33;color:var(--mut);font-size:10.5px;font-weight:700;text-align:left;
              padding:7px 8px;border-bottom:1px solid var(--line2);white-space:nowrap;
              text-transform:uppercase;letter-spacing:.02em}
  #cabFlut th .sort,#cabFlut th span{pointer-events:none}
  /* navegador flutuante entre cards */
  #navCards{position:fixed;right:14px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:6px;
            opacity:0;transition:opacity .18s}
  #navCards button{width:38px;height:34px;border-radius:9px;cursor:pointer;font-size:13px;line-height:1;
            background:rgba(19,26,48,.92);border:1px solid var(--line2);color:#cfe0ff;backdrop-filter:blur(4px);
            box-shadow:0 3px 10px rgba(0,0,0,.4)}
  #navCards button:hover{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
  #navCards button.topo{font-size:15px;height:30px;opacity:.85}
  /* cartões de venda (só aparecem no celular) */
  .vcards{display:none}
  .vcard{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
  .vcTopo{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:5px}
  .vcNum{font-weight:800;font-size:14px}
  .vcHora{color:var(--mut);font-size:11px;margin-left:auto}
  .vcSku{font-size:12px;color:#cfe0ff;font-family:ui-monospace,monospace;line-height:1.35;margin-bottom:6px;word-break:break-word}
  .vcNums{display:grid;grid-template-columns:1fr 1fr;gap:5px}   /* 4 quadrinhos em 2x2 */
  .vcB{background:var(--bg2);border-radius:7px;padding:5px 7px}
  .vcB i{display:block;font-style:normal;font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
  .vcB b{font-size:12.5px;font-variant-numeric:tabular-nums}
  .selPer{display:none}
  .selAt{display:none}
  .selFiltro{display:none}
  .soCel{display:none}
  .covResumo{display:none}
  #coverTopo .covResumo{display:inline-flex;align-items:center;gap:5px;cursor:pointer;font:inherit;font-size:11px;padding:4px 9px}
  /* botão de volta pro checkout — pedido do Diego 11/08: "não só o escrito" */
  .btnCheckout{display:inline-flex;align-items:center;gap:6px;background:#1e3a8a;border:1px solid #3b82f6;color:#dbeafe;padding:5px 14px;border-radius:8px;text-decoration:none;font-weight:700;font-size:12px;white-space:nowrap}
  .btnCheckout:hover{background:#1d4ed8;color:#fff}
  /* indicador de cobertura: destaque roxo, colado no "← checkout" */
  #coverTopo .covResumo{background:#4c1d95;border:1px solid #6d28d9;color:#ddd6fe;white-space:nowrap}
  #coverTopo .covResumo:hover{background:#5b21b6;border-color:#7c3aed}
  #coverTopoDet{width:100%}
  /* d195 (pedido do Diego): o card "Ao Vivo" saiu da grade pra abrir espaço pro card
     de Taxas. O 🔄 do topo já fazia o mesmo papel no celular desde sempre — agora
     vale em qualquer tela. */
  .btnVivo{display:inline-block;background:#38bdf822;border:1px solid #38bdf855;color:#7dd3fc;border-radius:8px;
           padding:6px 10px;font-size:15px;cursor:pointer;line-height:1}
  /* ══════════════ CELULAR ══════════════ */
  /* 11/08 (pedido do Diego): foto do TOP Produtos DOBRADA no desktop — 76px. No celular
     ela volta pra 38px, senão a linha estica e a tabela vira rolagem infinita. */
  img.fotoTop{width:76px;height:76px;object-fit:cover;border-radius:8px;background:#0b1220;display:block}
  .fotoTop.semFoto{display:inline-flex;align-items:center;justify-content:center;width:76px;height:76px;border-radius:8px;background:#0b1220;font-size:28px}
  @media(max-width:720px){
    body{padding:0 8px 30px}
    .sec{padding:12px;border-radius:12px}
    .desc{max-width:150px}
    /* as tabelas que sobram (TOP Produtos, Por Canal, Projeção) rolam de lado sem esticar a página */
    .tw{max-width:100%;overflow-x:auto}
    /* 29/07: overflow-x cria uma área de rolagem própria e QUEBRA o cabeçalho grudado.
       Nas tabelas que cabem na tela (colunas já reduzidas) tiramos o overflow, e aí o
       cabeçalho gruda igual ao do computador. */
    /* 29/07 — VOLTOU ATRÁS: eu tinha forçado as tabelas a caber, e isso espremeu tudo e estragou
       a leitura. O card PODE rolar de lado; o que não pode é a PÁGINA sair da borda — e disso
       cuida a trava em html/body lá em cima. O cabeçalho grudado agora é feito por código
       (barra flutuante), porque dentro de uma área que rola de lado o 'sticky' não funciona. */
    .twFit{overflow-x:auto!important;max-width:100%}
    .tw table{min-width:640px}
    #secAnalise .vcards+.tw{display:none}
    /* cards: 2 por linha em vez de rolagem lateral */
    .kpis{display:grid;grid-template-columns:1fr 1fr;overflow-x:visible;gap:8px;margin:6px 0 12px}
    .kpi{min-width:0!important;padding:10px 12px}
    .kpi .v{font-size:17px} .kpi .l{font-size:10px} .kpi .s{font-size:9.5px}
    .kpi .ic{font-size:15px}
    /* alvos de toque maiores */
    .chip{padding:9px 13px;font-size:13px}
    button.chip,.btn{min-height:38px}
    h2{font-size:15px}
    .hint{display:none}
    /* no celular o cabeçalho empilha e a barra de atalhos rola de lado */
    .hbot{flex-direction:column;gap:6px}
    /* período: 8 botões viram 1 seletor · atalhos idem */
    .chips{display:none}
    .atalhos{display:none}
    .selAt{display:block;width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--tx);
           border-radius:9px;padding:9px 10px;font-size:14px;font-weight:700;margin-top:6px}
    /* botão de atualizar sobe pro topo (o card "Ao Vivo" some da grade) */
    .kpiVivo{display:none}                    /* o 🔄 do topo faz o mesmo papel */
    #kpis .kpi:last-child:nth-child(odd){grid-column:1 / -1}
    /* ── barras de filtro dos cards ──
       mesma ideia do cabeçalho: o que era uma fileira de botões vira um seletor.
    /* linha 2: o grupo inteiro ocupa a largura */
    .grpBusca{flex:1 1 100%!important;min-width:0!important;order:3;gap:5px}
    /* !important porque esses dois têm display:flex escrito no próprio elemento, e estilo
       embutido ganha da folha de estilo — sem isso os botões continuavam aparecendo junto do seletor */
    #prevChips,#projChips,.rotFiltro{display:none!important}
    .soDesk{display:none}
    .soCel{display:inline}
    .selFiltro{display:block;flex:1 1 calc(100% - 84px);min-width:0;
               background:var(--bg2);border:1px solid var(--line);color:var(--tx);
               border-radius:9px;padding:9px 10px;font-size:14px;font-weight:700}
    /* 28/07: as contas batiam EXATAMENTE 100% e a linha quebrava por um fio. Agora sobra folga,
       e o seletor encolheu — ele estava tomando quase a linha inteira sozinho. */
    .campoDias{flex:0 0 62px!important;order:2}
    /* linha 2: busca + Excel + ↻, tudo junto (a busca cede o espaço) */
    .campoBusca{flex:1 1 calc(100% - 118px)!important;order:3;min-width:90px!important}
    .btFiltro{order:4;flex:0 0 auto;padding:8px 9px;font-size:12.5px}
    .selFiltro{flex:1 1 calc(100% - 84px);order:1;padding:7px 8px;font-size:13px;min-width:0}
    /* Análise no celular: [canal][busca] em cima, [chips][ações][paginação] embaixo */
    /* 3 caixas de total por linha, e a última linha divide o espaço entre as que sobraram */
    .miniTot{flex:1 1 calc(33.33% - 5px)!important;min-width:0!important;padding:6px 7px!important}
    .miniTot>div:first-child{font-size:8.5px!important}
    .miniTot>div:last-child{font-size:12px!important}
    .anBarra{gap:6px}
    .anSel{flex:0 0 auto!important;max-width:128px;font-size:12px;padding:7px 6px}
    .anBusca{flex:1 1 calc(100% - 136px)!important;min-width:0!important;font-size:16px}
    .anAcao{padding:8px 9px;font-size:12.5px}
    #anInfo{flex:0 1 auto;order:5;font-size:11px;white-space:nowrap;margin:0}   /* junto das setas, não numa linha só pra ele */
    /* Plano de Compra: 3 campos dividem a linha 1; curva + busca + botões na linha 2 */
    /* Plano de Compra: 2 seletores por linha, legiveis */
    .cpSel{flex:1 1 calc(50% - 4px);max-width:none;min-width:0;font-size:12.5px;padding:9px 8px}
    #qCompra{flex:1 1 calc(100% - 196px)!important;min-width:80px!important;order:3}
    /* botões auxiliares: pequenos e na mesma linha */
    .btMini{padding:6px 9px!important;font-size:11.5px!important}
    #projBox{font-size:11.5px}
    /* os 2 gráficos por dia tinham um respiro maior que os outros cards */
    .grid2{gap:12px}
    .grid2>.sec{margin-bottom:0}
    /* no celular elas viravam uma fileira apertada; agora a busca ocupa a linha toda
       e os botões/campos pequenos ficam embaixo, sem espremer */
    #qPrev,#qProj,#qTop{flex:1 1 100%!important;min-width:0!important;font-size:16px!important;padding:9px 10px!important}
    #prevDiasLivre,#projDiasLivre{width:70px!important;font-size:14px!important}
    #prevChips,#projChips{gap:5px}
    #prevChips .chip,#projChips .chip{padding:7px 10px;font-size:12.5px}
    /* navegador flutuante: um pouco maior no dedo e fora do caminho do rodapé */
    #navCards{right:10px;bottom:26px;gap:5px}   /* mais alto: no Android o rodapé do navegador cobria */
    #navCards button{width:42px;height:38px;font-size:14px}
    /* previsão: no celular só o essencial (produto, vendidas, tendência, 1 mês, 1 ano) */
    #pvTab tr>*:nth-child(1),#pvTab tr>*:nth-child(5),#pvTab tr>*:nth-child(7),#pvTab tr>*:nth-child(8){display:none}
    #pvTab table,#pvTab{min-width:0}
    .selPer{display:block;width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--tx);
            border-radius:9px;padding:9px 10px;font-size:14px;font-weight:700}
    /* ── CABEÇALHO COMPACTO ── */
    /* o resumo mora SÓ no topo (ao lado do checkout); o de baixo sai de cena */
    #coverTopo .covResumo{display:inline-flex!important;align-items:center;gap:5px;cursor:pointer;font:inherit}
    #cover .covResumo{display:none}
    #cover .covItem{display:none}
    #cover.aberto .covItem{display:inline-flex}
    #cover{gap:6px;margin-top:4px}
    /* título menor, numa linha só */
    h1{font-size:16px;line-height:1.25}
    .hrow{gap:6px;align-items:flex-start}
    h1{flex:1 1 100%}
    /* 🔄 · ← checkout · status: tudo numa linha, à esquerda */
    .hlinks{flex-direction:row!important;align-items:center!important;gap:10px;width:100%;
            justify-content:flex-start!important;flex-wrap:wrap;margin-top:6px}
    h1{margin-bottom:2px}
    .hbot{margin-top:8px}
    .hdr{padding-bottom:8px}
    .hlinks>div{gap:10px!important}
    /* os dois seletores lado a lado */
    .hbot{flex-direction:row!important;gap:8px;align-items:flex-start;padding-bottom:4px}
    .hdr{padding-bottom:2px}
    #histAviso:empty{display:none;margin:0}
    .hleft{flex:1 1 0;min-width:0}
    .selAt{flex:1 1 0;min-width:0;margin-top:0}
    .selPer,.selAt{padding:8px 8px;font-size:13px}
    .atalhos{max-width:100%;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap!important;
             -webkit-overflow-scrolling:touch;padding-bottom:2px}
    .atalhos .chip{flex:0 0 auto;white-space:nowrap}
    /* tabelas mais compactas */
    table{font-size:11.5px}
    td{padding:7px 6px} th{padding:6px 6px;font-size:9.5px}
    .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
    /* 29/07 — VOLTOU ATRÁS: eu tinha forçado as tabelas a caber, e isso espremeu tudo e estragou
       a leitura. O card PODE rolar de lado; o que não pode é a PÁGINA sair da borda — e disso
       cuida a trava em html/body lá em cima. O cabeçalho grudado agora é feito por código
       (barra flutuante), porque dentro de uma área que rola de lado o 'sticky' não funciona. */
    .twFit{overflow-x:auto!important;max-width:100%}
    /* ANÁLISE no celular: a tabela some e cada venda vira um CARTÃO (ver .vcards) */
    #secAnalise .tw{display:none}
    .vcards{display:flex;flex-direction:column;gap:8px}
    img.fotoTop{width:38px;height:38px;border-radius:6px}
    .fotoTop.semFoto{width:38px;height:38px;font-size:15px;border-radius:6px}
    /* TOP PRODUTOS: esconde curva e participação */
    /* 29/07: a coluna 7 (💎 Lucro Bruto, o VALOR da M.C.) estava escondida — sobrava a % sem o
       valor. Agora ela fica, e saem o nº da linha, o Custo e o Retorno/custo. */
    /* 11/08 (Codex PR#22): a coluna FOTO entrou como 2ª e empurrou todas as outras uma
       casa. Índices atualizados: some o nº da linha (1), o Custo (7) e o Retorno/custo (10);
       ficam Foto, Produto, Unid., Faturamento e o 💎 Lucro Bruto. */
    #tProd tr>*:nth-child(1),#tProd tr>*:nth-child(7),#tProd tr>*:nth-child(10){display:none}
    /* cabeçalho congelado da tabela desligado no celular (brigava com a barra fixa) */
    .tw th{position:static;box-shadow:none}
    /* rodapé de paginação empilha */
    #anRodape{flex-wrap:nowrap;gap:6px;overflow-x:auto}   /* tudo numa linha só */
    /* mapa do Brasil menor */
    #ufMapa{transform:scale(.86);transform-origin:top left}
  }
  /* ══════════════ CELULAR ESTREITO ══════════════ */
  @media(max-width:520px){
    .kpis{grid-template-columns:1fr 1fr}
    .kpi .v{font-size:16px}
    #tProd tr>*:nth-child(4){display:none}   /* tela bem estreita: sai também a Curva (era a 3, virou 4 com a Foto) */
    table{font-size:11px} td{padding:6px 5px}
    .sskus div{font-size:11px}
    .vcNums{grid-template-columns:1fr 1fr}
    .vcNum{font-size:13px}
    .tw table{min-width:560px}
  }

  /* ══════════════ MARCAÇÃO PRÓPRIA DESTA TELA ══════════════
     17/09 — a tela nasceu MENOR que a da AMB/Girassol de propósito (ver comentário no topo do
     arquivo), com marcação mais simples (.card, .bloco, .campo…) em vez de reaproveitar os
     componentes grandes (.kpi, .sec, .hdr…) que o resto deste bloco de estilo define. Essas
     classes nunca ganharam regra própria: a página inteira renderizava sem nenhum estilo — o
     bug raiz por trás do modal "sumido" e da tabela sem rolagem que o Codex apontou. */
  header.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:6px 0 14px}
  .marca{display:flex;align-items:center;gap:8px}
  .marca .logo{width:30px;height:30px;border-radius:9px;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:19px}
  .build{font-size:10px;font-weight:700;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:1px 6px;letter-spacing:.05em}
  .acoes{display:flex;gap:8px;flex-wrap:wrap}
  nav.periodos{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
  .periodos .per{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:999px;
        padding:7px 15px;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .15s}
  .periodos .per:hover{border-color:var(--line2);color:var(--tx)}
  .periodos .per.on{border-color:var(--ac);color:#fff;background:linear-gradient(135deg,#1e2650,#232d5e);box-shadow:0 0 0 1px var(--ac) inset}
  section.cards{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0}
  .card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);
        flex:1 1 150px;min-width:146px;padding:14px 16px}
  .card-tit{font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.02em}
  .card-val{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
  .card-sub{font-size:10.5px;color:var(--dim);margin-top:2px}
  .bloco{background:linear-gradient(170deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);
        padding:18px;margin:14px 0}
  .bloco h2{font-size:14px;font-weight:800;margin:0 0 10px;letter-spacing:-.01em}
  .campo{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:9px;
        padding:9px 12px;font-size:13px;width:100%;max-width:420px}
  .campo.mini{max-width:110px;padding:7px 9px}
  .paginacao{display:flex;align-items:center;gap:10px;margin-top:12px}
  .linhaCfg{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;font-size:12.5px}
  .qtd{color:var(--ac2)}
  /* Codex P1: o modal ficava fora da tela (sem overlay fixo, entrava no fluxo normal do documento) */
  .modal{position:fixed;inset:0;background:rgba(5,8,16,.72);z-index:80;align-items:center;justify-content:center;padding:16px}
  .modal-corpo{background:var(--card2);border:1px solid var(--line);border-radius:var(--r);padding:20px;
        max-width:480px;width:100%;max-height:86vh;overflow:auto}
  @media(max-width:720px){
    section.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .card{min-width:0;padding:10px 12px}
    .card-val{font-size:17px} .card-tit{font-size:10px} .card-sub{font-size:9.5px}
  }

</style>

<body>

<div class="wrap">
  <header class="top">
    <div class="marca">
      <span class="logo">📦</span>
      <h1>Inteligência de Vendas · <b>GOOD Import</b></h1>
      <span class="build" id="build">g6</span>
    </div>
    <div class="acoes">
      <button class="btn" onclick="abrirConfig()">⚙️ Impostos</button>
      <button class="btn" onclick="recarregar()">↻ Atualizar</button>
    </div>
  </header>

  <nav class="periodos" id="periodos"></nav>
  <div class="dim" id="janela" style="margin:6px 0 14px"></div>

  <section class="cards" id="cards"></section>

  <section class="bloco">
    <h2>🔍 Buscar Pedido e Lucro</h2>
    <!-- Codex (P2): a busca chama só /buscar-lucro, que filtra numero_pedido/numero_loja/sku/descrição —
         não indexa número de NF (isso é /buscar-pedido, ao vivo no Bling, que esta tela não usa). -->
    <div class="dim">nº do pedido · nº da venda no marketplace · SKU · parte do título</div>
    <input id="busca" class="campo" placeholder="digite e tecle Enter" onkeydown="if(event.key==='Enter')buscar()">
    <div id="resBusca"></div>
  </section>

  <section class="bloco">
    <h2>📊 Análise de Vendas</h2>
    <div class="dim" id="resumoAnalise"></div>
    <div id="quebras" class="cards" style="margin-top:14px"></div>
<div id="tabela"></div>
    <div class="paginacao" id="paginacao"></div>
  </section>

  <div id="avisos"></div>
</div>

<div class="modal" id="modalConfig" style="display:none">
  <div class="modal-corpo">
    <h2>⚙️ Alíquotas do Simples</h2>
    <div class="dim">A alíquota salva aqui tem precedência sobre a tabela do código.
      Salvar um mês <b>recalcula o histórico</b> daquele mês.</div>
    <div id="camposAliq"></div>
    <div class="acoes" style="margin-top:14px">
      <button class="btn" onclick="salvarConfig()">Salvar</button>
      <button class="btn" onclick="fecharConfig()">Fechar</button>
    </div>
    <div id="msgConfig" class="dim"></div>
  </div>
</div>

<script>
const MOD = '/good-checkout-offline';
// Codex (P1): quem abre o dashboard por ?k=ADMIN_KEY não tem cookie — propaga a chave a
// TODAS as chamadas do módulo, senão cada fetch cai em 403/404 e a tela vira avisos de erro.
// Mesmo padrão da AMB e da Girassol (amb-dashboard.html / girassol dashboard.html).
(function(){
  const K = new URLSearchParams(location.search).get('k');
  if (!K) return;
  const _f = window.fetch.bind(window);
  window.fetch = function(u, o){
    try { if (typeof u === 'string' && u.indexOf(MOD) === 0) u += (u.indexOf('?') >= 0 ? '&' : '?') + 'k=' + encodeURIComponent(K); } catch(e){}
    return _f(u, o);
  };
})();
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BRL = v => 'R$ ' + (Math.round((Number(v)||0)*100)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const PCT = v => (Math.round((Number(v)||0)*10)/10).toLocaleString('pt-BR',{maximumFractionDigits:1}) + '%';
// Codex (P1): toISOString() converte pra UTC — perto das 21h no horário de Brasília isso já
// é o dia seguinte em UTC, e "Hoje"/"Ontem" pediam a janela errada ao servidor. Mesmo padrão
// da AMB e da Girassol: monta a data pelo relógio de São Paulo, não pelo fuso do navegador.
const hojeSP = () => new Date().toLocaleString('sv-SE',{timeZone:'America/Sao_Paulo'}).slice(0,10);
const spDate = ms => new Date(ms).toLocaleString('sv-SE',{timeZone:'America/Sao_Paulo'}).slice(0,10);

/* 01/10 — ABRE NO DIA, como a Girassol. O dono: "começa ainda pelo mês ao invés do dia".
   O painel da Girassol tem `periodo = 'dia'` com o comentário "(pedido do Diego)" — a GOOD
   usa a chave 'hoje' (não 'dia') pro mesmo botão, e pintarPeriodos() só acende o botão cuja
   chave é igual a PERIODO. Nasceu em 'mes' e ficou pra trás. No dia 1º os dois dão a mesma janela, o que esconde a
   diferença justamente no dia em que ele reparou. */
/* Codex #557 (P2): a chave do Hoje na GOOD é 'hoje', não 'dia'. `janela('dia')` até cai nas
   datas de hoje por acaso, mas `pintarPeriodos()` acende o botão comparando a chave com
   PERIODO — com 'dia' a tela abriria com NENHUM botão aceso, e o estado ficaria fora do
   conjunto de filtros válidos. Copiei o nome da Girassol sem conferir o produtor desta tela. */
let PERIODO = 'hoje', HIST = null, PAGINA = 1;
/* ⚠️ `_ultimaPaginaOk` = última página que REALMENTE carregou; é pra onde a tela volta quando uma
   falha deixa `PAGINA` apontando pra uma página que não está na tela.
   ⚠️ DECLARADA AQUI, no topo, junto de `PAGINA`: eu tinha posto o `let` 38 linhas DEPOIS do
   primeiro uso — `let` tem zona morta temporal, então a primeira falha de página explodiria com
   "Cannot access before initialization" em vez de mostrar o aviso. `node --check` não pega isso. */
let _ultimaPaginaOk = 1;
/* ⚠️ Codex #621 (P1): a janela (de|ate) da última página boa TAMBÉM mora aqui no topo. Eu a li na
   falha sem nunca declará-la — ReferenceError na 1ª falha (ex.: carga inicial), e a tela ficava
   em "carregando a lista…" sem os botões. `null` = nenhuma página carregou ainda. */
let _ultimaJanelaOk = null;
let SEQ_CARDS = 0, SEQ_LINHAS = 0;

/* os períodos que a tela oferece — os mesmos nomes da AMB, pra quem usa as duas não reaprender */
const PERIODOS = [
  ['hoje','Hoje'], ['ontem','Ontem'], ['7d','7 dias'], ['30d','30 dias'],
  ['mes','Mês'], ['mesant','Mês anterior'], ['ano','Ano'],
  /* 01/10 — o dono: "percebi q não consigo filtrar um mês específico... um período
     específico". A Girassol e a AMB têm isto desde sempre; a GOOD ficou sem, e é a empresa
     cujo histórico ele está justamente reconstruindo — sem período livre, não dá pra abrir
     um mês do backfill e conferir se entrou certo. */
  ['custom','Escolher'],
];

/* as datas do período livre: começam no mês passado inteiro, que é o caso de uso mais comum
   (olhar um mês fechado), e não em "hoje até hoje", que não mostra nada */
let P_DE = '', P_ATE = '';

function janela(p){
  const hoje = hojeSP();
  let de = hoje, ate = hoje;
  if(p==='hoje'){}
  else if(p==='ontem'){ const o = spDate(Date.now()-86400000); de=o; ate=o; }
  else if(p==='7d'){ de = spDate(Date.now()-6*86400000); }
  else if(p==='30d'){ de = spDate(Date.now()-29*86400000); }
  else if(p==='mes'){ de = hoje.slice(0,8)+'01'; }
  else if(p==='mesant'){ const [Y,M] = hoje.split('-').map(Number); const pm = new Date(Y,M-2,1);
    const y2 = pm.getFullYear(), m2 = String(pm.getMonth()+1).padStart(2,'0');
    de = y2+'-'+m2+'-01'; ate = y2+'-'+m2+'-'+String(new Date(Y,M-1,0).getDate()).padStart(2,'0'); }
  else if(p==='ano'){ de = hoje.slice(0,4)+'-01-01'; }
  else if(p==='custom'){ de = P_DE || hoje; ate = P_ATE || hoje;
    /* invertido é erro de digitação, não pedido: troca em vez de devolver vazio e deixar o
       dono achando que o mês não tem venda */
    if(de > ate){ const t = de; de = ate; ate = t; } }
  return { de, ate };
}

function pintarPeriodos(){
  document.getElementById('periodos').innerHTML = PERIODOS.map(([k,r]) =>
    '<button class="per' + (k===PERIODO?' on':'') + '" onclick="trocar(\''+k+'\')">'+esc(r)+'</button>').join('')
    /* os dois campos só aparecem quando "Escolher" está ativo — poluir a barra com eles
       sempre visíveis atrapalha quem só quer clicar em "Mês" */
    + (PERIODO==='custom'
       ? '<span style="display:inline-flex;align-items:center;gap:6px;margin-left:6px">'
         + '<input type="date" id="pDe" value="'+esc(P_DE)+'" onclick="this.showPicker&&this.showPicker()" onchange="P_DE=this.value;trocar(\'custom\')" style="background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:4px 6px;font-size:12px">'
         + '<span style="opacity:.6;font-size:12px">até</span>'
         + '<input type="date" id="pAte" value="'+esc(P_ATE)+'" onclick="this.showPicker&&this.showPicker()" onchange="P_ATE=this.value;trocar(\'custom\')" style="background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:4px 6px;font-size:12px">'
         + '</span>'
       : '');
  const j = janela(PERIODO);
  document.getElementById('janela').textContent = j.de.split('-').reverse().join('/') + ' → ' + j.ate.split('-').reverse().join('/');
}

function trocar(p){
  /* 01/10 — ao entrar no período livre SEM data escolhida, começa no MÊS PASSADO INTEIRO.
     Se abrisse vazio, `janela()` cairia em "hoje até hoje" e a tela viria zerada — o dono
     clicaria em "Escolher" e concluiria que o mês não tem venda, que é o pior resultado
     possível numa tela que ele usa justamente pra conferir o backfill. */
  if(p === 'custom'){
    if(!P_DE && !P_ATE){
      const [Y, M] = hojeSP().split('-').map(Number);
      const ant = new Date(Y, M - 2, 1);
      const y2 = ant.getFullYear(), m2 = String(ant.getMonth() + 1).padStart(2, '0');
      P_DE = y2 + '-' + m2 + '-01';
      P_ATE = y2 + '-' + m2 + '-' + String(new Date(y2, ant.getMonth() + 1, 0).getDate()).padStart(2, '0');
    } else if(!P_DE) P_DE = P_ATE;   // campo apagado: usa a outra ponta, sem jogar fora a data que o dono escolheu
    else if(!P_ATE) P_ATE = P_DE;
    /* Codex #551: invertido é troca de verdade nos valores guardados — senão os campos e P_DE/P_ATE
       seguem invertidos e a próxima edição age no papel errado de cada ponta */
    if(P_DE > P_ATE){ const t = P_DE; P_DE = P_ATE; P_ATE = t; }
  }
  /* Codex (P2): invertido é trocado AQUI, no estado, e não só em janela() — senão os campos
     seguem mostrando o intervalo invertido enquanto a legenda e a busca usam o contrário */
  if(p === 'custom' && P_DE > P_ATE){ const t = P_DE; P_DE = P_ATE; P_ATE = t; }
  /* ⚠️ Codex #621 (P2): `_ultimaPaginaOk` zera JUNTO com `PAGINA`. Sem isso, ver a página 4 do
     "Mês" e trocar pra "Hoje" com falha na página 1 fazia a tela "voltar" pra página 4 — número
     de OUTRO intervalo, que em "Hoje" nem existe. */
  PERIODO = p; PAGINA = 1; _ultimaPaginaOk = 1; pintarPeriodos(); carregar();
}
function recarregar(){ PAGINA = 1; _ultimaPaginaOk = 1; carregar(); }

async function carregar(){
  const meu = ++SEQ_CARDS;   // Codex (P2): resposta atrasada de um período trocado não pode sobrescrever o atual
  pintarPeriodos();
  const j = janela(PERIODO);
  document.getElementById('cards').innerHTML = '<div class="dim">carregando…</div>';
  /* Codex #579 (P2): Por Canal/Top produtos do período anterior não ficam na tela durante a troca
     nem depois de uma falha (o ramo de erro retorna antes do pintarQuebras) */
  const qb = document.getElementById('quebras'); if(qb) qb.innerHTML = '';
  let d = null;
  try {
    const r = await fetch(MOD+'/historico-longo?de='+j.de+'&ate='+j.ate, {credentials:'same-origin'});
    d = await r.json().catch(()=>null);
  } catch(e){ d = null; }
  if(meu !== SEQ_CARDS) return;   // o usuário já trocou de período enquanto isto estava no ar

  if(!(d && d.ok && d.totais)){
    /* dizer O QUE aconteceu, não só que falhou — a mensagem genérica manda procurar no lugar errado */
    const motivo = (d && d.erro) ? esc(d.erro) : 'não consegui falar com o servidor';
    document.getElementById('cards').innerHTML =
      '<div class="aviso">Não deu pra carregar o período: <b>'+motivo+'</b>.' +
      ' Isto <b>não</b> quer dizer que não houve vendas — tente de novo em instantes.</div>';
    document.getElementById('tabela').innerHTML = '';
    return;
  }
  HIST = d;
  /* a origem chega FORA de `totais` (é do período, não um total) — carrego junto pra o card
     não precisar de um segundo parâmetro atravessando três funções */
  d.totais.__aliquotas = d.aliquotas_usadas || null;
  pintarCards(d.totais);
  /* Codex #579 (P1): `canais` e `skus` vêm IRMÃOS de `totais` na resposta, não dentro dele —
     eu chamava o pintarQuebras com `d.totais` e as duas seções nasceriam SEMPRE VAZIAS, sem
     erro nenhum na tela. É o pior tipo de bug neste painel: pareceria "a GOOD não tem dado".
     Passa a resposta inteira, e o faturamento vem de `d.totais` lá dentro. */
  pintarQuebras(d);
  pintarAvisos(d.totais, d.truncado);
  /* 18/09 — período vazio não é "não há vendas": pode ser só o período errado. A GOOD tem
     histórico só de agosto, e a tela abria em "Mês" (setembro) mostrando tudo zerado — o dono
     concluiu, com razão, que não havia venda alguma. Agora ela DIZ onde tem dado. */
  if(Number(d.totais.pedidos||0) === 0) avisarOndeTemDado();
  carregarLinhas();
}

function pintarCards(t){
  const fat = Number(t.faturamento)||0, imp = Number(t.imposto)||0;
  const cus = Number(t.custo)||0, com = Number(t.comissao)||0, fre = Number(t.frete)||0;
  const mc  = Number(t.margem)||0, ped = Number(t.pedidos)||0, un = Number(t.unidades)||0;
  const cards = [
    ['💰','Faturamento Total', BRL(fat), ped+' pedidos · '+un+' unidades'],
    ['🧾','Impostos', BRL(imp), legendaImposto(t, fat, imp)],
    ['📦','Custo de Produtos', BRL(cus), un+' unidades vendidas'],
    ['🚚','Taxas e Fretes', BRL(com+fre), fat>0 ? PCT((com+fre)/fat*100)+' do faturamento' : '—'],
    ['💎','Lucro Bruto (M.C.)', BRL(mc), fat>0 ? PCT(mc/fat*100) : '—'],
    ['🧮','Ticket Médio', BRL(ped>0 ? fat/ped : 0), 'faturamento ÷ pedidos'],
  ];
  document.getElementById('cards').innerHTML = cards.map(([ic,tit,val,sub]) =>
    '<div class="card"><div class="card-tit">'+ic+' '+esc(tit)+'</div>' +
    '<div class="card-val">'+esc(val)+'</div><div class="card-sub">'+esc(sub)+'</div></div>').join('');
}

/* 02/10 — POR CANAL, POR ESTADO E TOP PRODUTOS na GOOD. Pedido do dono: "segue criando os
   cards todos e acessos, botões todos multiloja e que funcione pra GOOD".

   ⚠️ NÃO COPIEI O PAINEL DA AMB POR CIMA, e vale registrar porque foi a primeira coisa que
   tentei: a cópia passou, mas SETE testes ficaram vermelhos — a GOOD abre no DIA (a Girassol
   abre no mês, por pedido dele), decide "alíquota apurada" pela tabela, e tem o cuidado com
   card vazio. Copiar apagava os três. Desfiz e vim acrescentar no lugar certo.

   Os dados já vêm do `/historico-longo`, que é lib compartilhada (`canais`, `dias`, `skus`) —
   não precisou de rota nova nem de chamada ao Bling. */
function pintarQuebras(t){
  const alvo = document.getElementById('quebras');
  if (!alvo) return;
  const fat = Number((t.totais && t.totais.faturamento) ?? t.faturamento) || 0;
  /* Codex #579: produto divide por `totais.produtos` (mesma base de valor_produto); canal, por faturamento */
  const prod = Number(t.totais && t.totais.produtos) || fat;
  const bloco = (titulo, linhas, base) => !linhas.length ? '' :
    '<div class="card" style="grid-column:1/-1"><div class="card-tit">' + titulo + '</div>' +
    '<table style="width:100%;font-size:13px;margin-top:6px"><tbody>' +
    linhas.map(l => '<tr><td style="padding:3px 0">' + esc(l[0]) + '</td>' +
      '<td style="text-align:right">' + esc(BRL(l[1])) + '</td>' +
      '<td style="text-align:right;opacity:.65;width:64px">' + (base > 0 ? esc(PCT(l[1] / base * 100)) : '—') + '</td></tr>').join('') +
    '</tbody></table></div>';

  const val = v => Number(v && typeof v === 'object' ? (v.fat ?? v.faturamento) : v) || 0;
  const porCanal = Object.entries(t.canais || {})
    .map(([k, v]) => [k || 'outro', val(v)])
    .sort((x, y) => y[1] - x[1]);
  /* Codex #579: `skus` é ARRAY de {sku, fat…} (a chave do entries seria o índice) e vem cortado por
     margem; o ranking por faturamento vem pronto do servidor em `skus_top_fat`. */
  const regs = Array.isArray(t.skus_top_fat) ? t.skus_top_fat : (Array.isArray(t.skus) ? t.skus : []);
  const porSku = regs.map(x => [x.sku || '—', val(x)])
    .sort((x, y) => y[1] - x[1]).slice(0, 15);

  /* 02/10 — POR DIA, a terceira seção. O dado (`dias`) já vem do `/historico-longo`, que é lib
     compartilhada: cada dia traz `fat`, `pedidos` e `mar`. Barra proporcional ao MAIOR dia do
     período — é o que deixa o pico visível sem biblioteca de gráfico. Os 31 últimos, em ordem
     de data, porque o dono olha o mês. */
  const diasTodos = Object.entries(t.dias || {})
    .map(([d, v]) => [d, Number(v && v.fat) || 0, Number(v && v.pedidos) || 0, Number(v && v.mar) || 0])
    .sort((x, y) => x[0] < y[0] ? -1 : 1);
  const truncou = diasTodos.length > 31;   // Codex #580: período longo corta — o card avisa
  const diasOrd = diasTodos.slice(-31);
  const maxDia = diasOrd.reduce((m, l) => Math.max(m, l[1]), 0);
  const blocoDia = !diasOrd.length ? '' :
    '<div class="card" style="grid-column:1/-1"><div class="card-tit">📅 Faturamento por Dia' +
    (truncou ? ' <span style="opacity:.65;font-weight:400;font-size:12px">(últimos 31 dias com venda do período)</span>' : '') + '</div>' +
    '<div class="tw"><table style="width:100%;min-width:420px;font-size:13px;margin-top:6px"><tbody>' +
    diasOrd.map(function (l) {
      const d = l[0], fatd = l[1], peds = l[2], mard = l[3];
      return '<tr><td style="padding:3px 0;white-space:nowrap">' + esc(d.slice(8) + '/' + d.slice(5, 7)) + '</td>' +
        '<td style="width:46%"><div style="background:#4f46e5;height:9px;border-radius:4px;width:' +
          (maxDia > 0 ? Math.max(2, Math.round(fatd / maxDia * 100)) : 0) + '%"></div></td>' +
        '<td style="text-align:right">' + esc(BRL(fatd)) + '</td>' +
        '<td style="text-align:right;opacity:.65;width:58px">' + esc(peds) + ' ped</td>' +
        '<td style="text-align:right;opacity:.65;width:72px">' + (fatd > 0 ? esc(PCT(mard / fatd * 100)) : '—') + '</td></tr>';
    }).join('') +
    '</tbody></table></div></div>';

  alvo.innerHTML = bloco('🛒 Por Canal', porCanal, fat) + bloco('🏆 Top 15 produtos', porSku, prod) + blocoDia;
}

/* 18/09 — o card de imposto passa a dizer DE ONDE veio a alíquota. O dono olhou "15% do
   faturamento" logo depois de eu carregar as alíquotas apuradas da GOOD e teve que perguntar
   se tinham pegado: tinham, mas agosto não está na lista dele e caiu no padrão.
   Número sem origem obriga a perguntar, e perguntar toda vez custa o mesmo que não ter. */
function legendaImposto(t, fat, imp){
  const base = fat>0 ? PCT(imp/fat*100)+' do faturamento' : '—';
  const orig = t && t.__aliquotas || null;
  if(!orig) return base;
  const meses = Object.keys(orig).sort();
  if(!meses.length) return base;
  const fontes = [...new Set(meses.map(m => orig[m].fonte))];
  if(fontes.length === 1 && fontes[0] === 'apurada')
    return base + ' · alíquota apurada' + (meses.length===1 ? ' de '+meses[0] : '');
  if(fontes.length === 1 && fontes[0] === 'painel')
    return base + ' · alíquota salva no ⚙️';
  if(fontes.length === 1 && fontes[0] === 'padrao')
    return base + ' · ⚠️ alíquota PADRÃO — ' + (meses.length===1 ? meses[0]+' não apurado' : 'meses não apurados');
  /* período com meses de origens diferentes: dizer quais caíram no padrão, que é o que o dono
     precisa corrigir — os outros estão certos e não pedem ação */
  const semApurar = meses.filter(m => orig[m].fonte === 'padrao');
  // Codex (P2): painel+apurada misturados também caem aqui (fontes.length>1), mas nenhum mês
  // é padrão — sem este corte o card gritava "⚠️ padrão em " sem citar mês nenhum.
  if(!semApurar.length) return base + ' · alíquotas de fontes diferentes por mês';
  return base + ' · ⚠️ padrão em ' + semApurar.join(', ');
}

function pintarAvisos(t, truncado){
  const av = [];
  /* Codex #551: o servidor lê no máx. 60.000 linhas do período, das mais antigas pras mais novas.
     Período livre longo passa disso — sem o aviso, os cards omitiriam as vendas mais recentes em silêncio */
  if(truncado)
    av.push('⚠️ período grande demais: os totais cobrem só <b>parte</b> das vendas (as mais recentes ficaram de fora) — escolha um intervalo menor');
  /* estes três campos existem pra ser mostrados: são o que explica um número que parece errado */
  if(Number(t.pedidos_sem_imposto)>0)
    av.push(t.pedidos_sem_imposto+' pedido(s) <b>sem imposto calculado</b> — a alíquota do mês pode não estar definida no ⚙️');
  // Codex (P1): skus_sem_custo vem do servidor como ARRAY de SKUs, não contagem — Number([...]) dá NaN
  // e o aviso nunca aparecia, mesmo com SKU comum (alfanumérico) sem custo cadastrado.
  const _skusSemCusto = Array.isArray(t.skus_sem_custo) ? t.skus_sem_custo : [];
  if(_skusSemCusto.length>0)
    /* 01/10 — MOSTRA QUAIS SÃO. O aviso dizia só "60 SKU(s) sem custo (6.004 unidades)" e
       parava aí — o dono via o problema e não tinha como agir, porque o servidor JÁ MANDA a
       lista inteira em `skus_sem_custo` e a tela jogava fora, usando só o `.length`.
       Com 6.004 de 18.507 unidades (um terço do ano), o Lucro Bruto sai inflado; saber QUAIS
       SKUs é o que permite ligar o código antigo ao novo no de-para, ou cadastrar o custo.
       Mostra os 12 primeiros e diz quantos faltam — a lista inteira de 60 viraria parede de
       texto no rodapé. */
    /* Codex #558 (P2): o servidor corta a lista em 60, então `.length` NÃO é a contagem.
       Usa o total de verdade quando ele vem, e deixa claro que a lista é uma amostra — senão
       "60 SKUs" parece exaustivo e esconde o tamanho real do problema. */
    av.push((Number(t.skus_sem_custo_total) || _skusSemCusto.length)+' SKU(s) <b>sem custo</b> ('+(Number(t.un_sem_custo)||0)+' unidades) — a margem sai maior do que é'
      + '<div style="margin-top:6px;font-size:11px;opacity:.85;word-break:break-all">'
      + _skusSemCusto.slice(0,12).map(x => '<code>'+esc(String(x))+'</code>').join(' · ')
      + ((Number(t.skus_sem_custo_total) || _skusSemCusto.length) > 12
          ? ' <b>+'+((Number(t.skus_sem_custo_total) || _skusSemCusto.length)-12)+' outros</b>' : '')
      + '</div>');
  if(Number(t.impostos_recalculados)>0)
    av.push(t.impostos_recalculados+' imposto(s) recalculado(s) com a alíquota atual');
  /* Codex #564 (P2): sem isto o Lucro Bruto sobe depois do custo-sync e a tela não diz por quê */
  if(Number(t.margens_reconstruidas)>0)
    av.push(t.margens_reconstruidas+' linha(s) tiveram a <b>margem recalculada</b> agora que o custo foi cadastrado — o Lucro Bruto pode ter subido por isso');
  document.getElementById('avisos').innerHTML = av.length
    ? '<div class="bloco">' + av.map(a => '<div class="aviso">'+a+'</div>').join('') + '</div>' : '';
}

async function avisarOndeTemDado(){
  /* pergunta o ANO inteiro: se houver dado em qualquer mês, mostra quais — é a informação que
     transforma "não há vendas" em "não há vendas NESTE período". */
  const meu = SEQ_CARDS;   // Codex (P2): se o período mudar antes desta resposta chegar, esta
                            // busca (que nem passa por SEQ_CARDS no fetch principal) não pode
                            // sobrescrever o aviso do período que o dono já está vendo agora
  const ano = hojeSP().slice(0,4);   // ano pelo relógio de SP, como o resto da tela
  let d = null;
  try {
    const r = await fetch(MOD+'/historico-longo?de='+ano+'-01-01&ate='+ano+'-12-31', {credentials:'same-origin'});
    d = await r.json().catch(()=>null);
  } catch(e){ return; }
  if(meu !== SEQ_CARDS) return;
  if(!(d && d.ok && d.dias)) return;
  const meses = [...new Set(Object.keys(d.dias).map(x => x.slice(0,7)))].sort();
  if(!meses.length) return;
  const el = document.getElementById('avisos');
  /* 01/10 — A MENSAGEM MENTIA depois do backfill do ano. Ela afirmava "o backfill ainda não
     cobriu os outros meses" LOGO DEPOIS de listar que há histórico justamente neles — foi
     escrita quando a GOOD só tinha set/out, e virou alarme falso assim que o ano entrou
     (13.327 pedidos, 9 meses, em 01/10).
     Agora diz o que ajuda: o período escolhido não tem venda, e QUAIS meses têm — que é a
     informação pra ele clicar. O diagnóstico do backfill só aparece se houver BURACO de
     verdade: mês faltando no meio da faixa coberta. */
  /* Codex #557 (P2): mês sem venda NÃO é mês não importado, e a diferença
     corta nos dois sentidos. Um mês legítimo sem venda entre dois com venda seria acusado como
     buraco; e a falha típica do `backfillAnoGood()` é parar no primeiro mês ruim, deixando um
     PREFIXO contíguo (jan–abr) — nesse caso não há buraco no meio e o aviso escondia a falha
     de verdade, que é o caso que mais importa.
     Em vez de adivinhar pelas vendas, PERGUNTA ao backfill o que ele cobriu. Sem resposta,
     não acusa nada: "não sei" não pode virar acusação. */
  let falta = [];
  try {
    const rb = await fetch(MOD + '/backfill-status', { credentials: 'same-origin' });
    const db = await rb.json().catch(() => null);
    const feitos = (db && db.ano && Array.isArray(db.ano.feitos)) ? db.ano.feitos.map(x => String(x.mes).slice(5, 7)) : null;
    if (feitos && feitos.length) {
      const parou = db.ano.parou_em ? String(db.ano.parou_em).slice(5, 7) : null;
      /* o que o ano tentou cobrir vai de janeiro até onde ele parou (ou até o último feito) */
      const ate = parou || feitos[feitos.length - 1];
      for (let k = 1; k <= Number(ate); k++) {
        const mm = String(k).padStart(2, '0');
        if (!feitos.includes(mm)) falta.push(mm);
      }
      /* o que o backfill ainda tinha na fila quando parou também é cobertura que falta */
      if (Array.isArray(db.ano.faltam)) db.ano.faltam.forEach(m => { const mm = String(m).slice(-2); if (!falta.includes(mm)) falta.push(mm); });
      falta.sort();
    }
  } catch (e) { falta = []; }
  if (meu !== SEQ_CARDS) return;   /* Codex (P2): este segundo await também pode ficar velho — rechecar antes de tocar em `avisos` */
  el.innerHTML = '<div class="bloco"><div class="aviso">Nenhum pedido <b>neste período</b> — ' +
    'mas há histórico em: ' + meses.map(m => '<b>'+m+'</b>').join(', ') + '.' +
    (falta.length ? '<br>O backfill de ' + ano + ' <b>não cobriu</b>: ' + falta.map(m => '<b>'+ano+'-'+m+'</b>').join(', ') + '.' : '') +
    '</div></div>' + el.innerHTML;
}

    '<th>DATA</th><th>PEDIDO</th><th>CANAL</th><th>PRODUTO</th><th class="num">UN.</th>' +
    '<th class="num">VENDA</th><th class="num">CUSTO</th><th class="num">IMPOSTO</th>' +
    '<th class="num">TARIFA</th><th class="num">FRETE</th><th class="num">M.C.</th><th class="num">MC %</th>' +
    '</tr></thead><tbody>' +
    peds.map(linhaPedido).join('') + '</tbody></table></div>'
  ) : '<div class="dim">nenhum pedido neste período.</div>';

  const tp = d.total_paginas || 1;
  document.getElementById('paginacao').innerHTML = tp > 1 ? (
    '<button class="btn" '+(paginaPedida<=1?'disabled':'')+' onclick="irPagina('+(paginaPedida-1)+')">← Anterior</button>' +
    '<span class="dim"> página '+paginaPedida+' de '+tp+' </span>' +
    '<button class="btn" '+(paginaPedida>=tp?'disabled':'')+' onclick="irPagina('+(paginaPedida+1)+')">Próxima →</button>'
  ) : '';
}

function irPagina(n){ PAGINA = Math.max(1, n); carregarLinhas(); }

function linhaPedido(o){
  const itens = o.itens || [];
  // Codex (P1): /historico-linhas devolve numero/un/vnota e /buscar-lucro devolve numero/vnota/mc —
  // nenhum dos dois manda pedido/unidades/valor_total, que era o que esta função lia. Resultado:
  // pedido em branco, venda R$ 0,00 e M.C. errada em toda linha. Lê o nome que cada rota manda de
  // verdade; "unidades" soma sempre os itens (a fonte mais confiável — presente nas duas rotas).
  const numPedido = o.pedido != null ? o.pedido : o.numero;
  const venda = Number(o.valor_total != null ? o.valor_total : o.vnota) || 0;
  const un = itens.reduce((s,i) => s + (Number(i.qtd)||0), 0) || Number(o.unidades != null ? o.unidades : o.un) || 0;
  // margem: historico-linhas manda `margem`; buscar-lucro manda `mc` (null quando a M.C. está
  // incompleta — precisa continuar "—", não virar R$ 0,00 por causa do Number(null) === 0).
  const mcBruta = o.margem != null ? o.margem : o.mc;
  const mc = mcBruta != null ? Number(mcBruta) : NaN;
  const pct = venda>0 && isFinite(mc) ? (mc/venda*100) : null;
  const prod = itens.map(function(i){
    /* quantidade SEMPRE, e o nome quando existir — foi o conserto de 16/09 na tela da AMB:
       a tabela do banco escondia o "1×" e só mostrava o SKU */
    const nm = i.descricao || '';
    return '<div><b class="qtd">'+(Number(i.qtd)||1)+'×</b> '+esc(i.sku||'') +
           (nm ? '<div class="desc">'+esc(nm)+'</div>' : '') + '</div>';
  }).join('');
  return '<tr>' +
    '<td>'+esc(String(o.data||'').slice(8,10)+'/'+String(o.data||'').slice(5,7))+'</td>' +
    '<td><b>'+esc(numPedido||'')+'</b></td>' +
    '<td>'+esc(o.canal||'')+'</td>' +
    '<td>'+prod+'</td>' +
    '<td class="num">'+(un||itens.length)+'</td>' +
    '<td class="num">'+BRL(venda)+'</td>' +
    '<td class="num">'+BRL(o.custo)+'</td>' +
    '<td class="num">'+BRL(o.imposto)+'</td>' +
    '<td class="num">'+BRL(o.comissao)+'</td>' +
    '<td class="num">'+BRL(o.frete)+'</td>' +
    '<td class="num '+(mc>=0?'ok':'bad')+'">'+(isFinite(mc)?BRL(mc):'—')+'</td>' +
    '<td class="num">'+(pct!=null?PCT(pct):'—')+'</td>' +
    '</tr>';
}

async function buscar(){
  const q = document.getElementById('busca').value.trim();
  if(!q){ document.getElementById('resBusca').innerHTML=''; return; }
  document.getElementById('resBusca').innerHTML = '<div class="dim">procurando…</div>';
  let d = null;
  try {
    const r = await fetch(MOD+'/buscar-lucro?q='+encodeURIComponent(q), {credentials:'same-origin'});
    d = await r.json().catch(()=>null);
  } catch(e){ d = null; }
  if(!d){
    document.getElementById('resBusca').innerHTML =
      '<div class="aviso">Não consegui fazer a busca agora — isto <b>não</b> quer dizer que o pedido não existe.</div>';
    return;
  }
  if(!d.ok){
    // Codex (P2): d truthy com ok:false é uma FALHA (Supabase fora do ar, sessão expirada…),
    // não uma busca que terminou vazia — tratar como "nada encontrado" manda o operador
    // duvidar de um pedido real só porque a busca nem chegou a rodar.
    const motivo = d.erro ? esc(d.erro) : 'não consegui fazer a busca agora';
    document.getElementById('resBusca').innerHTML =
      '<div class="aviso">Não consegui buscar: <b>'+motivo+'</b> — isto <b>não</b> quer dizer que o pedido não existe.</div>';
    return;
  }
  const achados = d.pedidos || (d.pedido ? [d.pedido] : []);
  document.getElementById('resBusca').innerHTML = achados.length
    ? '<div class="tw"><table class="tab"><tbody>' + achados.map(linhaPedido).join('') + '</tbody></table></div>'
    : '<div class="aviso">Nada encontrado para <b>'+esc(q)+'</b>.</div>';
}

async function abrirConfig(){
  document.getElementById('modalConfig').style.display = 'flex';
  document.getElementById('camposAliq').innerHTML = '<div class="dim">carregando…</div>';
  let d = null;
  try {
    const r = await fetch(MOD+'/config-fiscal', {credentials:'same-origin'});
    d = await r.json().catch(()=>null);
  } catch(e){ d = null; }
  if(!(d && d.ok)){
    // Codex (P2): erro (ou sessão de admin expirada) não pode virar tabela vazia — vazio aqui
    // é lido como "usa o padrão do código", e o modal chegava a anunciar "15% · padrão —
    // falta apurar" pra meses passados sem ter carregado configuração nenhuma.
    const motivo = (d && d.erro) ? esc(d.erro) : 'não consegui falar com o servidor';
    document.getElementById('camposAliq').innerHTML =
      '<div class="aviso">Não consegui carregar as alíquotas: <b>'+motivo+'</b>.</div>';
    return;
  }
  const aliq = (d.config && d.config.aliquotas) || {};
  /* 18/09 — o ⚙️ mostrava doze campos vazios, e vazio ali significa "usa a tabela do código" —
     tabela que o dono não vê. Ele não tinha como saber qual alíquota estava valendo em cada
     mês. Agora a rota devolve as APURADAS e cada linha diz o que vale hoje e de onde vem. */
  const apuradas = d.apuradas || {};
  /* 18/09 — APURADO NÃO É O MESMO QUE "ESTÁ NA TABELA". A tabela da AMB e da Girassol tem os
     dois misturados (a AMB estima jul-dez pela curva do RBT12p; a Girassol deixava agosto em
     15% de palpite), e só o comentário em prosa dizia qual era qual.
     O ritual do dono é mensal: ele ESTIMA o mês e, por volta do dia 20, a contabilidade manda a
     apuração. Chamar a estimativa de "apurada" faria ele deixar de conferir o DAS de um mês
     achando que já conferiu — a mentira mais cara que esta tela poderia contar. */
  const jaApurados = new Set(d.apurados_meses || []);
  /* o que o DONO marcou (config), diferente do que o CÓDIGO traz como apurado (tabela) */
  const APURADAS = new Set((d.config && d.config.apuradas) || []);
  // Codex (P2): toISOString() é UTC puro — na última noite do mês em SP (UTC já virou dia 1
  // do mês seguinte) isto classificava o mês corrente como fechado e inventava um "falta
  // apurar" falso. hojeSP() é o relógio de SP que o resto da tela já usa (linha ~521).
  const hojeStr = hojeSP();
  const ano = hojeStr.slice(0,4);
  const hoje = hojeStr.slice(0,7);
  let html = '';
  for(let m=1; m<=12; m++){
    const k = ano+'-'+String(m).padStart(2,'0');
    const salvo = aliq[k];
    const apur = apuradas[k];
    /* a alíquota vai com a precisão que o dono informou (ele passou 11,819396%) — arredondar
       aqui esconderia justamente o dígito que ele conferiu no DAS. O PCT de uma casa serve pro
       card, não pra este campo. */
    const ALQ = v => String(v).replace('.', ',') + '%';
    let vale;
    if(salvo != null && Number(salvo) > 0) vale = '<b>'+ALQ(salvo)+'</b> · salva aqui';
    else if(apur != null && jaApurados.has(k)) vale = '<b>'+ALQ(apur)+'</b> · apurada';
    else if(apur != null)                  vale = '<b class="bad">'+ALQ(apur)+'</b> · ⚠️ ESTIMATIVA — falta a apuração';
    else if(k === hoje)                    vale = '<span class="dim">mês em andamento — usa o padrão até fechar</span>';
    else if(k > hoje)                      vale = '<span class="dim">mês ainda não fechou</span>';
    /* só mês PASSADO sem alíquota merece alarme: é o único que o dono pode resolver agora.
       Avisar sobre o mês corrente seria cobrar uma ação impossível, e alarme que não se pode
       atender ensina a ignorar o alarme. */
    else                                   vale = '<b class="bad">15%</b> · ⚠️ padrão — falta apurar';
    html += '<label class="linhaCfg"><span>'+k+'</span>' +
            /* 18/09 — ZERO NÃO É ALÍQUOTA, e a tela mostrava "0" como se fosse valor configurado. O
               backend já sabe disso desde 19/08 ("mês salvo como 0% era campo em BRANCO gravado por
               engano") e ignora o zero no cálculo — só a tela é que o exibia. O dono viu set-dez com
               0 e teve que perguntar; pior, salvar de novo REGRAVA o zero. */
            '<input class="campo mini" id="aliq_'+k+'" value="'+esc(salvo!=null&&Number(salvo)>0?salvo:'')+'" placeholder="—">' +
            '<span class="dim vale">'+vale+'</span>' +
            /* 18/09 — a marcação de APURADA é do dono: ninguém deduz do número se aquele valor
               veio da contabilidade ou é palpite dele. Sem ela, mês estimado e apurado ficam
               idênticos depois de salvos. */
            '<label class="dim" style="font-size:11px;display:flex;align-items:center;gap:3px" ' +
            'title="marque quando o valor vier da apuração da contabilidade; sem marca, é estimativa">' +
            '<input type="checkbox" data-apurada="'+k+'"'+(APURADAS.has(k)?' checked':'')+'> apurada</label>' +
            '</label>';
  }
  /* 22/09 (Codex P2) — PENDÊNCIA DE ANO ANTERIOR. O formulário desenha só os 12 meses do ano
     corrente, mas o servidor PRESERVA de propósito as alíquotas e marcações de anos passados.
     Sem uma linha aqui, um dezembro salvo e ainda não apurado some da tela na virada do ano:
     continua calculando imposto com a estimativa e não há como corrigir nem marcar.
     A linha vem com CAMPO, não só com a caixinha — quando a contabilidade manda a apuração de
     dezembro em janeiro, o valor quase nunca é igual ao palpite que ficou salvo. */
  const foraDoAno = Object.keys(aliq)
    .filter(k => k.slice(0,4) !== String(ano) && Number(aliq[k]) > 0 && !APURADAS.has(k))
    .sort();
  if(foraDoAno.length){
    html += '<div class="dim" style="margin:10px 0 4px">⚠️ Pendência de outro ano — ainda como estimativa:</div>';
    for(const k of foraDoAno){
      html += '<label class="linhaCfg"><span>'+k+'</span>' +
              '<input class="campo mini" id="aliq_'+k+'" data-fora-ano="1" value="'+esc(aliq[k])+'">' +
              '<span class="dim vale">salva aqui · <b class="bad">⚠️ estimativa</b></span>' +
              '<label class="dim" style="font-size:11px;display:flex;align-items:center;gap:3px" ' +
              'title="corrija o valor com a apuração e marque; sem marca, segue como estimativa">' +
              '<input type="checkbox" data-apurada="'+k+'" data-fora-ano="1"> apurada</label>' +
              '</label>';
    }
  }
  document.getElementById('camposAliq').innerHTML = html;
}
function fecharConfig(){ document.getElementById('modalConfig').style.display = 'none'; }

async function salvarConfig(){
  // precisa ser o MESMO ano que abrirConfig() usou pra nomear os campos ('aliq_'+k) — se um
  // usar hojeSP() e o outro o relógio local do navegador, os dois podem divergir bem na virada
  // do ano e o document.getElementById('aliq_'+k) abaixo vira null.
  const ano = hojeSP().slice(0,4);
  const aliquotas = {};
  const invalidos = [];
  for(let m=1; m<=12; m++){
    const k = ano+'-'+String(m).padStart(2,'0');
    const vTxt = (document.getElementById('aliq_'+k).value || '').trim().replace(',', '.');
    // Codex (P2): mês limpo manda `null` explícito — o servidor só APAGA a alíquota salva
    // quando recebe null; omitir a chave (como antes) fazia ele manter o valor antigo, ao
    // contrário do que o placeholder promete ("vazio = usa a tabela do código").
    /* 18/09 — o mesmo princípio da AMB e da Girassol: campo que está apenas EXIBINDO a
       alíquota apurada do código não pode virar config ao salvar. Aqui o campo já nasce vazio
       quando não há valor salvo (o valor apurado aparece ao lado, não dentro), então este
       ramo do vazio já resolve — o comentário fica pra quem mexer depois não "melhorar" isso
       preenchendo o campo com o valor de fábrica. */
    if(vTxt === ''){ aliquotas[k] = null; continue; }
    const n = Number(vTxt);
    /* 18/09 — zero recebe o MESMO tratamento de campo limpo: manda null e o servidor apaga.
       Antes ele era gravado como alíquota válida, o cálculo o ignorava (regra de 19/08) e a
       configuração ficava com um valor que não valia nada — a tela dizendo uma coisa e o
       imposto seguindo outra. */
    if(n === 0){ aliquotas[k] = null; continue; }
    // Codex (P2): valida ANTES de mandar — o servidor aceita só 0–40 e ignora em silêncio
    // qualquer coisa fora disso (texto vira null no JSON, fora da faixa não muda nada), mas
    // sempre respondia ok:true, então a tela anunciava "salvo" sem a alíquota ter sido aplicada.
    if(!isFinite(n) || n < 0 || n > 40){ invalidos.push(k); continue; }
    aliquotas[k] = n;
  }
  /* 22/09 (Codex P2) — os meses de ANO ANTERIOR também entram. O laço acima cobre só os 12 do
     ano corrente; sem isto, corrigir a apuração de um dezembro pendente não ia junto e a linha
     nova seria decorativa. Mesmo tratamento: vazio e zero apagam, fora da faixa barra tudo. */
  for(const el of document.querySelectorAll('[data-fora-ano="1"][id^="aliq_"]')){
    const k = el.id.slice(5);
    const vTxt = (el.value || '').trim().replace(',', '.');
    if(vTxt === ''){ aliquotas[k] = null; continue; }
    const n = Number(vTxt);
    if(n === 0){ aliquotas[k] = null; continue; }
    if(!isFinite(n) || n < 0 || n > 40){ invalidos.push(k); continue; }
    aliquotas[k] = n;
  }
  if(invalidos.length){
    document.getElementById('msgConfig').innerHTML = 'alíquota inválida em <b>'+invalidos.sort().join(', ')+'</b> (use 0 a 40) — nada foi salvo.';
    return;
  }
  document.getElementById('msgConfig').textContent = 'salvando…';
  try {
    const r = await fetch(MOD+'/config-fiscal', {
      method: 'POST', credentials: 'same-origin',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ aliquotas, apuradas: [...document.querySelectorAll('[data-apurada]')]
        .filter(c => c.checked && aliquotas[c.dataset.apurada] != null).map(c => c.dataset.apurada) })
    });
    const d = await r.json().catch(()=>null);
    if(!(d && d.ok)){
      document.getElementById('msgConfig').textContent = 'não consegui salvar. Tente de novo.';
      return;
    }
    document.getElementById('msgConfig').innerHTML =
      'salvo — os meses alterados estão sendo <b>recalculados no histórico</b>.';
    // Codex (P2): sem isto os rótulos "· apurada"/"· salva aqui" ficavam com a origem de ANTES
    // de salvar — o campo já mostrava o valor novo, mas o rótulo ao lado dizia a fonte antiga.
    abrirConfig();
    setTimeout(recarregar, 1500);
  } catch(e){ document.getElementById('msgConfig').textContent = 'não consegui salvar.'; }
}
