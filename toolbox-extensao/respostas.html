<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Config</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 320px; padding: 16px; margin: 0; background: #f9fafb;
    }
    h2 { font-size: 16px; margin: 0 0 12px; color: #1f2937; }
    label { display: block; font-size: 12px; color: #555; margin: 10px 0 4px; font-weight: 500; }
    input, select {
      width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px;
      font-size: 13px; box-sizing: border-box;
    }
    button {
      width: 100%; padding: 10px; background: #2563eb; color: white;
      border: none; border-radius: 6px; cursor: pointer; font-size: 14px;
      font-weight: 500; margin-top: 12px;
    }
    button:hover { background: #1d4ed8; }
    .status { margin-top: 10px; font-size: 12px; text-align: center; min-height: 16px; }
    .ok { color: #16a34a; }
    .err { color: #dc2626; }
    .hint { font-size: 11px; color: #888; margin-top: 4px; }
  </style>
</head>
<body>
<div style="margin-bottom:8px"><a href="popup.html" style="font-size:12px;text-decoration:none;color:#2563eb">← voltar ao menu</a></div>
  <h2>⚙️ Configuração</h2>
  <a id="abrir-painel-respostas" href="#" style="display:block;margin:6px 0 12px;padding:8px 10px;border-radius:6px;background:#1d4ed8;color:#fff;text-decoration:none;font-size:13px;text-align:center">✏️ Editar as respostas (abrir o painel)</a>


  <label>URL do serviço (Mover-Pedidos)</label>
  <input type="text" id="apiUrl" placeholder="https://mover-pedidos-aguardando-x-atendido.onrender.com">
  <div class="hint">URL do serviço, SEM /respostas-rapidas no final</div>

  <label>API Key</label>
  <input type="password" id="apiKey" placeholder="cole a RESPOSTAS_API_KEY aqui">

  <label>Loja ativa (fallback)</label>
  <select id="loja">
    <option value="AMBTOTAL">AMBTOTAL</option>
    <option value="GIRASSOL">GIRASSOL (Magazine Girassol)</option>
    <option value="GIMPO">GIMPO (GOOD Import)</option>
  </select>
  <div class="hint">Usada quando não consegue detectar pelo header do ML.</div>

  <label>
    <input type="checkbox" id="detectarAuto" checked style="width:auto; margin-right:6px;">
    <span style="font-size:13px;">Detectar loja automaticamente pelo ML</span>
  </label>

  <button id="salvar">Salvar</button>
  <button id="testar" style="background:#6b7280; margin-top:6px;">Testar conexão</button>
  <div id="status" class="status"></div>

  <script src="respostas.js"></script>
</body>
</html>
