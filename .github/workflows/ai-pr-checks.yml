name: AI pre-merge safety

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  ai-safety:
    name: ai-safety
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ⚠️ 11/09 (trazido do Devolucoes): sem instalar, os passos seguintes morrem com
      # "Cannot find module" e o erro aparece disfarcado de bug de codigo. O repo nao
      # versiona package-lock, entao `npm ci` falha com EUSAGE — usar `npm install`.
      # E confere se CADA dependencia declarada resolve, em vez de descobrir passos
      # adiante: a instalacao que "passou" mas nao instalou custou horas la.
      - name: Dependencias
        shell: bash
        run: |
          set -e
          npm install --silent --no-audit --no-fund || { echo "npm install FALHOU"; exit 1; }
          node -e "
            const p = require('./package.json');
            let falta = 0;
            for (const d of Object.keys(p.dependencies || {})) {
              try { require.resolve(d); console.log('  ok    ' + d); }
              catch { console.log('  FALTA ' + d); falta = 1; }
            }
            process.exit(falta);
          "

      - name: Sintaxe de todos os arquivos JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.js'             ! -path './node_modules/*'             ! -path './.git/*'             ! -path './.github/*'             -print0 |
          while IFS= read -r -d '' arquivo; do
            echo "node --check $arquivo"
            node --check "$arquivo"
          done

      - name: JavaScript embutido nos paineis
        shell: bash
        run: |
          node <<'NODE'
          'use strict';
          const fs = require('fs');
          const path = require('path');
          const cp = require('child_process');
          const os = require('os');

          const cfg = JSON.parse(fs.readFileSync('.github/espelhos.json', 'utf8'));
          let erros = 0;

          for (const modulo of cfg.modulos) {
            const arquivo = path.join(modulo, 'painel.html');
            const marca = path.join(modulo, 'painel-marca.js');
            let html;

            if (fs.existsSync(arquivo)) {
              html = fs.readFileSync(arquivo, 'utf8');
            } else if (fs.existsSync(marca)) {
              /* 27/10: o painel do galpão é a PEÇA ÚNICA (lib/checkout/painel) — confere o RENDERIZADO, que é o que
                 o servidor entrega (a empresa que migrou não tem mais painel.html na pasta) */
              try {
                html = require(path.resolve('lib/checkout/painel/painel-galpao.js')).renderizar(require(path.resolve(marca)));
              } catch (e) {
                console.error('Painel da peça única não renderizou:', modulo, e.message);
                erros++;
                continue;
              }
            } else {
              console.error('Painel não existe:', arquivo);
              erros++;
              continue;
            }
            const blocos = [...html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/g)]
              .map(x => x[1])
              .sort((a, b) => b.length - a.length);

            const maior = blocos[0] || '';
            const tmp = path.join(os.tmpdir(), 'ai-check-' + modulo + '.js');

            fs.writeFileSync(tmp, maior);

            const r = cp.spawnSync('node', ['--check', tmp], {
              encoding: 'utf8'
            });

            if (r.status !== 0) {
              console.error(modulo + '/painel.html com JavaScript inválido');
              console.error(r.stderr);
              erros++;
            } else {
              console.log('OK:', modulo + '/painel.html');
            }
          }

          process.exit(erros ? 1 : 0);
          NODE

      # ⚠️ 11/09 — BOOT REAL, o passo que faltava neste repo.
      #
      # Motivo medido em UM DIA: o `node --check` e a bateria passaram e mesmo assim
      # foram pra producao (a) uma variavel fora de escopo que derrubava ?status=1 com
      # ReferenceError (CUSTO_FILE, #374) e (b) um `opts is not defined` que quebrou o
      # cron inteiro do servico do Shopee. Os dois so aparecem quando o processo SOBE.
      #
      # O servidor sobe numa porta propria, com ADMIN_KEY de teste e as pastas de dados
      # apontadas pra area temporaria do runner (nada toca /data de verdade), e o passo
      # so passa se a raiz responder.
      - name: Boot real + rotas de status
        shell: bash
        env:
          PORT: '3979'
          ADMIN_KEY: teste-ci
          ML_FULL_DIR: ${{ runner.temp }}/ml-full
          ML_FULL_CONF_ARQ: ${{ runner.temp }}/ml-full-conferidas.json
        run: |
          node <<'NODE'
          const cp = require('child_process');
          const filho = cp.spawn('node', ['index.js'], { env: process.env, stdio: 'pipe' });
          let log = '', saiu = false;
          filho.stdout.on('data', d => log += d);
          filho.stderr.on('data', d => log += d);
          filho.on('exit', () => { saiu = true; });
          (async () => {
            const t0 = Date.now();
            while (Date.now() - t0 < 30000) {
              await new Promise(r => setTimeout(r, 500));
              if (saiu) { console.log('BOOT FALHOU — o processo morreu:\n' + log.slice(-2000)); process.exit(1); }
              try {
                const r = await fetch('http://localhost:' + process.env.PORT + '/');
                console.log('BOOT OK -- a raiz respondeu HTTP ' + r.status);
                /* O boot sozinho NAO basta -- medido: reintroduzi de proposito a variavel fora de escopo do #374 e o
                   servidor subiu igual, porque o ReferenceError so acontece quando a ROTA e chamada. Por isso as rotas
                   de status (que so leem memoria e disco, nao falam com o Bling) sao batidas aqui.
                   01/11 (auditoria do Codex, achado F12): antes so 5xx derrubava -- 404, 401 e 403 contavam como
                   SUCESSO (rota sumida ou autenticacao quebrada passavam verdes). Agora cada chamada tem o status E o
                   formato esperados, e ha CONTROLES NEGATIVOS: sem a chave a rota tem que RECUSAR, rota inexistente
                   tem que dar 404, e o caminho alternativo do F01 (/pedido/debugging/1, sem credencial) tem que pedir
                   login -- se a protecao cair, o check cai junto. */
                const K = '&k=' + process.env.ADMIN_KEY;
                const P = 'http://localhost:' + process.env.PORT;
                const ehJson = (t) => { try { return JSON.parse(t); } catch (e) { return null; } };
                const casos = [
                  { rota: '/', status: 200, forma: (j) => j && j.status === 'ok' && Array.isArray(j.empresas) && ['good', 'amb', 'girassol'].every((e) => j.empresas.some((x) => x && x.id === e)) },
                  { rota: '/amb-checkout-offline/custo-sync?status=1' + K, status: 200, forma: (j) => j && j.ok === true && typeof j.rodando === 'boolean' },
                  { rota: '/girassol-backup-offline/custo-sync?status=1' + K, status: 200, forma: (j) => j && j.ok === true && typeof j.rodando === 'boolean' },
                  { rota: '/good-checkout-offline/custo-sync?status=1' + K, status: 200, forma: (j) => j && j.ok === true && typeof j.rodando === 'boolean' },
                  { rota: '/ml-full/varrer-serie?empresa=good&status=1' + K, status: 200, forma: (j) => j && j.ok === true && j.empresa === 'good' },
                  /* controles negativos */
                  { rota: '/amb-checkout-offline/custo-sync?status=1', status: 401, forma: (j) => j && j.ok === false },
                  { rota: '/ml-full/varrer-serie?empresa=good&status=1', status: 404, forma: (j) => j && j.error === 'not found' },
                  { rota: '/nao-existe-ci-xyz', status: 404, forma: null },
                  { rota: '/girassol-backup-offline/pedido/debugging/1', status: 401, forma: (j) => j && j.ok === false },
                ];
                let ruins = 0;
                for (const c of casos) {
                  const nome = c.rota.split('?')[0] + (c.rota.includes('&k=') ? ' (com a chave)' : (c.status >= 400 ? ' (sem credencial)' : ''));
                  try {
                    const rr = await fetch(P + c.rota);
                    const txt = await rr.text();
                    const j = ehJson(txt);
                    const okStatus = rr.status === c.status;
                    const okForma = !c.forma || !!c.forma(j);
                    if (okStatus && okForma) console.log('  OK ' + nome + ' -> HTTP ' + rr.status);
                    else { console.log('  XX ' + nome + ' -> HTTP ' + rr.status + ' (esperado ' + c.status + (okForma ? '' : ', formato inesperado') + ') ' + txt.slice(0, 200)); ruins++; }
                  } catch (e) { console.log('  XX ' + nome + ' -> ' + e.message); ruins++; }
                }
                filho.kill('SIGKILL');
                if (ruins) { console.log('\n' + ruins + ' verificacao(oes) falharam -- nao sobe assim'); process.exit(1); }
                console.log('rotas de status e controles negativos conferidos');
                process.exit(0);
              } catch (e) { /* ainda subindo */ }
            }
            console.log('BOOT FALHOU — nao respondeu em 30s:\n' + log.slice(-2000));
            filho.kill('SIGKILL');
            process.exit(1);
          })();
          NODE

      - name: Verificacao concluida
        run: echo "ai-safety passou (sintaxe + paineis + dependencias + boot real)"
