name: verifica-integridade
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22   # 15/11 (Codex P2-12): a mesma versão do .node-version e do engines
      # ⚠️ 11/09: o verifica passou a RODAR a bateria de scripts/teste-*.js (antes ela não
      # rodava em lugar nenhum — testes eram decoração, e foi assim que o custo de kit levou
      # 4 PRs). Testes de verdade precisam das dependências: sem este passo, o checkout limpo
      # do CI derruba o verifica com "Cannot find module 'adm-zip'" e o PR fica vermelho por
      # ambiente, não por código. 15/11 (Codex P2-12): com o package-lock.json versionado, `npm ci`
      # instala exatamente o que foi testado (e o mesmo que o Render instala).
      - name: Dependências
        run: npm ci --no-audit --no-fund
      - name: Verificador de integridade (sintaxe + espelhos + features + bateria)
        # 15/11 (Codex P2-14): o CI tem rede — verificação inconclusiva (paridade remota sem resposta) aqui é FALHA, não aviso
        env:
          VERIFICA_EXIGE_CONCLUSIVO: '1'
        run: node scripts/verifica.js
