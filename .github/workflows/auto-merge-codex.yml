# .github/workflows/auto-merge-codex.yml — MOVER-PEDIDOS
# (replicado do Devolucoes em 10/09/2026, onde o ciclo passou a funcionar;
#  as notas de batalha [b213-b265] sao de la e ficam como historico vivo)
#
# O LOOP: Codex revisa -> se apontar, o Claude corrige -> repete.
# (o merge e do dono; automatizar so depois que a automacao funcionar)
#
# [stated] "não tem um jeito de ficar revisando esse PR sem eu ter q avisar?"
#
# Sem isto, o dono precisa dizer "unable" a cada rodada pra eu ir buscar a
# revisao. Sao 10+ rodadas num PR grande — avisos que nao deveriam existir.
#
# ⚠️ AUTENTICACAO — historico do chamado com a Anthropic:
#
#   1. O suporte (Warren, 27/08) apontou que qualquer variavel `ANTHROPIC_*`
#      num bloco `env:` SOBRESCREVE o token OAuth em silencio.
#      ⚠️ DESCARTADO EM 08/09: ele confirmou por e-mail que NAO e a causa
#      aqui — nenhuma variavel dessas existe neste repo, e o issue citado
#      (claude-code#34826) e sobre o CLI, nao sobre a action.
#
#   2. O token vai em `with:`, como `claude_code_oauth_token`. NUNCA em
#      `env:`. Isto continua valendo e ja esta correto abaixo.
#
#   3. A assinatura Max dele COBRE isto — nao e cobrado por uso, ao contrario
#      da autenticacao por API key.
#
# ⚠️ ESTADO EM 09/09: o passo do Claude falha com `401 Invalid bearer token`.
#   O token chega e a API rejeita. O caso esta com a engenharia da Anthropic
#   (log bruto enviado). Ate la, este workflow NAO corrige nada — quem
#   corrige sou eu, na conversa. O `continue-on-error` abaixo existe pra
#   isso nao bloquear a entrega.
#
# ⚠️ PRE-REQUISITO: o app do Claude precisa estar instalado NESTE repo.
#   https://github.com/apps/claude -> Configure -> marcar este repositorio.
#   Sem isso a action falha com "Claude Code is not installed on this
#   repository", que foi o que aconteceu na primeira tentativa. Estar
#   instalado noutro repo (Mover-Pedidos) nao vale — e por repositorio.
#
# LIMITES DE PROPOSITO:
#   - no maximo 5 rodadas por PR (loop que nao converge nao vira acerto)
#   - ⚠️ AINDA NAO MERGEIA. O nome e o destino, nao o estado atual: hoje
#     este workflow so CORRIGE e etiqueta; quem mergeia e o dono.
#
#     O merge automatico entra DEPOIS que a automacao funcionar (decisao
#     dele em 09/09) — automatizar o merge enquanto o Claude nem consegue
#     rodar seria construir o ultimo andar sem o primeiro, e um merge que
#     dispara com a correcao NAO tendo acontecido e o pior cenario.
#
#     Quando entrar, tem que esperar o `ai-safety` (que roda em outro
#     arquivo) ficar VERDE — hoje este aqui nem o consulta.
#   - se nao fechar, poe `needs-human-review` e para

name: auto-merge-codex

on:
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Numero do PR'
        required: true

permissions:
  contents: write
  pull-requests: write
  checks: read
  id-token: write

concurrency:
  # uma execucao por PR: duas em paralelo brigariam pela mesma branch
  group: auto-merge-${{ github.event.pull_request.number || github.event.inputs.pr }}
  cancel-in-progress: false

jobs:
  ciclo:
    # b217: NUNCA bloquear o merge.
    #
    # Este workflow virou check obrigatorio sem querer, e quando o token
    # OAuth falha ele trava o PR — a automacao que veio ajudar impedindo a
    # entrega. A funcao dele e CORRIGIR, nao aprovar: se nao rodar, o
    # trabalho segue pelo caminho manual.
    #
    # `continue-on-error` faz o job terminar verde mesmo falhando. Quem
    # decide se o codigo presta e o `ai-safety`, que roda testes e boot.
    continue-on-error: true
    # so reage a apontamento do Codex, nao a comentario de gente
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.comment.user.login, 'chatgpt')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Contar rodadas
        id: rodadas
        # b261 - CONTAR nao pode travar. Se o `gh pr view` falhar, o passo
        # seguinte simplesmente nao roda — e isso ja e o comportamento
        # seguro. Derrubar o check por causa da contagem seria bloquear o
        # PR por um detalhe do proprio robo.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ github.event.pull_request.number || github.event.inputs.pr }}"
          # ⚠️ conta os COMMITS do Claude, nao comentarios.
          #
          # O gatilho e `pull_request_review_comment` (comentario inline),
          # mas `gh pr view --json comments` devolve os comentarios GERAIS
          # — outro objeto. No #198 eram 1 geral contra 11 inline.
          #
          # E o filtro procurava autor comecando com "claude": como o
          # Claude nunca conseguiu escrever (401), o contador SEMPRE deu
          # zero e o limite de 5 rodadas nunca valeu.
          #
          # Commit e o que a rodada de fato produz — se o Claude corrigiu,
          # ha commit; se nao corrigiu, nao ha rodada a contar.
          N=$(gh pr view "$PR" --json commits \
              --jq '[.commits[] | select(.authors[]?.login // "" | startswith("claude"))] | length')
          [ -z "$N" ] && N=0
          echo "n=$N" >> $GITHUB_OUTPUT
          echo "rodada $N de 5"

      - name: Claude corrige os apontamentos
        if: steps.rodadas.outputs.n < 5
        # b261 - ⚠️ NAO PODE DERRUBAR O CHECK.
        #
        # O OAuth deste passo falha desde agosto (401, na engenharia da
        # Anthropic). O workflow ja era "NUNCA bloquear" — mas o PASSO
        # falhando pintava o check `ciclo` de VERMELHO, e o GitHub mostrava
        # isso como impedimento no PR.
        #
        # Resultado: TODO PR parecia travado, e o dono tinha que avisar
        # "unable" pra eu descobrir que era infraestrutura, nao codigo.
        # Perdemos varias rodadas em 09/09 exatamente nisso.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          # ⚠️ AQUI, em `with:` — nunca num bloco `env:`
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # ═══════════════════════════════════════════════════════════════
          # b265 - ⚠️ O BASH NAO VEM LIGADO, E ERA POR ISSO QUE ELE NAO
          #        CORRIGIA NADA.
          #
          # DIAGNOSTICO (execucao #327, log com `show_full_output`): o
          # Claude rodou 29 segundos, tentou CINCO comandos e levou negacao
          # em TODOS:
          #
          #   permission_denials:
          #     git status && git branch -a && git log --oneline -10
          #     gh pr list --state open
          #     gh pr view 203 --json ...        (3 tentativas)
          #
          # Ele queria ENTENDER o PR antes de mexer — o que e o certo — e
          # nao conseguia nem rodar `git status`. Encerrou com
          # `stop_reason: end_turn`, e o passo ficou VERDE sem ter feito
          # nada. Custou US$ 0,074 pra nao fazer nada.
          #
          # ⚠️ A CAUSA: a action NAO inclui Bash no conjunto padrao. Ela vem
          # com operacoes de arquivo, comentarios e ferramentas do GitHub.
          # `--allowedTools` ADICIONA a lista de permitidos — sem ele, o
          # Bash simplesmente nao existe pro modelo.
          #
          # E ha um comportamento conhecido (claude-code#49874): UMA negacao
          # faz o modelo concluir que "Bash esta todo bloqueado" e desistir
          # de tudo, mesmo tendo ferramentas de arquivo disponiveis.
          #
          # 📌 LIBERO O NECESSARIO, NAO `Bash(*)`:
          #   git    ler estado, diff, e commitar na branch do PR
          #   gh     ler os apontamentos do Codex (a materia-prima do ciclo)
          #   node   rodar `verifica.js` e os testes ANTES de subir
          #   npm    instalar dependencias (o clone nasce sem node_modules)
          #
          # ⚠️ O QUE NAO LIBERO, de proposito: `rm`, `curl`, `sudo` e o
          # coringa `Bash(*)`. Um agente que roda sozinho num repo de
          # producao nao precisa de shell irrestrito — a diferenca entre
          # "corrige o PR" e "faz qualquer coisa" e essa lista.
          claude_args: |
            --allowedTools "Bash(git:*),Bash(gh:*),Bash(node:*),Bash(npm:*)"
          # ═══════════════════════════════════════════════════════════════

          # b215: MOSTRAR o que o Claude fez.
          #
          # Sem isto o erro e so "result is_error:true", que nao diz nada —
          # nem pra mim nem pro dono. Com `show_full_output`, o log traz o
          # que ele tentou e onde parou, que e como achamos as cinco causas
          # anteriores. Foi tambem o que o suporte da Anthropic pediu.
          show_full_output: 'true'

          # b214: LIBERAR o Codex, que e bot.
          #
          # A action recusa acionamento por bot por padrao — "Workflow
          # initiated by non-human actor". E uma trava de seguranca sensata:
          # sem ela, qualquer bot com acesso ao repo poderia mandar o Claude
          # mexer no codigo.
          #
          # Libero SO o Codex, nao `*`. Ele e quem revisa, entao e quem tem
          # motivo pra disparar o ciclo; abrir pra todos os bots seria uma
          # porta aberta sem necessidade.
          allowed_bots: 'chatgpt-codex-connector'

          # b213: o parametro e `prompt` — `direct_prompt` nao existe nesta
          # versao da action, e ela lista os validos no erro. Conferi contra
          # a lista que o log devolveu.
          prompt: |
            Leia os comentarios de revisao do Codex neste PR e corrija o que
            proceder, commitando na MESMA branch do PR.

            Voce TEM Bash liberado para: git, gh, node e npm. Use `gh api`
            para ler os apontamentos INLINE — eles nao aparecem em
            `gh pr view --json comments`, que traz so os comentarios gerais.

            REGRAS DA CASA:
            - analise cada apontamento antes de obedecer; se nao proceder,
              explique por escrito no PR em vez de mudar o codigo
            - ⚠️ o primeiro apontamento de uma funcao e SINTOMA: audite a
              funcao INTEIRA e suba UMA vez, em vez de consertar so o ponto
              apontado e voltar pra fila (isso custou 10 apontamentos em 3
              rodadas no #203)
            - rode `node scripts/verifica.js` antes de subir — e o unico
              comando da casa; ele so aceita ✅ PODE SUBIR
            - mexeu em .js de front, bumpe o ?v= no HTML que o carrega
              (GOOD: public/index.html; AMB: index-AMB.html)
            - ao consertar UMA empresa (girassol/good/amb), confira as
              outras DUAS antes de subir — os modulos sao espelhados
            - NUNCA mergeie por conta propria

      - name: Marcar pra revisao humana
        if: steps.rodadas.outputs.n >= 5
        # b261 - por ETIQUETA nao pode travar o merge. Se o `gh` falhar
        # (rate limit, permissao, label removida a mao), o PR fica valido do
        # mesmo jeito — a etiqueta e um aviso, nao um portao.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ github.event.pull_request.number || github.event.inputs.pr }}"
          gh pr edit "$PR" --add-label needs-human-review
          gh pr comment "$PR" --body "⚠️ 5 rodadas sem fechar. Parei o loop — vale olhar se ha decisao de produto aqui, nao so de codigo."
